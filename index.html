<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e4d36">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>West Millard Sheriff Posse | Duty Log</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --navy: #1e4d36; --navy2: #163a29; --bg: #f1f4f1; --card: #ffffff;
    --text: #1a1f1c; --muted: #5b665f; --line: #d9e2dc;
    --good: #2f855a; --warn: #b7791f; --bad: #c53030; --soft: #e8f1eb; --gold: #d4a93c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
  .top { background: var(--navy); color: #fff; padding: 14px 0 10px; border-bottom: 3px solid var(--gold); }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 46px; height: 46px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(212,169,60,.6); }
  .signlogo { display: block; width: 116px; height: 116px; margin: 4px auto 16px; border-radius: 50%; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  .title { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
  .title small { display: block; font-size: 12px; font-weight: 400; opacity: .8; }
  .who { font-size: 13px; opacity: .95; }
  .link { background: none; border: 0; color: #f3d9a4; text-decoration: underline; cursor: pointer; font: inherit; padding: 0 0 0 8px; }
  .tabs { background: var(--navy2); display: flex; gap: 2px; overflow-x: auto; padding: 0 8px; }
  .tabs button { background: none; border: 0; color: #cfe3d7; padding: 11px 14px; font: inherit; font-weight: 600;
    cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; }
  .tabs button.on { color: #fff; border-bottom-color: var(--gold); }
  .hidden { display: none !important; }
  main { padding-top: 16px; padding-bottom: 40px; }
  .sec { background: var(--card); border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; overflow: hidden; }
  .bar { background: var(--navy); color: #fff; font-weight: 700; padding: 9px 14px; display: flex;
    justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .body { padding: 14px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .tile { background: var(--soft); border-radius: 8px; padding: 10px 12px; text-align: center; }
  .tile .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; }
  .tile .val { font-size: 24px; font-weight: 700; color: var(--navy); }
  .tile .sub { font-size: 12px; color: var(--muted); }
  .goal { margin-top: 14px; }
  .goalhead { margin-bottom: 6px; }
  .pbar { height: 14px; background: var(--line); border-radius: 7px; overflow: hidden; }
  .pbar div { height: 100%; background: var(--good); border-radius: 7px; }
  .ok { color: var(--good); font-weight: 700; }
  .form label { display: block; font-weight: 600; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .form input, .form select, .form textarea { display: block; width: 100%; margin-top: 4px; padding: 10px;
    font: inherit; color: var(--text); border: 1px solid var(--line); border-radius: 7px; background: #fff; }
  .form textarea { resize: vertical; }
  .form input[type=file] { padding: 8px; background: var(--soft); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { display: block; font-weight: 400; font-size: 12px; margin-top: 3px; }
  .btn { background: var(--navy); color: #fff; border: 0; border-radius: 7px; padding: 12px 18px; font: inherit;
    font-weight: 700; cursor: pointer; width: 100%; }
  .btn:disabled { opacity: .6; }
  .btn.small { width: auto; padding: 7px 12px; font-size: 13px; }
  .btn.gray { background: #8a948f; }
  .btn.ghost { background: #fff; color: var(--navy); border: 1px solid var(--line); }
  select.mini { font: inherit; font-size: 13px; padding: 3px 6px; border-radius: 5px; border: 0; }
  /* Keyboard focus: a clear gold border on whatever you're on */
  .form input:focus, .form select:focus, .form textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,169,60,.45); }
  button:focus-visible, select.mini:focus-visible, a:focus-visible, input[type=checkbox]:focus-visible, input[type=radio]:focus-visible,
  tr.click:focus-visible, .mcard:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .seg { display: inline-flex; background: rgba(255,255,255,.15); border-radius: 6px; overflow: hidden; }
  .seg button { background: none; border: 0; color: #fff; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button.on { background: #fff; color: var(--navy); font-weight: 700; }
  .tblwrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { background: var(--soft); color: var(--navy); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  th:first-child, td:first-child, th.l, td.l { text-align: left; }
  tr.tot td { font-weight: 700; background: var(--soft); }
  tr.dim td { color: #9aa59f; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: #f3f8f4; }
  .entry { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .entry:last-child { border-bottom: 0; }
  .entry .what { font-weight: 600; }
  .entry .meta { font-size: 13px; color: var(--muted); }
  .entry .nums { text-align: right; font-size: 13px; white-space: nowrap; }
  .simbox { background: #fdf2dc; border: 1px solid #f0d9a8; border-radius: 8px; padding: 10px 12px; margin: -4px 0 12px; font-size: 14px; }
  .simbox .opt { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; margin-top: 6px; font: inherit; font-weight: 600; color: var(--navy); cursor: pointer; }
  .simbox .keep { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; padding: 8px 0 0; }
  .chev { display: inline-block; width: 14px; color: var(--navy2); font-weight: 700; }
  td.detail { white-space: normal; text-align: left; background: #f3f8f4; padding: 4px 12px 10px; }
  td.detail > * { max-width: calc(100vw - 64px); }
  .addm { background: none; border: 0; color: var(--navy2); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 8px 0 0; }
  .del { background: none; border: 0; color: var(--bad); cursor: pointer; font-size: 12px; padding: 2px 0 0 8px; }
  .edt { background: none; border: 0; color: var(--navy2); cursor: pointer; font-size: 12px; padding: 2px 0 0; font-weight: 600; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--soft); color: var(--muted); margin-left: 4px; font-weight: 600; }
  .tag.warn { background: #fdf2dc; color: var(--warn); }
  .tag.bad { background: #fde8e8; color: var(--bad); }
  .tag.good { background: #e3f4ea; color: var(--good); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .err { color: var(--bad); font-weight: 600; margin-bottom: 10px; }
  .grp { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .grp h4 { margin: 0; padding: 8px 10px; background: var(--soft); font-size: 14px; color: var(--navy); }
  .grp .r { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-top: 1px solid var(--line); font-size: 14px; }
  .grp .r .t { flex: 1; }
  .grp .r.x { color: #9aa59f; text-decoration: line-through; }
  .chartbox { position: relative; height: 280px; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 0 12px; }
  .thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--soft); }
  .mcard { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .mcard .mhead { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; cursor: pointer; }
  .mcard .mhead:hover { background: #f3f8f4; }
  .mcard .mname { font-weight: 700; }
  .mcard .mbody { border-top: 1px solid var(--line); background: #f8fbf9; padding: 10px 12px; font-size: 14px; }
  .mcard .mbody h5 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--navy); }
  .mcard .mbody h5:first-child { margin-top: 0; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .about p { margin: 6px 0; }
  .changelog { margin: 8px 0 0; padding-left: 20px; }
  .changelog li { margin: 4px 0; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #2b2422; color: #fff;
    padding: 10px 16px; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.2); opacity: 0; transition: opacity .25s;
    pointer-events: none; max-width: 90%; z-index: 10; }
  .toast.show { opacity: 1; }
  .toast.bad { background: var(--bad); }
  .center { text-align: center; padding: 30px; }

  /* Year-end report (looks like a printed letter-size page) */
  .rtools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .rtools .btn { width: auto; }
  .rpage { background: #fff; color: #111; max-width: 8.5in; margin: 0 auto 24px; padding: .6in .65in; box-shadow: 0 1px 6px rgba(0,0,0,.15);
    font: 12.5px/1.45 Georgia, "Times New Roman", serif; }
  .rpage .rhead { display: flex; align-items: center; gap: 18px; border-bottom: 3px double #1e4d36; padding-bottom: 12px; margin-bottom: 14px; }
  .rpage .rhead img { width: 84px; height: 84px; border-radius: 50%; }
  .rpage .org { font-size: 23px; font-weight: 700; letter-spacing: .6px; color: #1e4d36; text-transform: uppercase; }
  .rpage .rtitle { font-size: 16px; font-weight: 700; margin-top: 2px; }
  .rpage .rsub { font-size: 12.5px; color: #444; }
  .rpage h3 { font-size: 13.5px; text-transform: uppercase; letter-spacing: .5px; color: #1e4d36; margin: 18px 0 6px; border-bottom: 1px solid #c9d6ce; padding-bottom: 3px; }
  .rpage table { font-size: 12px; font-family: inherit; }
  .rpage th { background: #eef4f0; color: #1e4d36; font-size: 10.5px; }
  .rpage th, .rpage td { padding: 4px 6px; border-bottom: 1px solid #dde5e0; white-space: normal; }
  .rpage .kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .rpage .kv div { border: 1px solid #dde5e0; border-radius: 4px; padding: 6px 8px; }
  .rpage .kv b { display: block; font-size: 17px; color: #1e4d36; }
  .rpage .kv span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px; color: #555; }
  .rpage .fine { font-size: 10.5px; color: #555; margin-top: 10px; }
  .rpage .sig { margin-top: 40px; display: grid; grid-template-columns: 2fr 1fr; gap: 40px; page-break-inside: avoid; }
  .rpage .sig .line { border-top: 1px solid #111; padding-top: 4px; margin-top: 34px; }
  .rpage .sig .name { font-weight: 700; }
  @media (max-width: 560px) {
    .title { font-size: 17px; line-height: 1.2; }
    .brand img { width: 42px; height: 42px; }
    .row2 { grid-template-columns: 1fr; gap: 0; }
    .tile .val { font-size: 21px; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    table { font-size: 13px; }
    th, td { padding: 7px 5px; }
    th { font-size: 10.5px; letter-spacing: 0; }
    td.detail { padding: 4px 8px 10px; }
    .rpage { padding: .35in .3in; }
    .rpage .kv { grid-template-columns: repeat(2, 1fr); }
    .rpage .org { font-size: 18px; }
    .rpage .rhead img { width: 64px; height: 64px; }
  }
  /* PDF capture always uses the full letter-size layout, even on a phone */
  .rpage.pdf { width: 7.6in; max-width: none; padding: 0; box-shadow: none; margin: 0; font-size: 12.5px; }
  .rpage.pdf .kv { grid-template-columns: repeat(3, 1fr); }
  .rpage.pdf .org { font-size: 23px; }
  .rpage.pdf .rhead img { width: 84px; height: 84px; }
  .rpage.pdf th, .rpage.pdf td { padding: 4px 6px; font-size: 12px; }
  .rpage.pdf th { font-size: 10.5px; }
  @media print {
    @page { size: letter; margin: .5in; }
    body { background: #fff; }
    .top, .tabs, .rtools, .toast, .noprint { display: none !important; }
    main { padding: 0; }
    .wrap { max-width: none; padding: 0; }
    .rpage { box-shadow: none; margin: 0; padding: 0; max-width: none; }
  }
  /* ===== Easier reading (V1.3, option C): bigger text, firm outlines, boxes sized to what goes in them ===== */
  body { font-size: 18px; background: #dfe7e1; }
  .form label { font-size: 16px; color: #2c3a32; margin-bottom: 18px; }
  .form input, .form select, .form textarea { font-size: 19px; padding: 12px 14px; background: #fff;
    border: 2px solid #8fa597; border-radius: 10px; margin-top: 6px; max-width: 520px; }
  .form input[type=file] { font-size: 16px; background: #f3f7f4; }
  .form input[type=checkbox], .form input[type=radio] { display: inline-block; width: auto; max-width: none; margin: 0 6px 0 0; }
  .form input[type=number] { -moz-appearance: textfield; }
  .form input[type=number]::-webkit-inner-spin-button, .form input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  #ed { max-width: 210px; } #et { max-width: 240px; }
  #eh, #ei { max-width: 130px; font-size: 22px; font-weight: 700; }
  .hint { font-size: 14.5px; color: #4d5a52; font-weight: 400; max-width: 520px; }
  .form .btn:not(.small) { display: block; width: auto; min-width: 220px; font-size: 19px; padding: 15px 40px; border-radius: 10px; }
  .form select.mini { display: inline-block; width: auto; font-size: 16px; padding: 7px 10px; margin: 0; }
  .row2 { display: flex; flex-wrap: wrap; column-gap: 14px; }
  .row2 > label { flex: 0 1 240px; min-width: 0; }
  .row2 > label:has(#eh), .row2 > label:has(#ei), .row2 > label:has(.btn) { flex: 0 1 auto; }
  .form .btn { white-space: nowrap; }
  .small, .entry .meta, .entry .nums { font-size: 15px; }
  .tabs button { font-size: 17px; }
  /* V1.3: one-line bold white name, and the ribbon + tabs stay at the top while scrolling */
  .stick { position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
  .top { padding: 10px 0; }
  .title { font-size: 21px; font-weight: 700; color: #fff; letter-spacing: .2px; line-height: 1.2; }
  .title span { white-space: nowrap; }
  .brand img { width: 42px; height: 42px; }
  .form label.chk { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; font-size: 17px; color: var(--text); }
  .form label.chk input { width: 22px; height: 22px; margin: 0 10px 0 0; }
  .form label.chk .hint { flex-basis: 100%; }
  .slide-l { animation: slideL .18s ease-out; } .slide-r { animation: slideR .18s ease-out; }
  @keyframes slideL { from { transform: translateX(28px); opacity: .4; } to { transform: none; opacity: 1; } }
  @keyframes slideR { from { transform: translateX(-28px); opacity: .4; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .slide-l, .slide-r { animation: none; } }
  .mdone { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .tag.joint { background: #f6ecd2; color: #7a5a12; }
  .jline { font-size: 15px; color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 2px 16px; }
  .jline span { white-space: nowrap; }
  .form label.chk input, input[type=checkbox] { accent-color: var(--navy); }
  .jline b { color: var(--text); }
  .upbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; border: 0; width: 100%; background: var(--gold); color: #1a1f1c;
    font: inherit; font-size: 16px; padding: 14px 16px; text-align: center; cursor: pointer; box-shadow: 0 -2px 8px rgba(0,0,0,.2); }
  .upbar b { text-decoration: underline; }
  /* Photo viewer + Photos tab */
  .thumb { padding: 0; border: 0; background: none; cursor: zoom-in; }
  .pview { position: fixed; inset: 0; z-index: 70; background: #000; color: #fff; display: flex; flex-direction: column; }
  .pvtop, .pvbot { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
  .pvtop { justify-content: space-between; } .pvcap { font-size: 15px; line-height: 1.35; }
  .pvx { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 50%; width: 44px; height: 44px; font-size: 22px; cursor: pointer; flex: none; }
  .pvstage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .pvstage img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .pvload { position: absolute; color: #ccc; font-size: 16px; text-align: center; padding: 0 60px; }
  .pvnav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 48px; height: 64px; border: 0; border-radius: 10px;
    background: rgba(255,255,255,.15); color: #fff; font-size: 40px; line-height: 1; cursor: pointer; }
  .pvprev { left: 8px; } .pvnext { right: 8px; } .pvnav:disabled { opacity: .2; cursor: default; }
  .pvbot { justify-content: center; flex-wrap: wrap; font-size: 15px; }
  .pvbtn { background: var(--gold); color: #1a1f1c; font-weight: 700; padding: 10px 18px; border-radius: 8px; text-decoration: none; }
  .pvbtn.ghost { background: rgba(255,255,255,.15); color: #fff; }
  .pvx:focus-visible, .pvnav:focus-visible, .pvbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .pcell { padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; cursor: zoom-in; text-align: left; font: inherit; }
  .pcell img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--soft); }
  .pcell span { display: block; padding: 6px 8px; font-size: 13px; line-height: 1.3; color: var(--muted); }
  @media (max-width: 560px) { .pgrid { grid-template-columns: repeat(2, 1fr); } .pvnav { width: 40px; height: 56px; font-size: 34px; } }
  .acct { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0 0 16px; }
  .acct dt { color: var(--muted); } .acct dd { margin: 0; font-weight: 700; }
  @media (max-width: 560px) {
    .title { font-size: 16px; letter-spacing: 0; }
    .brand img { width: 36px; height: 36px; }
    .top { padding: 8px 0 6px; }
  }
  @media print { .stick { position: static; box-shadow: none; } }
  .who { font-size: 15px; }
  @media (max-width: 560px) {
    .row2 { display: flex; gap: 0 14px; }
    #ed, #et { width: 210px; }
  }

  /* V1.5: missions for everyone, expenses, lock, map, report, connections */
  .sync { position: fixed; top: 8px; right: 10px; z-index: 55; background: rgba(255,255,255,.95); color: var(--navy); border-radius: 14px;
    padding: 4px 12px; font-size: 13px; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .sync.bad { color: var(--bad); }
  .tag.lock { background: #f6ecd2; color: #7a5a12; }
  .lockbar { background: #f6ecd2; border: 1px solid #e3cf98; color: #5c4510; border-radius: 8px; padding: 10px 12px; font-size: 15px; margin-bottom: 12px; }
  .lockbar b { display: block; font-size: 16px; color: #3f2f09; margin-bottom: 2px; }
  .mapbtn { display: flex; align-items: center; justify-content: center; gap: 8px; background: #fff; border: 2px solid var(--navy); color: var(--navy);
    border-radius: 8px; padding: 11px; font-weight: 700; text-decoration: none; }
  .mapbtn:hover { background: var(--soft); }
  .mcard .mbody .row2 { margin-top: 4px; }
  .kvl { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 4px 0 2px; }
  .kvl span { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--navy); font-weight: 700; }
  .ro { background: #fff; border: 1px solid var(--line); border-radius: 7px; padding: 9px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .xtbl { table-layout: fixed; width: 100%; border-collapse: collapse; font-size: 15px; margin: 2px 0 6px; }
  .xtbl td { white-space: normal; text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: top; background: none; }
  .xtbl td.r { text-align: right; }
  .xtbl .cat { display: block; font-size: 13px; color: var(--muted); }
  .xtot { display: flex; justify-content: space-between; font-weight: 700; padding: 4px 4px 0; }
  .xdel { border: 0; background: none; color: var(--bad); font-size: 17px; cursor: pointer; padding: 0 4px; }

<script>
/* ================= Duty Log: core (shared by the East and West posses) ================= */
const APP_VERSION = 'V1.5.2';
const APP_DATE = 'October 25, 2026';
const CHANGELOG = [
  { v: 'V1.5.2', date: 'October 25, 2026', items: [
    'Staging Point can be a known place name (like Kanosh Park or Posse Shed) as well as coordinates picked on the map.',
    'After an update, the app loads fresh data once instead of showing numbers saved by the older version.',
    'Add Mission has a Clear button to start the form over.',
    'Add Mission has a Message note box for anything else the team should know; it goes on its own line in the GroupMe message.',
    'Known places: admins can save places like the Posse Shed with their exact spot on the map (while adding a mission, or under Settings > Known places). They show as suggestions in the Staging Point box and put the CalTopo marker in the right spot. Each posse keeps its own list.'
  ] },
  { v: 'V1.5.1', date: 'October 25, 2026', items: [
    'Staging Point on each mission: pick it on a topo map (or type coordinates). It becomes the Staging Point marker on the new CalTopo map and goes in the GroupMe message.',
    'Comms plan on each mission: Primary and Backup channel dropdowns, starting with the posse\'s standard plan, with “Other…” to type any channel. It goes in the GroupMe message and the Mission Report.',
    'Settings > Comms plan: set the standard Primary and Backup channels and edit the channel list (shared by East and West).'
  ] },
  { v: 'V1.5', date: 'October 25, 2026', items: [
    'Faster: the app now loads from east.millardsar.org / west.millardsar.org directly, and your phone remembers your last numbers so they show instantly while fresh ones load.',
    'Everyone can open a mission to see its map link, notes, photos, expenses and who logged time. Only admins can change a mission.',
    'Admins can add expenses to a mission (food, fuel, broken or lost equipment and more), with a photo of the receipt.',
    'New MCSO case # and location on each mission.',
    'Mission Report: a PDF for the state with every member\'s hours and miles (both posses on a joint mission), expenses and a cost summary. A copy is saved to the mission\'s Google Drive folder.',
    'Creating the report locks the mission so nobody can change its time, notes or expenses. Photos can still be added. Admins can unlock it.',
    'Adding a mission can create its CalTopo map (same name, in the posse\'s folder) and post the map link to GroupMe.',
    'CalTopo maps are backed up to Google Drive when the report is created, or any time with Back up map now.',
    'The public website loads its numbers instantly.'
  ] },
  { v: 'V1.4.4', date: 'October 24, 2026', items: [
    'Faster: the app opens in one trip to the server and skips a slow sheet check on most sign-ins.',
    'Photos: tap a photo to see it full-screen in the app; swipe or use the arrows to move through them, with a Download button.',
    'New Photos tab for admins: every photo from every mission in one place, filtered by mission or year.',
    'Changing the rates in Settings shows on the public website right away.'
  ] },
  { v: 'V1.4.3', date: 'October 24, 2026', items: [
    'The app refreshes its numbers when you come back to it, and every 15 minutes while it is open.',
    'If a newer version has been released, a bar offers to update it with one tap (you stay signed in).'
  ] },
  { v: 'V1.4.2', date: 'October 24, 2026', items: [
    'The public site millardsar.org shows both posses together, with buttons to see the East or West Posse on its own. A joint mission counts once in the combined numbers.'
  ] },
  { v: 'V1.4.1', date: 'October 24, 2026', items: [
    'Team functions now count each mission or event once per day it was worked, instead of once per member. Months from the old monthly form use the highest number any one unit reported.',
    'New "Member turnouts" number shows how many times members turned out in total.',
    'Hours are logged in half hours, and every entry counts in half hours (anything in between rounds up), so totals no longer show odd decimals.',
    'Settings: alert emails can go to several people (separate addresses with commas).',
    'West Posse: the Wide Mouth 2 Fire entries are split by day (August 1–5), so it counts as 5 functions.'
  ] },
  { v: 'V1.4', date: 'October 24, 2026', items: [
    'West Posse gets its own Duty Log, running the same code as the East with its own roster, admins, missions and photos.',
    'Joint missions: any admin can mark a mission as joint so both posses log time to the same mission. Everyone sees the combined totals; admins also see who logged time from the other posse.',
    'Log page: joint missions are marked "Joint" in the Mission / Event list.'
  ] },
  { v: 'V1.3.4', date: 'October 24, 2026', items: [

function viaScriptRun(fn, args) {
  if (!(window.google && google.script && google.script.run)) return Promise.reject(new Error("Couldn't reach the server. Check your connection and try again."));
  return new Promise((res, rej) => {
    const timer = setTimeout(() => rej(new Error('The server did not answer. Check your connection and reload the page.')), 60000);
    google.script.run
      .withSuccessHandler(v => { clearTimeout(timer); res(v); })
      .withFailureHandler(e => { clearTimeout(timer); rej(e); })[fn](...args);
  });
}

async function viaFetch(fn, args) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 60000);
  try {
    const r = await fetch(EXEC_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), signal: ctl.signal });
    const j = await r.json();
    if (!j.ok) { const e = new Error(j.error); e.server = true; throw e; }
    return j.data;
  } finally { clearTimeout(timer); }
}

async function run(fn, ...args) {
  if (useFetch) {
    try { return await viaFetch(fn, args); }
    catch (e) { if (e.server) throw e; useFetch = false; }
  }
  return viaScriptRun(fn, args);
}

}

/* ---- Mission name matching ---- */
const MONTH_WORDS = /^(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec|january|february|march|april|june|july|august|september|october|november|december)$/;
function normName(s) { return String(s || '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').trim(); }
function lev(a, b) {
  const v = Array(b.length + 1).fill(0).map((_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = v[0]; v[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = v[j];
      v[j] = Math.min(v[j] + 1, v[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;
    }
  }
  return v[b.length];
}
function similarName(a, b) {
  const x = normName(a), y = normName(b);
  if (!x || !y) return false;
  if (x === y) return true;
  const ta = x.split(' '), tb = y.split(' ');
  const diff = ta.filter(w => tb.indexOf(w) < 0).concat(tb.filter(w => ta.indexOf(w) < 0));
  if (diff.length && diff.every(w => /^\d+$/.test(w) || MONTH_WORDS.test(w))) return false;
  if (1 - lev(x, y) / Math.max(x.length, y.length) >= 0.8) return true;
  const sa = ta.filter(w => w.length > 2), sb = tb.filter(w => w.length > 2);
  if (sa.length >= 2 && sb.length >= 2) {
    const shared = sa.filter(w => sb.indexOf(w) >= 0).length;
    if (shared / Math.min(sa.length, sb.length) >= 0.75) return true;
  }
  return Math.min(x.length, y.length) >= 6 && (x.indexOf(y) >= 0 || y.indexOf(x) >= 0);
}

function sum(list) {

}
/**
 * Team functions for a list of entries (same rule as the server): each mission or event counts once per
 * calendar day anyone logged time on it; months from the old monthly form use the highest number any one
 * unit reported; a month with both uses the larger. Returns { total, byMonth: { 'yyyy-mm': n }, byType: { type: n } }.
 */
function teamFn(list) {
  const months = {};
  list.forEach(e => {
    if (e.exclude) return;
    const k = e.date.slice(0, 7);
    const M = months[k] || (months[k] = { keys: {}, byType: {}, n: 0, legacy: {} });
    if (e.source === 'App') {
      const key = (e.mission ? 'm:' + e.mission.toLowerCase() : 't:' + e.type) + '|' + e.date;
      if (!M.keys[key]) { M.keys[key] = 1; M.n++; M.byType[e.type] = (M.byType[e.type] || 0) + 1; }
    } else {
      M.legacy[e.unit] = Math.max(M.legacy[e.unit] || 0, e.f || 0);
    }
  });
  const out = { total: 0, byMonth: {}, byType: {} };
  Object.keys(months).forEach(k => {
    const M = months[k];
    const legacy = Math.max(0, ...Object.keys(M.legacy).map(u => M.legacy[u]));
    const types = legacy > M.n ? { 'Monthly report': legacy } : M.byType;
    Object.keys(types).forEach(t => { out.byType[t] = (out.byType[t] || 0) + types[t]; });
    out.byMonth[k] = Math.max(legacy, M.n);
    out.total += out.byMonth[k];
  });
  return out;
}

/* ---------------- Keeping an open page current ---------------- */

/**
 * When the member comes back to the app (or every 15 minutes while it is open): fetch fresh numbers, and check
 * whether a newer version has been released. The screen is only redrawn when it is safe (not mid-typing, no
 * pop-up or open mission), so nothing the member is entering gets wiped.
 */
let lastCheck = Date.now();
async function keepCurrent(force) {
  if (document.hidden) return;
  if (!force && Date.now() - lastCheck < 60000) return;
  lastCheck = Date.now();
  try {
    const v = await run('apiVersion');
    if (v && v.version && v.version !== APP_VERSION) showUpdateBar(v.version);
  } catch (e) { /* offline or busy: try again later */ }
  if (!S.creds || !S.d) return;
  try { applyFresh(await run('apiRefresh', S.creds)); }
  catch (e) { /* signed out or offline: leave the screen as it is */ }
}

function showUpdateBar(version) {
  if ($('upbar')) return;
  document.body.insertAdjacentHTML('beforeend', `<button id="upbar" class="upbar" type="button">
    A new version of the Duty Log is available (${esc(version)}). <b>Tap to update.</b></button>`);
  $('upbar').onclick = () => {
    /* On the posse's own web address, ask for the new page (not the browser's saved copy) */
    if (/millardsar\.org$/.test(location.hostname)) location.replace(location.pathname + '?v=' + encodeURIComponent(version));
    else location.reload();
  };
}

document.addEventListener('visibilitychange', () => { if (!document.hidden) keepCurrent(); });

async function init() {
  const c = load('posseCreds'), saved = load('posseData'), boot = load('posseBoot');
  if (c && saved && saved.unit === c.unit && saved.v === APP_VERSION && saved.d && saved.d.me) {
    /* Show the numbers from last time right away, then refresh them in the background */
    S.boot = boot || { units: [] };
    S.creds = c;
    resetView();
    S.tab = 'log';
    S.d = saved.d; buildTabs(); render();
    syncNote('Updating…');
    try {
      const r = await run('apiStart', c);
      S.boot = r.boot; store('posseBoot', r.boot);
      syncNote(null);
      if (r.data) { applyFresh(r.data); return; }
      store('posseCreds', null); store('posseData', null); S.creds = null; S.d = null;
      showLogin(r.error || 'Please sign in again.');
    } catch (e) { syncNote("Couldn't reach the server. Showing your saved numbers.", true); }
    return;
  }
  if (!c && boot && boot.units && boot.units.length) {
    /* Sign-in screen right away; refresh the unit list behind it */
    S.boot = boot; showLogin();
    run('apiBoot').then(b => {
      S.boot = b; store('posseBoot', b);
      if (!S.d && !S.touched && $('lf') && !$('lp').value) showLogin();
    }).catch(() => {});
    return;
  }
  try {
    if (c) {
      /* Saved sign-in: unit list and data in one trip */
      const r = await run('apiStart', c);
      S.boot = r.boot; store('posseBoot', r.boot);
      if (r.data) { finishLogin(c, r.data); return; }
      store('posseCreds', null);
    } else {
      S.boot = await run('apiBoot'); store('posseBoot', S.boot);
    }
  } catch (e) { main(section('Error', `<p>Couldn't load the app: ${esc(clean(e))}</p>`)); return; }
  showLogin();
}

(function () {
  let sx = 0, sy = 0, st = 0, ok = false;
  const blocked = el => !!(el.closest && el.closest('input, select, textarea, button, a, canvas, .tblwrap, .thumbs, .seg, #npop, .rpage, .rtools'));
  document.addEventListener('touchstart', ev => {
    ok = false;
    if (ev.touches.length !== 1 || !S.d || !S.tabList || S.report || $('npop') || $('pview')) return;
    if (S.tabList.indexOf(S.tab) < 0) return;
    const t = ev.touches[0];
    if (t.clientX < 24 || t.clientX > window.innerWidth - 24) return;
    if (!$('main').contains(ev.target) || blocked(ev.target)) return;
    sx = t.clientX; sy = t.clientY; st = Date.now(); ok = true;
  }, { passive: true });
  document.addEventListener('touchend', ev => {
    if (!ok) return; ok = false;
    const t = ev.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Date.now() - st > 700 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
    if (window.getSelection && String(window.getSelection()).length) return;
    const i = S.tabList.indexOf(S.tab), j = i + (dx < 0 ? 1 : -1);
    if (j < 0 || j >= S.tabList.length) return;
    goTab(S.tabList[j], dx < 0 ? 1 : -1);
  }, { passive: true });
})();

  t.push(['about', 'About']);
  S.tabList = t.map(x => x[0]);
  $('tabs').innerHTML = t.map(([k, l]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('');
  $('tabs').classList.remove('hidden');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; S.report = null; buildTabs(); render(); window.scrollTo(0, 0); });
  $('who').innerHTML = `${esc(S.d.me.unit)} · ${esc(S.d.me.name)}<button class="link" id="cp">Account</button><button class="link" id="so">Sign out</button>`;
  $('so').onclick = () => { store('posseCreds', null); store('posseData', null); S.creds = null; S.d = null; showLogin(); };
  $('cp').onclick = () => { S.tab = 'pin'; buildTabs(); render(); window.scrollTo(0, 0); };
  if (S.tab === 'pin' && S.d.me.mustSetPin) $('tabs').classList.add('hidden');
}

function render() {
  if (S.chart) { S.chart.destroy(); S.chart = null; }
  S.touched = false;
  if (S.report) { if (S.report.kind === 'mission') renderMissionReport(); else renderYearEnd(); return; }
  const fn = { log: renderLog, stats: renderStats, team: renderTeam, report: renderReport, missions: renderMissions,
    review: renderReview, settings: renderSettings, photos: renderPhotos, edit: renderEdit, pin: renderPin, about: renderAbout }[S.tab] || renderLog;
  fn();
}

function renderPin() {
  const first = S.d.me.mustSetPin, me = S.d.me;
  const acct = first ? '' : section('Account', `<dl class="acct">
      <dt>Unit</dt><dd>${esc(me.unit)}</dd>
      <dt>Name</dt><dd>${esc(me.name)}</dd>
      <dt>Access</dt><dd>${me.admin ? 'Admin (Commander tools)' : 'Member'}</dd></dl>

  main(acct + section(first ? 'Choose Your Own PIN' : 'Change PIN', `<form id="pf" class="form">
      ${first ? `<p style="margin-top:0">Welcome, ${esc(me.name)}. The PIN you just used was a starting PIN. Pick your own 4 to 8 digit PIN to finish setting up.</p>` : ''}
      <label>New PIN<input id="p1" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" required></label>

      <button class="btn" type="submit" id="pb">Save PIN</button>

/** The Mission / event dropdown: open missions of every type, recent names, and "+ New". */
function missionSelect(current) {
  const d = S.d;
  const ongoing = d.missions.filter(m => m.ongoing).sort((a, b) => a.name.localeCompare(b.name));
  const dated = d.missions.filter(m => !m.ongoing).sort((a, b) => b.date.localeCompare(a.date) || a.name.localeCompare(b.name));
  const all = d.missions.map(m => m.name);
  const cur = current && all.indexOf(current) < 0
    ? `<option value="${esc(current)}" selected>${esc(current)}</option>` : '';
  const sel = m => m.name === current ? 'selected' : '';
  const jt = m => m.joint ? ' · Joint' : '';
  const lk = m => m.locked ? (m.name === current ? '' : ' disabled') : '';
  const lt = m => m.locked ? ' · 🔒 Locked' : '';
  const optO = m => `<option value="${esc(m.name)}" ${sel(m)}${lk(m)}>${esc(m.name)} · ${esc(m.type)}${jt(m)}${lt(m)}</option>`;
  const optD = m => `<option value="${esc(m.name)}" ${sel(m)}${lk(m)}>${esc(fmtDate(m.date))} · ${esc(m.name)} · ${esc(m.type)}${jt(m)}${lt(m)}</option>`;
  return `<select id="ems">
      <option value="">${current ? '— None —' : '— Pick a Mission or Event —'}</option>${cur}
      ${ongoing.length ? `<optgroup label="Ongoing">${ongoing.map(optO).join('')}</optgroup>` : ''}
      ${dated.length ? `<optgroup label="Missions & events, newest first">${dated.map(optD).join('')}</optgroup>` : ''}
      <option value="__new">+ New Mission / Event…</option>
    </select>`;
}

function entryForm(e, button, cancel) {
  const d = S.d;
  const types = d.types.map(t => `<option ${e && e.type === t ? 'selected' : ''}>${esc(t)}</option>`).join('');
  return `<form id="ef" class="form">
      <div class="row2">
        <label>Date<input type="date" id="ed" value="${e ? e.date : todayStr()}" max="${todayStr()}" required></label>
        <label>Type<select id="et">${types}</select></label>
      </div>
      <label>Mission / Event${missionSelect(e ? e.mission : '')}
        <span class="hint">Pick from the list so everyone's time lands on the same mission. Can't find it? Choose “+ New”.${(S.d.missions || []).some(m => m.locked) ? ' Locked missions have been reported. Ask an admin if you need to add time.' : ''}</span></label>
      <label id="emwrap" class="hidden">New Mission / Event name<input id="em" maxlength="80" autocomplete="off" placeholder="e.g. Lost hiker – Chalk Creek"></label>
      <div id="simbox" class="simbox hidden"></div>
      <div class="row2">
        <label>Hours (include travel)<input type="number" id="eh" min="0.5" max="72" step="0.5" inputmode="decimal" required value="${e ? e.h : ''}"></label>
        <label>Miles driven<input type="number" id="ei" min="0" max="2000" step="1" inputmode="numeric" required value="${e ? e.mi : ''}"></label>

      <label>Add photos (optional)<input type="file" id="ep" accept="image/*" multiple>

      <div id="pprev" class="thumbs"></div>
      <button class="btn" type="submit" id="eb">${button}</button>
      ${cancel ? '<button class="btn gray" type="button" id="ec" style="margin-top:8px">Cancel</button>' : ''}

}

function missionValue() {
  return $('ems').value === '__new' ? $('em').value.trim() : $('ems').value;
}

function knownMissions() { return S.d.missions.map(m => m.name); }

/** Existing names that look like `name` but aren't exactly it. */
function lookalikes(name) {
  const n = name.trim();
  if (!n) return [];
  if (knownMissions().some(k => k === n)) return [];
  return knownMissions().filter(k => similarName(k, n)).slice(0, 3);
}

function pickMission(name) {
  const sel = $('ems');
  if ([].some.call(sel.options, o => o.value === name)) sel.value = name;
  $('emwrap').classList.toggle('hidden', sel.value !== '__new');
  const m = S.d.missions.find(x => x.name === name);
  if (m) $('et').value = m.type;
}

function showSim(force) {
  const box = $('simbox'); if (!box) return;
  const v = $('ems').value === '__new' ? $('em').value.trim() : '';
  if (force) S.simForced = v; else if (S.simForced === v) force = true;
  const sims = lookalikes(v);
  if (!sims.length || (S.simOk && S.simOk === v)) { box.classList.add('hidden'); box.innerHTML = ''; return; }
  box.innerHTML = `<b>${force ? 'Is this the same mission?' : 'Similar mission already exists:'}</b>
    ${sims.map(s => `<button type="button" class="opt" data-n="${esc(s)}">Use “${esc(s)}”</button>`).join('')}
    ${force ? `<button type="button" class="keep">No, “${esc(v)}” is a different mission. Save it as new.</button>` : ''}`;
  box.classList.remove('hidden');
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => { pickMission(b.dataset.n); box.classList.add('hidden'); $('eh').focus(); });
  const k = box.querySelector('.keep');
  if (k) k.onclick = () => { S.simOk = v; box.classList.add('hidden'); $('ef').requestSubmit(); };
}

/** Before saving: fix case/punctuation-only differences, and stop if a look-alike exists. */
function checkMissionName() {
  if ($('ems').value !== '__new') return true;
  const v = $('em').value.trim();
  if (!v) { toast('Type a name for the new mission, or pick one from the list.', true); $('em').focus(); return false; }
  const same = knownMissions().find(k => normName(k) === normName(v));
  if (same) { pickMission(same); return true; }
  if (S.simOk === v || !lookalikes(v).length) return true;
  clearTimeout(S.simTimer);
  showSim(true);
  $('simbox').scrollIntoView({ block: 'center', behavior: 'smooth' });
  return false;
}

function hookEntryForm() {
  S.simOk = null; S.simForced = null;
  $('ems').addEventListener('change', () => {
    const v = $('ems').value;
    $('emwrap').classList.toggle('hidden', v !== '__new');
    if (v === '__new') { $('em').focus(); return; }
    $('simbox').classList.add('hidden');
    const m = S.d.missions.find(x => x.name === v);
    if (m) $('et').value = m.type;
  });
  $('em').addEventListener('input', () => { clearTimeout(S.simTimer); S.simTimer = setTimeout(() => showSim(false), 400); });
  $('em').addEventListener('change', () => showSim(false));
  $('ep').addEventListener('change', () => {
    const files = [].slice.call($('ep').files || []);
    $('pprev').innerHTML = files.map(f => `<img alt="" src="${URL.createObjectURL(f)}">`).join('');
  });
}

function entryValues() {
  return { date: $('ed').value, type: $('et').value, mission: missionValue(),
    hours: $('eh').value, miles: $('ei').value, notes: $('en').value.trim() };
}

function renderLog() {
  const d = S.d, now = new Date();
  const live = d.mine.filter(e => !e.exclude);
  const mtd = sum(live.filter(e => e.date.slice(0, 7) === ym(now.getFullYear(), now.getMonth())));
  const pre = S.prefill ? { date: S.prefill, type: d.types[0], mission: '', h: '', mi: '', notes: '' } : null;
  S.prefill = null;
  main(section('Log Activity', entryForm(pre, 'Save entry', false))
    + section(`This Month · ${MONTHS_LONG[now.getMonth()]}`, tiles(mtd)));
  hookEntryForm();
  if (finePointer()) $('ed').focus();
  $('ef').onsubmit = ev => { ev.preventDefault(); saveEntry(false); };
}

function renderEdit() {
  const e = S.edit;
  if (!e) { S.tab = 'stats'; render(); return; }
  const back = () => { S.edit = null; S.tab = 'stats'; buildTabs(); render(); };
  if (e.source === 'App') {
    main(section('Edit Entry', entryForm(e, 'Save changes', true)));
    hookEntryForm();
  } else {
    main(section(`Edit Monthly Report · ${fmtMonth(e.date)}`, `<form id="ef" class="form">
        <div class="row2">
          <label>Functions<input type="number" id="ef_f" min="0" max="100" step="1" required value="${e.f == null ? '' : e.f}"></label>
          <label>Hours<input type="number" id="eh" min="0" max="744" step="0.5" required value="${e.h == null ? '' : e.h}"></label>
        </div>
        <label>Miles<input type="number" id="ei" min="0" max="20000" step="1" required value="${e.mi == null ? '' : e.mi}"></label>
        <label>Notes (optional)<textarea id="en" rows="2" maxlength="500">${esc(e.notes)}</textarea></label>
        <button class="btn" type="submit" id="eb">Save changes</button>
        <button class="btn gray" type="button" id="ec" style="margin-top:8px">Cancel</button>
      </form>`));
  }
  if (finePointer()) ($('ed') || $('ef_f')).focus();
  $('ec').onclick = back;
  $('ef').onsubmit = async ev => {
    ev.preventDefault();
    if (e.source === 'App' && !checkMissionName()) return;
    const vals = e.source === 'App' ? entryValues()
      : { functions: $('ef_f').value, hours: $('eh').value, miles: $('ei').value, notes: $('en').value.trim() };
    if (e.source === 'App' && vals.type === 'Callout' && !vals.mission) { toast('Pick the mission for a callout.', true); return; }
    const files = $('ep') ? [].slice.call($('ep').files || []) : [];
    const b = $('eb'); b.disabled = true; b.textContent = 'Saving…';
    try {
      let d = await run('apiUpdateEntry', S.creds, e.id, vals);
      S.edit = null; S.tab = 'stats';
      setData(d);
      toast('Changes saved.');
      if (files.length) await uploadPhotos(files, { entryId: e.id, mission: vals.mission, date: vals.date });
    } catch (err) {
      b.disabled = false; b.textContent = 'Save changes';
      toast(clean(err), true);
    }
  };
}

async function saveEntry(force) {
  if (!checkMissionName()) return;
  const e = entryValues();
  if (e.type === 'Callout' && !e.mission) { toast('Pick the mission for a callout.', true); $('ems').focus(); return; }
  if (!force && Number(e.hours) > 16 && !confirm(e.hours + ' hours is a long stretch. Save it?')) return;
  const files = [].slice.call($('ep').files || []);
  const b = $('eb'); b.disabled = true; b.textContent = 'Saving…';
  try {
    const r = await run('apiAddEntry', S.creds, e, force);
    if (r.dup) {
      b.disabled = false; b.textContent = 'Save entry';
      if (confirm('You already logged this mission on this date. Save another entry anyway?')) saveEntry(true);
      return;
    }
    setData(r.data);
    toast('Saved. Thanks!');
    if (files.length) await uploadPhotos(files, { entryId: r.id, mission: e.mission, date: e.date });
  } catch (err) {
    b.disabled = false; b.textContent = 'Save entry';
    toast(clean(err), true);
  }
}

/** Shrinks a photo to at most 1600 px on the long side, as a JPEG. Returns base64 (no prefix). */
function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1600, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error(file.name + " couldn't be read. Try a JPG or PNG.")); };
    img.src = url;
  });
}

async function uploadPhotos(files, info) {
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    toast(`Uploading photo ${i + 1} of ${files.length}…`, false, 60000);
    try {
      const data = await shrinkPhoto(files[i]);
      await run('apiUploadPhoto', S.creds, { entryId: info.entryId, mission: info.mission, date: info.date, mime: 'image/jpeg', data: data });
      ok++;
    } catch (err) { toast(clean(err), true, 5000); await new Promise(r => setTimeout(r, 1500)); }
  }
  try { setData(await run('apiRefresh', S.creds)); } catch (e) {}
  toast(ok === files.length ? `${ok} photo${ok === 1 ? '' : 's'} uploaded.` : `${ok} of ${files.length} photos uploaded.`, ok !== files.length, 4000);
}

<script>
/* ================= My Stats, Team, Missions ================= */

function statPeriods(years) {
  const now = new Date(), cy = now.getFullYear(), cm = now.getMonth();
  const lm = new Date(cy, cm - 1, 1);
  const from12 = new Date(cy, cm - 11, 1);
  const p = [
    { k: 'month', label: 'This month', sub: MONTHS_LONG[cm] + ' ' + cy, year: cy, test: e => e.date.slice(0, 7) === ym(cy, cm) },
    { k: 'last', label: 'Last month', sub: MONTHS_LONG[lm.getMonth()] + ' ' + lm.getFullYear(), year: lm.getFullYear(),
      test: e => e.date.slice(0, 7) === ym(lm.getFullYear(), lm.getMonth()) },
    { k: 'ytd', label: 'Year to date', sub: 'Jan 1 – today, ' + cy, year: cy, goal: true, test: e => +e.date.slice(0, 4) === cy },
    { k: '12', label: 'Last 12 months', sub: MONTHS[from12.getMonth()] + ' ' + from12.getFullYear() + ' – ' + MONTHS[cm] + ' ' + cy, year: cy,
      test: e => e.date.slice(0, 7) >= ym(from12.getFullYear(), from12.getMonth()) }
  ];
  years.filter(y => y < cy).forEach(y => p.push({ k: 'y' + y, label: String(y), sub: 'Full year', year: y, goal: true, test: e => +e.date.slice(0, 4) === y }));
  return p;
}

function renderStats() {
  const d = S.d, s = d.settings, live = d.mine.filter(e => !e.exclude);
  const cy = new Date().getFullYear();
  const years = [...new Set(d.mine.map(e => +e.date.slice(0, 4)).concat(cy))].sort((a, b) => b - a);
  const periods = statPeriods(years);
  const P = periods.find(x => x.k === S.period) || periods.find(x => x.k === 'ytd');
  const t = sum(live.filter(P.test));
  const pct = s.required ? Math.min(100, t.f / s.required * 100) : 0;

  const picker = `<select id="sp" class="mini" aria-label="Period">${periods.map(x => `<option value="${x.k}" ${x.k === P.k ? 'selected' : ''}>${x.label}</option>`).join('')}</select>`;
  const goal = P.goal ? `<div class="goal"><div class="goalhead"><b>${n1(t.f)} of ${n1(s.required)}</b> required functions
      ${t.f >= s.required ? '<span class="ok">✓ Goal met</span>' : `<span class="muted small">(${n1(s.required - t.f)} to go)</span>`}</div>
      <div class="pbar"><div style="width:${pct}%"></div></div></div>` : '';
  let html = section('My Stats', `<p class="muted small" style="margin:0 0 10px">${esc(P.label)} · ${esc(P.sub)}</p>` + tiles(t) + goal, picker);

  const y = P.year;
  const ytdT = sum(live.filter(e => +e.date.slice(0, 4) === y));
  const byNewest = (a, b) => b.date.localeCompare(a.date) || b.logged.localeCompare(a.logged);
  const lastM = y === cy ? new Date().getMonth() : 11;
  let rows = '';
  for (let m = 0; m <= lastM; m++) {
    const key = ym(y, m);
    const mt = sum(live.filter(e => e.date.slice(0, 7) === key));
    const open = S.openMonth === key;
    rows += `<tr class="click ${mt.f || mt.h ? '' : 'dim'}" data-ym="${key}" tabindex="0"><td><span class="chev">${open ? '▾' : '▸'}</span>${MONTHS_LONG[m]}</td><td>${n1(mt.f)}</td><td>${n1(mt.h)}</td><td>${n1(mt.mi)}</td><td>${money(mt.v)}</td></tr>`;
    if (open) {
      const mine = d.mine.filter(e => e.date.slice(0, 7) === key).sort(byNewest);
      rows += `<tr><td colspan="5" class="detail">${mine.map(entryItem).join('') || '<p class="muted small" style="margin:8px 0 0">Nothing logged this month.</p>'}
        <button class="addm" data-ym="${key}">+ Add an entry for ${MONTHS_LONG[m]}</button></td></tr>`;
    }
  }
  html += section(`By Month · ${y}`, `<div class="tblwrap"><table><tr><th>Month</th><th>Functions</th><th>Hours</th><th>Miles</th><th>Value</th></tr>${rows}
      <tr class="tot"><td>Total</td><td>${n1(ytdT.f)}</td><td>${n1(ytdT.h)}</td><td>${n1(ytdT.mi)}</td><td>${money(ytdT.v)}</td></tr></table></div>
      <p class="muted small">Tap a month to see, edit or add its entries.</p>`);

  const list = d.mine.filter(P.test).sort(byNewest);
  html += section(`Entries · ${esc(P.label)}`, list.map(entryItem).join('') || '<p class="muted">No entries for this period.</p>');

  const stYears = years.filter(v => v <= cy);
  html += section('Year-End Statement', `<div class="form"><div class="row2">
      <label>Year<select id="ysy">${stYears.map(v => `<option ${v === (cy - (new Date().getMonth() < 2 ? 1 : 0)) ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label>&nbsp;<button class="btn" id="ysb" type="button">View my statement</button></label></div>
      <p class="muted small" style="margin:0">A printable summary of your volunteer service for the year, for your tax records. You can print it or save it as a PDF.</p></div>`);

  main(html);
  $('sp').onchange = ev => { S.period = ev.target.value; S.openMonth = null; render(); };
  document.querySelectorAll('tr.click[data-ym]').forEach(r => {
    const go = () => { S.openMonth = S.openMonth === r.dataset.ym ? null : r.dataset.ym; render(); };
    r.onclick = go;
    r.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } };
  });
  document.querySelectorAll('.addm').forEach(b => b.onclick = () => {
    const first = b.dataset.ym + '-01';
    S.prefill = b.dataset.ym === todayStr().slice(0, 7) ? todayStr() : first;
    S.tab = 'log'; buildTabs(); render(); window.scrollTo(0, 0);
  });
  document.querySelectorAll('.del').forEach(b => b.onclick = () => delEntry(b.dataset.id));
  document.querySelectorAll('.edt').forEach(b => b.onclick = () => {
    S.edit = d.mine.find(x => x.id === b.dataset.id);
    S.tab = 'edit'; buildTabs(); render(); window.scrollTo(0, 0);
  });
  $('ysb').onclick = () => openYearEnd(+$('ysy').value, d.me.unit);
}

function entryItem(e) {
  const legacy = e.source !== 'App';
  const pc = (S.d.myPhotos || {})[e.id];

/* ---------------- Team ---------------- */

function renderTeam() {
  const d = S.d, cy = new Date().getFullYear();
  const years = [...new Set(d.team.map(t => +t.ym.slice(0, 4)).concat(cy))].sort((a, b) => b - a);
  const y = S.teamYear || cy;
  const items = d.team.filter(t => +t.ym.slice(0, 4) === y);
  const tot = sum(items);
  const tfOf = list => list.reduce((a, t) => a + (t.tf != null ? t.tf : t.f || 0), 0);
  const members = new Set(items.flatMap(t => t.units)).size;
  let html = section(y === cy ? 'Team · Year to Date' : `Team · ${y}`,
    teamTiles(tot, tfOf(items), tile('Members reporting', members)) +
    '<p class="muted small" style="margin:10px 0 0">Functions count each mission or event once per day it was worked. Member turnouts count every member who took part.</p>',
    yearSelect('ty', years, y));

  const mlabel = { tf: 'Functions', h: 'Hours', mi: 'Miles' };
  if (!mlabel[S.teamMetric]) S.teamMetric = 'tf';
  const seg = `<div class="seg">${Object.keys(mlabel).map(k => `<button data-m="${k}" class="${S.teamMetric === k ? 'on' : ''}">${mlabel[k]}</button>`).join('')}</div>`;
  html += section(`${mlabel[S.teamMetric]} by Month`, `<div class="chartbox"><canvas id="tc"></canvas></div>`, seg);

  const byType = {};
  items.forEach(t => { const b = byType[t.type] || (byType[t.type] = []); b.push(t); });
  const order = d.types.concat(['Monthly report']);
  const rows = Object.keys(byType).sort((a, b) => order.indexOf(a) - order.indexOf(b)).map(k => {
    const t = sum(byType[k]);
    return `<tr><td>${esc(k)}</td><td>${n1(tfOf(byType[k]))}</td><td>${n1(t.f)}</td><td>${n1(t.h)}</td><td>${n1(t.mi)}</td><td>${money(t.v)}</td></tr>`;
  }).join('');
  html += section('By Type', rows
    ? `<div class="tblwrap"><table><tr><th>Type</th><th>Functions</th><th>Turnouts</th><th>Hours</th><th>Miles</th><th>Value</th></tr>${rows}</table></div>
       <p class="muted small">"Monthly report" is activity from the old monthly form.</p>`
    : '<p class="muted">No activity yet.</p>');

  main(html);
  $('ty').onchange = ev => { S.teamYear = +ev.target.value; render(); };
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { S.teamMetric = b.dataset.m; render(); });

  const series = yr => MONTHS.map((_, m) => {
    const list = d.team.filter(t => t.ym === ym(yr, m));
    return S.teamMetric === 'tf' ? tfOf(list) : list.reduce((a, t) => a + (t[S.teamMetric] || 0), 0);
  });
  if (window.Chart) {
    S.chart = new Chart($('tc'), {
      type: 'bar',
      data: { labels: MONTHS, datasets: [
        { label: String(y - 1), data: series(y - 1), backgroundColor: '#a9c7b5' },
        { label: String(y), data: series(y), backgroundColor: '#1e4d36' }
      ] },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } },
        scales: { y: { beginAtZero: true, title: { display: true, text: mlabel[S.teamMetric] } } } }
    });
  }
}

function similarGroups(list) {
  const names = list.map(m => m.name);
  const parent = names.map((_, i) => i);
  const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
  for (let i = 0; i < names.length; i++) for (let j = i + 1; j < names.length; j++)
    if (similarName(names[i], names[j])) parent[find(i)] = find(j);
  const groups = {};
  list.forEach((m, i) => { (groups[find(i)] = groups[find(i)] || []).push(m); });
  return Object.values(groups).filter(g => g.length > 1);
}

const MAP_PLACEHOLDER = '(map link added when the map is ready)';
function mapLink(id) { return id ? 'https:\/\/caltopo.com/m/' + encodeURIComponent(id) : ''; }
function isLockedName(n) { const k = String(n || '').toLowerCase(); return (S.d.locked || []).some(x => x.toLowerCase() === k); }
function lockedWhen(t) {
  const m = /^(\d{4}-\d{2}-\d{2})\s+(\d{1,2}):(\d{2})\s+by\s+(.*)$/.exec(String(t || ''));
  if (!m) return esc(t);
  const h = +m[2], ap = h < 12 ? 'AM' : 'PM';
  return esc(fmtDate(m[1]) + ' ' + ((h % 12) || 12) + ':' + m[3] + ' ' + ap + ' by ' + m[4]);
}
function fmtRange(a, b) {
  if (!a) return '';
  if (!b || a === b) return fmtDate(a);
  const pa = a.split('-'), pb = b.split('-');
  if (pa[0] === pb[0] && pa[1] === pb[1]) return MONTHS[+pa[1] - 1] + ' ' + (+pa[2]) + '–' + (+pb[2]) + ', ' + pa[0];
  return fmtDate(a) + ' – ' + fmtDate(b);
}
async function copyText(t) {

function missionEmoji(type) { return { Callout: '🚨', Training: '📘', 'Event / Parade': '📣' }[type] || '📌'; }

/** Default GroupMe message for a new mission (the admin can edit it before it goes out). */
function alertMessage(f) {

  lines.push([f.date ? fmtDate(f.date) : '', f.location].filter(Boolean).join(' · '));
  if (f.staging) lines.push('Staging Point: ' + f.staging);
  if (f.primary || f.backup) {
    lines.push('Comms Plan:');
    if (f.primary) lines.push('Primary Ch: ' + f.primary);
    if (f.backup) lines.push('Backup Ch: ' + f.backup);
  }
  if (f.extra) lines.push(f.extra);
  if (f.map) lines.push('Map: ' + MAP_PLACEHOLDER);
  lines.push('Log your time: ' + ((S.d.conn && S.d.conn.appUrl) || POSSE_INFO.appUrl || ''));
  return lines.filter(Boolean).join('\n');

/* ---------------- Pick the Staging Point on a map ---------------- */

const MAP_HOME = [39.05, -112.6]; /* Millard County */
function loadCss(href) {
  return new Promise(res => {
    if ([].some.call(document.querySelectorAll('link[rel=stylesheet]'), l => l.href === href)) return res();
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; l.onload = res; l.onerror = res;
    document.head.appendChild(l);
  });
}
function parsePoint(s) {
  const m = /^\s*(-?\d{1,2}(?:\.\d+)?)\s*[, ]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/.exec(String(s || ''));
  return m ? [+m[1], +m[2]] : null;
}
function fmtPoint(lat, lon) { return lat.toFixed(5) + ', ' + lon.toFixed(5); }

/** Full-screen topo map: search a place, use my location, tap to drop the pin, then "Use this point". */
async function openPicker(current, place, done, opts) {
  opts = opts || {};
  const old = $('mpicker'); if (old) old.remove();
  document.body.insertAdjacentHTML('beforeend', `<div id="mpicker" class="mpicker" role="dialog" aria-modal="true" aria-label="Pick the Staging Point">
    <form class="pkbar" id="pkf"><input id="pkq" placeholder="Search a place" value="${esc(place || '')}" autocomplete="off">
      <button class="btn small" type="submit" style="background:#fff;color:var(--navy)">Find</button>
      <button class="pkx" type="button" aria-label="Close">✕</button></form>
    <div class="pkmap" id="pkmap"><div class="pkload" id="pkload">Loading the map…</div>
      <button class="pkme" type="button" id="pkme">📍 My location</button></div>
    <div class="pkfoot"><div class="muted small">${esc(opts.hint || 'Tap the map to place the Staging Point')}</div>
      <div class="pkpt" id="pkpt">No point yet</div>
      ${opts.saveName ? `<label class="pksave"><input type="checkbox" id="pksv" ${opts.saveChecked ? 'checked' : ''}> ${esc(opts.saveLabel || 'Save “' + opts.saveName + '” as a known place')}</label>` : ''}
      <div class="btnrow"><button class="btn" type="button" id="pkuse" disabled style="flex:1;width:auto">Use this point</button>
        <button class="btn ghost" type="button" id="pkcancel" style="width:auto">Cancel</button></div></div></div>`);
  document.body.style.overflow = 'hidden';
  const close = () => { const v = $('mpicker'); if (v) v.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', key); };
  const key = ev => { if (ev.key === 'Escape') close(); };
  document.addEventListener('keydown', key);
  $('mpicker').querySelector('.pkx').onclick = close;
  $('pkcancel').onclick = close;
  try {
    await loadCss('https:\/\/cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css');
    if (!window.L) await loadScript('https:\/\/cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js');
  } catch (e) { $('pkload').textContent = "Couldn't load the map. Type the coordinates instead."; return; }
  if (!$('mpicker')) return;
  $('pkload').remove();
  const start = parsePoint(current);
  const map = L.map('pkmap', { zoomControl: true }).setView(start || MAP_HOME, start ? 14 : 9);
  L.tileLayer('https:\/\/basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 16, attribution: 'USGS The National Map' }).addTo(map);
  L.tileLayer('https:\/\/server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { minZoom: 17, maxZoom: 19, attribution: 'Esri imagery' }).addTo(map);
  L.DomEvent.disableClickPropagation($('pkme'));
  let pin = null, pt = null;
  const place2 = (lat, lon, zoom) => {
    pt = fmtPoint(lat, lon);
    if (pin) pin.setLatLng([lat, lon]); else pin = L.marker([lat, lon], { draggable: true }).addTo(map).on('dragend', ev => { const ll = ev.target.getLatLng(); place2(ll.lat, ll.lng); });
    if (zoom) map.setView([lat, lon], zoom);
    $('pkpt').textContent = pt; $('pkuse').disabled = false;
  };
  if (start) place2(start[0], start[1]);
  map.on('click', ev => place2(ev.latlng.lat, ev.latlng.lng));
  $('pkuse').onclick = async () => {
    if (!pt) return;
    if (opts.saveName && $('pksv') && $('pksv').checked) {
      $('pkuse').disabled = true;
      try {
        const r = await run('apiSavePlace', S.creds, { name: opts.saveName, oldName: opts.oldName, point: pt });
        S.d.places = r.places; cacheData();
        toast('Saved “' + opts.saveName + '”.');
        done(opts.saveName, pt, true); close();
      } catch (e) { $('pkuse').disabled = false; toast(clean(e), true); }
      return;
    }
    done(pt, pt, false); close();
  };
  $('pkme').onclick = () => {
    if (!navigator.geolocation) { toast("This device can't share its location.", true); return; }
    navigator.geolocation.getCurrentPosition(p => place2(p.coords.latitude, p.coords.longitude, 15),
      () => toast("Couldn't get your location.", true), { enableHighAccuracy: true, timeout: 15000 });
  };
  const find = async q => {
    const pp = parsePoint(q);
    if (pp) { place2(pp[0], pp[1], 14); return; }
    try { const r = await run('apiGeocode', S.creds, q); map.setView([r.lat, r.lon], 13); toast('Now tap the exact spot.'); }
    catch (e) { toast(clean(e), true); }
  };
  $('pkf').onsubmit = ev => { ev.preventDefault(); const q = $('pkq').value.trim(); if (q) find(q); };
  if (!start && place) find(place);
  setTimeout(() => map.invalidateSize(), 200);
}

/** Keeps one <datalist id="kpl"> of this posse's known places on the page (suggestions for the Staging Point boxes). */

/**
 * "Pick on map" for a Staging Point box. A known place opens at its saved spot (with an option to update it);
 * a new name opens a search for it and offers to save it as a known place; coordinates open right there.
 */
function pickStaging(input, near, after, hint) {
  const v = input.value.trim();
  const fin = val => { input.value = val; refreshPlaceList(); if (after) after(); };
  const kp = knownPlace(v);
  if (parsePoint(v)) return openPicker(v, '', val => fin(val), { hint: hint });
  if (kp) return openPicker(kp.point, '', (val, pt, saved) => fin(saved || pt === kp.point ? kp.name : val),
    { saveName: kp.name, saveLabel: 'Update the saved spot for “' + kp.name + '”', saveChecked: false, hint: hint });
  if (v) return openPicker('', v, (val, pt, saved) => fin(saved ? v : val), { saveName: v, saveChecked: true, hint: hint });
  return openPicker('', near, val => fin(val), { hint: hint });
}

function hookAddMission() {
  const d = S.d, c = d.conn || {};
  const st = { mapTouched: false, postTouched: false, msgEdited: false };
  const fields = () => ({ name: $('mn').value.trim(), date: $('mong').checked ? '' : $('md').value, type: $('mt').value,
    location: $('mloc').value.trim(), map: $('mmap').checked, staging: $('mstg').value.trim(),
    primary: channelValue('mpri', 'mprio'), backup: channelValue('mbak', 'mbako'), extra: $('mxtra').value.trim() });
  const sync = () => {
    const def = (d.mapTypes || []).indexOf($('mt').value) >= 0 && !$('mong').checked;
    if (!st.mapTouched) $('mmap').checked = !!c.caltopo && def;
    if (!st.postTouched) $('mpost').checked = !!c.groupme && def;
    $('mmsg').classList.toggle('hidden', !$('mpost').checked);
    if (!st.msgEdited) $('mmsg').value = alertMessage(fields());
  };
  ['mn', 'md', 'mloc', 'mstg', 'mprio', 'mbako', 'mxtra'].forEach(id => $(id).addEventListener('input', sync));
  hookChannel('mpri', 'mprio', sync); hookChannel('mbak', 'mbako', sync);
  $('mpick').onclick = () => pickStaging($('mstg'), $('mloc').value.trim(), sync);
  $('mt').addEventListener('change', sync);
  $('mmap').addEventListener('change', () => { st.mapTouched = true; sync(); });
  $('mpost').addEventListener('change', () => { st.postTouched = true; sync(); });
  $('mmsg').addEventListener('input', () => { st.msgEdited = true; });
  $('mong').onchange = () => {
    const on = $('mong').checked;
    $('mdw').classList.toggle('hidden', on); $('md').required = !on;
    if (on && $('mt').value === 'Callout') $('mt').value = 'Maintenance';
    sync();
  };
  $('mclr').onclick = () => {
    if (($('mn').value.trim() || $('mloc').value.trim() || $('mstg').value.trim() || $('mnotes').value.trim() || $('mxtra').value.trim()) && !confirm('Clear the form and start over?')) return;
    const y = window.scrollY; render(); window.scrollTo(0, y);
    if ($('mn')) $('mn').focus();
  };
  $('mgeo').onclick = () => pickStaging($('mloc'), '', sync, 'Tap the map to place the Location');
  sync();
  $('mf').onsubmit = async ev => {
    ev.preventDefault();
    const f = fields();
    const post = $('mpost').checked, msg = $('mmsg').value.trim();
    if (post && !msg) { toast('Write the GroupMe message, or uncheck Post to GroupMe.', true); return; }
    $('mb').disabled = true; $('mb').textContent = f.map || post ? 'Adding (and setting up the map and post)…' : 'Adding…';
    try {
      const r = await run('apiAddMission', S.creds, { name: f.name, date: $('md').value, type: f.type, notes: $('mnotes').value,
        ongoing: $('mong').checked, joint: $('mjoint').checked, location: f.location, caseNo: $('mcase').value.trim(),
        staging: f.staging, primary: f.primary, backup: f.backup,
        makeMap: f.map, post: post, message: post ? msg : '' });
      if (r && r.results) {
        S.addResult = { name: r.name, results: r.results, message: msg, wantMap: f.map, wantPost: post };
        setData(r.data); window.scrollTo(0, 0);
      } else { setData(r); toast('Mission added.'); }
    } catch (e) { $('mb').disabled = false; $('mb').textContent = 'Add mission'; toast(clean(e), true); }
  };
}

/** After Add mission with a map or GroupMe post: what happened, with Try again for a step that failed. */
function addResultPanel() {
  const A = S.addResult; if (!A) return '';
  const m = S.d.missionList.find(x => x.name === A.name) || {};
  const r = A.results || {};
  const line = (ok, text, err, retry) => `<div><span class="${ok ? 'ck' : 'xk'}">${ok ? '✓' : '!'}</span>${text}${err ? `<div class="muted small">${esc(err)}</div>` : ''}${retry ? ` <button class="btn small ghost" type="button" id="${retry}">Try again</button>` : ''}</div>`;
  let rows = line(true, "Mission added. It's on everyone's Log list.");
  if (A.wantMap) rows += r.map && r.map.ok ? line(true, 'CalTopo map created' + (S.d.conn && S.d.conn.ctFolder ? ' in ' + esc(S.d.conn.ctFolder) : ''))
    : line(false, "The CalTopo map wasn't created.", r.map && r.map.error, 'rrmap');
  if (A.wantPost) rows += r.post && r.post.ok ? line(true, 'Posted to GroupMe') : line(false, "The GroupMe post didn't go out.", r.post && r.post.error, 'rrpost');
  const url = mapLink(m.mapId);
  return section(esc(A.name), `<div class="prog">${rows}</div>
    ${url ? `<a class="mapbtn" href="${url}" target="_blank" rel="noopener">🗺 Open CalTopo map</a>` : ''}
    <div class="btnrow" style="margin-top:10px">${url ? '<button class="btn small ghost" type="button" id="rrcopy">Copy map link</button>' : ''}
      <button class="btn small ghost" type="button" id="rropen">Open mission</button>
      <button class="btn small ghost" type="button" id="rrclose">Close</button></div>`);
}

function hookAddResult() {
  const A = S.addResult; if (!A || !$('rropen')) return;
  const m = S.d.missionList.find(x => x.name === A.name) || {};
  $('rropen').onclick = () => { S.openMission = A.name; S.addResult = null; render(); };
  $('rrclose').onclick = () => { S.addResult = null; render(); };
  if ($('rrcopy')) $('rrcopy').onclick = () => copyText(mapLink(m.mapId));
  if ($('rrmap')) $('rrmap').onclick = async () => {
    $('rrmap').disabled = true;
    try { const r = await run('apiCreateMap', S.creds, A.name); A.results.map = { ok: true, url: r.url }; setData(r.data); }
    catch (e) { A.results.map = { ok: false, error: clean(e) }; render(); }
  };
  if ($('rrpost')) $('rrpost').onclick = async () => {
    $('rrpost').disabled = true;
    try { await run('apiPostGroupMe', S.creds, A.message, A.name); A.results.post = { ok: true }; render(); }
    catch (e) { A.results.post = { ok: false, error: clean(e) }; render(); }
  };
}
