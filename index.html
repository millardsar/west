<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {

  /* Mission / Event picker: no hyphenated words, name on line 1, type and date on line 2 */

  /* Active mission banner, duty clock, On Duty Board */

<script>
/* ================= Duty Log: core (shared by the East and West posses) ================= */
const APP_VERSION = 'V1.6.2';
const APP_DATE = 'October 25, 2026';
const CHANGELOG = [
  { v: 'V1.6.2', date: 'November 10, 2026', items: ['Go On Duty switches right away; the save finishes in the background. If it can’t save, the button switches back and says why.'] },
  { v: 'V1.6.1', date: 'November 10, 2026', items: ['Fixed the install: renamed the Duty page file so it no longer clashes with the Duty code file.'] },
  { v: 'V1.6', date: 'November 10, 2026', items: [
    'Active-mission banner: while a callout (red) or training or event (yellow) is active, a bar under the tabs shows it on every page. Tap it for everything in one place: CalTopo map, Incident Location and Staging Point with directions, Comms Plan and Details.',
    'Go On Duty / Go Off Duty: the app keeps your time like a time clock, for callouts, trainings, meetings or maintenance. Going off duty logs your entry (hours rounded up to the next half hour) with your on and off times.',
    'On Duty Board (admins): who is on duty, their assignment, time on shift and security-check timers with a Checked button. Every action is recorded with who did it on the new Board Log tab.',
    'Missions tab (admins): Details for members, and a banner setting (automatic, keep showing until closed, or hide).',
    'GroupMe callouts: the only link is the CalTopo map; the Log Your Time link is gone, with a line pointing members to the Duty Log app for details.'
  ] },
  { v: 'V1.5.11', date: 'November 9, 2026', items: [
    'GroupMe alerts can post from the Commander\'s own GroupMe account instead of a bot (Settings > Connections), so the links can be tapped in the Android GroupMe app too.'
  ] },
  { v: 'V1.5.10', date: 'November 9, 2026', items: [
    'Settings > Connections > GroupMe > Send test message now sends three short posts with links written different ways, to find which ones Android phones can tap.'
  ] },
  { v: 'V1.5.9', date: 'November 9, 2026', items: [
    'If a phone can\'t load part of the app, it now shows a clear message with a Reload button instead of an error, and the details are saved on the App Errors tab of the sheet so the problem can be fixed.'
  ] },
  { v: 'V1.5.8', date: 'November 9, 2026', items: [
    'GroupMe mission posts are easier to read: bold section headings (Incident Location, Staging Point, Comms Plan, Details, Map, Log Your Time) with a blank line between sections. A very long post is sent in parts instead of being cut off.'
  ] },
  { v: 'V1.5.7', date: 'November 8, 2026', items: [
    'The sign-in code box no longer forces capital letters. Type the code in capitals or lowercase; either one works. The code is saved the way the Commander types it.'
  ] },
  { v: 'V1.5.6', date: 'November 8, 2026', items: [
    'Cleaned-up Search & Rescue badge: sharp lettering, a true circle, and star points with the same scrollwork and beveled edges as the Sheriff\'s Office badge. The logo is also a little larger.'
  ] },
  { v: 'V1.5.5', date: 'November 8, 2026', items: [
    'Mission / Event lists (Log page, Photos filter, and Merge) open as a large, easy-to-read list. Each mission shows its name on the first line and the type and date on the second, with no words split by hyphens.'
  ] },
  { v: 'V1.5.4', date: 'October 25, 2026', items: [
    'The GroupMe post and the Open CalTopo map button use a share link (Write access by default, set in Settings > Connections), so members open the map in one tap with no bookmark questions. The message also says where to find the map in CalTopo.',
    'Mission names are in ALL CAPS (Add Mission, Rename, and new names on the Log page), to match the CalTopo map name.',
    'Long mission names and locations wrap onto more lines so they are easy to read and edit.',
    'Map picker: Topo / Aerial switch at any zoom, and saved places show as ★ pins you can tap. A ★ Saved button fills a location from your saved places.',
    'The screen stays put after picking a location on the map. The start date box matches the other boxes.',
    'Clear button on the Log page.',
    'Weak signal: the app tries again on its own and never gets stuck. What you type on Add Mission and the Log page is kept on your phone until it is saved, and a retry never adds a mission or entry twice.'
  ] },
  { v: 'V1.5.3', date: 'October 25, 2026', items: [
    '“Location” is now “Incident Location”.',
    'Pick on map has a Name box: name the spot (like Cemetery or Trailhead) and the box keeps the name with its exact coordinates, e.g. Cemetery (38.97012, -112.30455). That is what goes in the GroupMe message.',
    'The new CalTopo map gets a marker for both the Incident Location and the Staging Point when both are filled in.'
  ] },
  { v: 'V1.5.2', date: 'October 25, 2026', items: [
    'Staging Point can be a known place name (like Kanosh Park or Posse Shed) as well as coordinates picked on the map.',
    'After an update, the app loads fresh data once instead of showing numbers saved by the older version.',

function viaScriptRun(fn, args) {
  if (!(window.google && google.script && google.script.run)) return Promise.reject(new Error("Couldn't reach the server. Check your connection and try again."));
  return new Promise((res, rej) => {
    const timer = setTimeout(() => rej(new Error('The server did not answer. Check your connection and reload the page.')), 60000);
    google.script.run
      .withSuccessHandler(v => { clearTimeout(timer); res(v); })
      .withFailureHandler(e => { clearTimeout(timer); rej(e); })[fn](...args);
  });
}

async function viaFetch(fn, args) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 60000);
  try {
    const r = await fetch(EXEC_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), signal: ctl.signal });
    const j = await r.json();
    if (!j.ok) { const e = new Error(j.error); e.server = true; throw e; }
    return j.data;
  } finally { clearTimeout(timer); }
}

/**
 * Calls the server. A dropped connection or slow answer is tried once more on its own; after that the member gets a
 * plain message and can tap the button again (nothing they typed is lost, and nothing is ever saved twice).
 */
async function run(fn, ...args) {
  const scriptRun = !!(window.google && google.script && google.script.run);
  if (useFetch || !scriptRun) {
    try { return await viaFetch(fn, args); }
    catch (e) {
      if (e.server) throw e;
      await new Promise(r => setTimeout(r, 1500));
      try { return await viaFetch(fn, args); }
      catch (e2) {
        if (e2.server) throw e2;
        if (!scriptRun) throw new Error("Couldn't reach the server. Check your signal and tap the button again. What you typed is still here.");
        useFetch = false;
      }
    }
  }
  return viaScriptRun(fn, args);
}

/* ---- Mission name matching ---- */
const MONTH_WORDS = /^(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec|january|february|march|april|june|july|august|september|october|november|december)$/;
function normName(s) { return String(s || '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').trim(); }
function lev(a, b) {
  const v = Array(b.length + 1).fill(0).map((_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = v[0]; v[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = v[j];
      v[j] = Math.min(v[j] + 1, v[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;
    }
  }
  return v[b.length];
}
function similarName(a, b) {
  const x = normName(a), y = normName(b);
  if (!x || !y) return false;
  if (x === y) return true;
  const ta = x.split(' '), tb = y.split(' ');
  const diff = ta.filter(w => tb.indexOf(w) < 0).concat(tb.filter(w => ta.indexOf(w) < 0));
  if (diff.length && diff.every(w => /^\d+$/.test(w) || MONTH_WORDS.test(w))) return false;
  if (1 - lev(x, y) / Math.max(x.length, y.length) >= 0.8) return true;
  const sa = ta.filter(w => w.length > 2), sb = tb.filter(w => w.length > 2);
  if (sa.length >= 2 && sb.length >= 2) {
    const shared = sa.filter(w => sb.indexOf(w) >= 0).length;
    if (shared / Math.min(sa.length, sb.length) >= 0.75) return true;
  }
  return Math.min(x.length, y.length) >= 6 && (x.indexOf(y) >= 0 || y.indexOf(x) >= 0);
}

/**
 * Team functions for a list of entries (same rule as the server): each mission or event counts once per
 * calendar day anyone logged time on it; months from the old monthly form use the highest number any one
 * unit reported; a month with both uses the larger. Returns { total, byMonth: { 'yyyy-mm': n }, byType: { type: n } }.
 */
function teamFn(list) {
  const months = {};
  list.forEach(e => {
    if (e.exclude) return;
    const k = e.date.slice(0, 7);
    const M = months[k] || (months[k] = { keys: {}, byType: {}, n: 0, legacy: {} });
    if (e.source === 'App') {
      const key = (e.mission ? 'm:' + e.mission.toLowerCase() : 't:' + e.type) + '|' + e.date;
      if (!M.keys[key]) { M.keys[key] = 1; M.n++; M.byType[e.type] = (M.byType[e.type] || 0) + 1; }
    } else {
      M.legacy[e.unit] = Math.max(M.legacy[e.unit] || 0, e.f || 0);
    }
  });
  const out = { total: 0, byMonth: {}, byType: {} };
  Object.keys(months).forEach(k => {
    const M = months[k];
    const legacy = Math.max(0, ...Object.keys(M.legacy).map(u => M.legacy[u]));
    const types = legacy > M.n ? { 'Monthly report': legacy } : M.byType;
    Object.keys(types).forEach(t => { out.byType[t] = (out.byType[t] || 0) + types[t]; });
    out.byMonth[k] = Math.max(legacy, M.n);
    out.total += out.byMonth[k];
  });
  return out;
}

/* ---------------- Keeping an open page current ---------------- */

/**
 * When the member comes back to the app (or every 15 minutes while it is open): fetch fresh numbers, and check
 * whether a newer version has been released. The screen is only redrawn when it is safe (not mid-typing, no
 * pop-up or open mission), so nothing the member is entering gets wiped.
 */
let lastCheck = Date.now();
async function keepCurrent(force) {
  if (document.hidden) return;
  if (!force && Date.now() - lastCheck < 60000) return;
  lastCheck = Date.now();
  try {
    const v = await run('apiVersion');
    if (v && v.version && v.version !== APP_VERSION) showUpdateBar(v.version);
  } catch (e) { /* offline or busy: try again later */ }
  if (!S.creds || !S.d) return;
  try { applyFresh(await run('apiRefresh', S.creds)); }
  catch (e) { /* signed out or offline: leave the screen as it is */ }
}

function showUpdateBar(version) {
  if ($('upbar')) return;
  document.body.insertAdjacentHTML('beforeend', `<button id="upbar" class="upbar" type="button">
    A new version of the Duty Log is available (${esc(version)}). <b>Tap to update.</b></button>`);
  $('upbar').onclick = () => {
    /* On the posse's own web address, ask for the new page (not the browser's saved copy) */
    if (/millardsar\.org$/.test(location.hostname)) location.replace(location.pathname + '?v=' + encodeURIComponent(version));
    else location.reload();
  };
}

document.addEventListener('visibilitychange', () => { if (!document.hidden) keepCurrent(); });

setInterval(() => keepCurrent(true), 15 * 60000);

/* ---------------- Sign in ---------------- */

async function init() {
  const c = load('posseCreds'), saved = load('posseData'), boot = load('posseBoot');
  if (c && saved && saved.unit === c.unit && saved.v === APP_VERSION && saved.d && saved.d.me) {
    /* Show the numbers from last time right away, then refresh them in the background */
    S.boot = boot || { units: [] };
    S.creds = c;
    resetView();
    S.tab = 'log';
    S.d = saved.d; buildTabs(); render();
    syncNote('Updating…');
    try {
      const r = await run('apiStart', c);
      S.boot = r.boot; store('posseBoot', r.boot);
      syncNote(null);
      if (r.data) { applyFresh(r.data); return; }
      store('posseCreds', null); store('posseData', null); S.creds = null; S.d = null;
      showLogin(r.error || 'Please sign in again.');
    } catch (e) { syncNote("Couldn't reach the server. Showing your saved numbers.", true); }
    return;
  }
  if (!c && boot && boot.units && boot.units.length) {
    /* Sign-in screen right away; refresh the unit list behind it */
    S.boot = boot; showLogin();
    run('apiBoot').then(b => {
      S.boot = b; store('posseBoot', b);
      if (!S.d && !S.touched && $('lf') && !$('lp').value) showLogin();
    }).catch(() => {});
    return;
  }
  try {
    if (c) {
      /* Saved sign-in: unit list and data in one trip */
      const r = await run('apiStart', c);
      S.boot = r.boot; store('posseBoot', r.boot);
      if (r.data) { finishLogin(c, r.data); return; }
      store('posseCreds', null);
    } else {
      S.boot = await run('apiBoot'); store('posseBoot', S.boot);
    }
  } catch (e) { main(section('Error', `<p>Couldn't load the app: ${esc(clean(e))}</p>`)); return; }
  showLogin();
}

function showLogin(msg) {
  $('tabs').classList.add('hidden'); $('who').innerHTML = '';
  const opts = S.boot.units.map(u => `<option value="${u.unit}">${u.unit} – ${esc(u.name)}</option>`).join('');
  main(section('Sign In', `${LOGO ? `<img class="signlogo" src="${LOGO}" alt="Millard County Sheriff Search & Rescue">` : ''}<form id="lf" class="form">
    <label>Unit<select id="lu" required><option value="">Choose your unit…</option>${opts}</select></label>
    <p id="lnew" class="hidden" style="margin:0 0 14px">First time signing in? Enter the sign-in code from the Commander, then choose your own 4 to 8 digit PIN. You'll use the PIN every time after this.</p>
    <label id="lcw" class="hidden">Sign-in code<input id="lc" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="20"></label>
    <label><span id="lpl">PIN</span><input id="lp" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" required></label>
    <label id="lp2w" class="hidden">PIN again<input id="lp2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8"></label>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <button class="btn" type="submit" id="lb">Sign in</button>
    <p class="muted small" id="lhelp">Forgot your PIN? Ask the Commander to reset it.</p></form>`));
  const unitInfo = u => S.boot.units.find(x => x.unit === u);
  const isNew = () => { const u = unitInfo($('lu').value); return !!(u && u.hasPin === false); };
  const setMode = () => {
    const n = isNew();
    $('lnew').classList.toggle('hidden', !n);
    $('lp2w').classList.toggle('hidden', !n);
    $('lp2').required = n;
    $('lcw').classList.toggle('hidden', !n); $('lc').required = n;
    $('lpl').textContent = n ? 'New PIN' : 'PIN';
    $('lp').autocomplete = n ? 'new-password' : 'current-password';
    $('lb').textContent = n ? 'Create PIN & sign in' : 'Sign in';
  };
  const last = load('posseLastUnit'); if (last) $('lu').value = last;
  if (msg && S.lastTry) $('lu').value = S.lastTry;
  setMode();
  $('lu').onchange = setMode;
  if (finePointer()) ($('lu').value ? $('lp') : $('lu')).focus();
  $('lf').onsubmit = async ev => {
    ev.preventDefault();
    const unit = $('lu').value, pin = $('lp').value.trim();
    S.lastTry = unit;
    if (isNew()) {
      const bad = !$('lc').value.trim() ? 'Enter the sign-in code from the Commander.'
        : !/^\d{4,8}$/.test(pin) ? 'Your PIN must be 4 to 8 digits.'
        : pin !== $('lp2').value.trim() ? "The two PINs don't match." : '';
      if (bad) { toast(bad, true); return; }
      $('lb').disabled = true; $('lb').textContent = 'Saving…';
      try {
        const d = await run('apiFirstPin', unit, pin, $('lc').value.trim());
        const u = unitInfo(unit); if (u) u.hasPin = true;
        finishLogin({ unit: unit, pin: pin }, d);
        toast('PIN saved. Welcome!');
      } catch (e) {
        if (/already has a PIN/.test(clean(e))) { const u = unitInfo(unit); if (u) u.hasPin = true; }
        showLogin(clean(e));
      }
      return;
    }
    $('lb').disabled = true; $('lb').textContent = 'Signing in…';
    try { await login({ unit: unit, pin: pin }); }
    catch (e) { showLogin(clean(e)); }
  };
}

async function login(c) {
  finishLogin(c, await run('apiLogin', c));
}

function finishLogin(c, d) {
  S.creds = c; store('posseCreds', c); store('posseLastUnit', c.unit);
  resetView();
  S.tab = d.me.mustSetPin ? 'pin' : 'log';
  setData(d);
}

/* ---------------- Swipe left / right to change tabs (phones and tablets) ---------------- */

function goTab(k, dir) {
  S.tab = k; S.report = null; buildTabs(); render(); window.scrollTo(0, 0);
  const on = document.querySelector('#tabs button.on');
  if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'center' });
  const mainEl = $('main');
  mainEl.classList.remove('slide-l', 'slide-r'); void mainEl.offsetWidth;
  mainEl.classList.add(dir > 0 ? 'slide-l' : 'slide-r');
}

(function () {
  let sx = 0, sy = 0, st = 0, ok = false;
  const blocked = el => !!(el.closest && el.closest('input, select, textarea, button, a, canvas, .tblwrap, .thumbs, .seg, #npop, .rpage, .rtools'));
  document.addEventListener('touchstart', ev => {
    ok = false;
    if (ev.touches.length !== 1 || !S.d || !S.tabList || S.report || $('npop') || $('pview')) return;
    if (S.tabList.indexOf(S.tab) < 0) return;
    const t = ev.touches[0];
    if (t.clientX < 24 || t.clientX > window.innerWidth - 24) return;
    if (!$('main').contains(ev.target) || blocked(ev.target)) return;
    sx = t.clientX; sy = t.clientY; st = Date.now(); ok = true;
  }, { passive: true });
  document.addEventListener('touchend', ev => {
    if (!ok) return; ok = false;
    const t = ev.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Date.now() - st > 700 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
    if (window.getSelection && String(window.getSelection()).length) return;
    const i = S.tabList.indexOf(S.tab), j = i + (dx < 0 ? 1 : -1);
    if (j < 0 || j >= S.tabList.length) return;
    goTab(S.tabList[j], dx < 0 ? 1 : -1);
  }, { passive: true });
})();

function buildTabs() {
  const t = [['log', 'Log'], ['stats', 'My Stats'], ['team', 'Team'], ['missions', 'Missions']];
  if (boardWanted()) t.splice(1, 0, ['board', 'Board']);
  if (S.d.me.admin) t.push(['photos', 'Photos'], ['report', 'Report'], ['review', 'Review'], ['settings', 'Settings']);
  t.push(['about', 'About']);
  S.tabList = t.map(x => x[0]);
  $('tabs').innerHTML = t.map(([k, l]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('');
  $('tabs').classList.remove('hidden');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; S.report = null; buildTabs(); render(); window.scrollTo(0, 0); });
  $('who').innerHTML = `${esc(S.d.me.unit)} · ${esc(S.d.me.name)}<button class="link" id="cp">Account</button><button class="link" id="so">Sign out</button>`;
  $('so').onclick = () => { store('posseCreds', null); store('posseData', null); S.creds = null; S.d = null; showLogin(); };
  $('cp').onclick = () => { S.tab = 'pin'; buildTabs(); render(); window.scrollTo(0, 0); };
  if (S.tab === 'pin' && S.d.me.mustSetPin) $('tabs').classList.add('hidden');
}

function render() {
  if (S.chart) { S.chart.destroy(); S.chart = null; }
  S.touched = false;
  if (S.report) { if (S.report.kind === 'mission') renderMissionReport(); else renderYearEnd(); return; }
  const fn = { log: renderLog, stats: renderStats, team: renderTeam, report: renderReport, missions: renderMissions,
    review: renderReview, settings: renderSettings, photos: renderPhotos, edit: renderEdit, pin: renderPin, about: renderAbout, board: renderBoard }[S.tab] || renderLog;
  $('main').classList.remove('widemain');
  fn();
  drawActBar();
}

function renderPin() {
  const first = S.d.me.mustSetPin, me = S.d.me;
  const acct = first ? '' : section('Account', `<dl class="acct">
      <dt>Unit</dt><dd>${esc(me.unit)}</dd>
      <dt>Name</dt><dd>${esc(me.name)}</dd>
      <dt>Access</dt><dd>${me.admin ? 'Admin (Commander tools)' : 'Member'}</dd></dl>
      <button class="btn small ghost" type="button" id="aso">Sign out</button>`);
  main(acct + section(first ? 'Choose Your Own PIN' : 'Change PIN', `<form id="pf" class="form">
      ${first ? `<p style="margin-top:0">Welcome, ${esc(me.name)}. The PIN you just used was a starting PIN. Pick your own 4 to 8 digit PIN to finish setting up.</p>` : ''}
      <label>New PIN<input id="p1" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" required></label>
      <label>New PIN again<input id="p2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" required></label>
      <button class="btn" type="submit" id="pb">Save PIN</button>

/** The Mission / event dropdown: open missions of every type, recent names, and "+ New". */
function missionSelect(current) {
  const d = S.d;
  const ongoing = d.missions.filter(m => m.ongoing).sort((a, b) => a.name.localeCompare(b.name));
  const dated = d.missions.filter(m => !m.ongoing).sort((a, b) => b.date.localeCompare(a.date) || a.name.localeCompare(b.name));
  const all = d.missions.map(m => m.name);
  const cur = current && all.indexOf(current) < 0
    ? `<option value="${esc(current)}" selected>${esc(current)}</option>` : '';
  const sel = m => m.name === current ? 'selected' : '';
  const jt = m => m.joint ? ' · Joint' : '';
  const lk = m => m.locked ? (m.name === current ? '' : ' disabled') : '';
  const lt = m => m.locked ? ' · 🔒 Locked' : '';
  const optO = m => `<option value="${esc(m.name)}" ${sel(m)}${lk(m)} data-n="${esc(m.name)}" data-s="${esc(m.type + jt(m) + lt(m))}">${esc(m.name)} · ${esc(m.type)}${jt(m)}${lt(m)}</option>`;
  const optD = m => `<option value="${esc(m.name)}" ${sel(m)}${lk(m)} data-n="${esc(m.name)}" data-s="${esc(fmtDate(m.date) + ' · ' + m.type + jt(m) + lt(m))}">${esc(fmtDate(m.date))} · ${esc(m.name)} · ${esc(m.type)}${jt(m)}${lt(m)}</option>`;
  return `<select id="ems">
      <option value="">${current ? '— None —' : '— Pick a Mission or Event —'}</option>${cur}
      ${ongoing.length ? `<optgroup label="Ongoing">${ongoing.map(optO).join('')}</optgroup>` : ''}
      ${dated.length ? `<optgroup label="Missions & events, newest first">${dated.map(optD).join('')}</optgroup>` : ''}
      <option value="__new">+ New Mission / Event…</option>
    </select>`;
}

/**
 * Big, readable picker for lists of mission names. The phone's built-in picker splits long words
 * with hyphens; this shows each choice in full: name on line 1 (data-n or the option text),
 * details on line 2 (data-s). The real <select> stays (hidden) and keeps the value.
 */
function bigSelect(id, title) {
  const sel = $(id); if (!sel || sel.dataset.big) return;
  sel.dataset.big = '1'; sel.dataset.title = title || ''; sel.classList.add('hidden'); sel.tabIndex = -1;
  sel.insertAdjacentHTML('beforebegin', `<button type="button" id="${id}_b" class="msbtn" aria-haspopup="listbox"></button>`);
  $(id + '_b').onclick = () => openPick(id);
  sel.addEventListener('change', () => syncPick(id));
  syncPick(id);
}
function optName(o) { return o.dataset.n || o.textContent; }
function syncPick(id) {
  const sel = $(id), b = $(id + '_b'); if (!sel || !b) return;
  const o = sel.options[sel.selectedIndex];
  if (!o) { b.innerHTML = ''; return; }
  if (o.value === '__new') { b.innerHTML = '<span class="msn">+ New Mission / Event</span>'; return; }
  b.innerHTML = `<span class="msn${!o.value ? ' ph' : ''}">${esc(optName(o))}</span>${o.dataset.s ? `<span class="mss">${esc(o.dataset.s)}</span>` : ''}`;
}
function openPick(id) {
  const sel = $(id); if (!sel) return;
  closeMs();
  const one = o => {
    const on = o.selected ? ' on' : '';
    if (o.value === '__new') return `<button type="button" class="msi newm" data-v="__new">+ New Mission / Event…</button>`;
    if (!o.value) return `<button type="button" class="msi none${on}" data-v="">${esc(o.textContent)}</button>`;
    return `<button type="button" class="msi${on}" data-v="${esc(o.value)}" ${o.disabled ? 'disabled' : ''}><span class="msn">${esc(optName(o))}</span>${o.dataset.s ? `<span class="mss">${esc(o.dataset.s)}</span>` : ''}</button>`;
  };
  let h = '';
  [].forEach.call(sel.children, ch => {
    if (ch.tagName === 'OPTGROUP') h += `<div class="msg">${esc(ch.label)}</div>` + [].map.call(ch.children, one).join('');
    else h += one(ch);
  });
  document.body.insertAdjacentHTML('beforeend', `<div class="mssh" id="mssh"><div class="msbox" role="listbox" aria-label="${esc(sel.dataset.title)}">
    <div class="mshead"><b>${esc(sel.dataset.title)}</b><button type="button" class="msx" id="msx" aria-label="Close">✕</button></div>
    <div class="mslist" id="mslist">${h}</div></div></div>`);
  document.documentElement.classList.add('msopen');
  $('mssh').onclick = ev => { if (ev.target.id === 'mssh') closeMs(); };
  $('msx').onclick = closeMs;
  $('mslist').querySelectorAll('.msi').forEach(b => b.onclick = () => {
    sel.value = b.dataset.v; closeMs();
    sel.dispatchEvent(new Event('change', { bubbles: true }));
    sel.dispatchEvent(new Event('input', { bubbles: true }));
    const btn = $(id + '_b'); if (btn) btn.focus();
  });
  const on = $('mslist').querySelector('.msi.on'); if (on) on.scrollIntoView({ block: 'center' });
}
function closeMs() { const x = $('mssh'); if (x) x.remove(); document.documentElement.classList.remove('msopen'); }

      <label id="emwrap" class="hidden">New Mission / Event name<textarea id="em" class="grow1" rows="1" maxlength="80" autocomplete="off" placeholder="e.g. LOST HIKER – CHALK CREEK"></textarea></label>

function missionValue() {
  return $('ems').value === '__new' ? $('em').value.trim() : $('ems').value;
}

function knownMissions() { return S.d.missions.map(m => m.name); }

/** Existing names that look like `name` but aren't exactly it. */
function lookalikes(name) {
  const n = name.trim();
  if (!n) return [];
  if (knownMissions().some(k => k === n)) return [];
  return knownMissions().filter(k => similarName(k, n)).slice(0, 3);
}

function pickMission(name) {
  const sel = $('ems');
  if ([].some.call(sel.options, o => o.value === name)) sel.value = name;
  syncPick('ems');
  $('emwrap').classList.toggle('hidden', sel.value !== '__new');
  const m = S.d.missions.find(x => x.name === name);
  if (m) $('et').value = m.type;
}

function showSim(force) {
  const box = $('simbox'); if (!box) return;
  const v = $('ems').value === '__new' ? $('em').value.trim() : '';
  if (force) S.simForced = v; else if (S.simForced === v) force = true;
  const sims = lookalikes(v);
  if (!sims.length || (S.simOk && S.simOk === v)) { box.classList.add('hidden'); box.innerHTML = ''; return; }
  box.innerHTML = `<b>${force ? 'Is this the same mission?' : 'Similar mission already exists:'}</b>
    ${sims.map(s => `<button type="button" class="opt" data-n="${esc(s)}">Use “${esc(s)}”</button>`).join('')}
    ${force ? `<button type="button" class="keep">No, “${esc(v)}” is a different mission. Save it as new.</button>` : ''}`;
  box.classList.remove('hidden');
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => { pickMission(b.dataset.n); box.classList.add('hidden'); $('eh').focus(); });
  const k = box.querySelector('.keep');
  if (k) k.onclick = () => { S.simOk = v; box.classList.add('hidden'); $('ef').requestSubmit(); };
}

/** Before saving: fix case/punctuation-only differences, and stop if a look-alike exists. */
function checkMissionName() {
  if ($('ems').value !== '__new') return true;
  const v = $('em').value.trim();
  if (!v) { toast('Type a name for the new mission, or pick one from the list.', true); $('em').focus(); return false; }
  const same = knownMissions().find(k => normName(k) === normName(v));
  if (same) { pickMission(same); return true; }
  if (S.simOk === v || !lookalikes(v).length) return true;
  clearTimeout(S.simTimer);
  showSim(true);
  $('simbox').scrollIntoView({ block: 'center', behavior: 'smooth' });
  return false;
}

function hookEntryForm() {
  S.simOk = null; S.simForced = null;
  capsInput($('em')); growBox($('em'));
  bigSelect('ems', 'Mission / Event');
  $('ems').addEventListener('change', () => {
    const v = $('ems').value;
    $('emwrap').classList.toggle('hidden', v !== '__new');
    if (v === '__new') { $('em').focus(); if ($('em').fit) $('em').fit(); return; }
    $('simbox').classList.add('hidden');
    const m = S.d.missions.find(x => x.name === v);
    if (m) $('et').value = m.type;
  });
  $('em').addEventListener('input', () => { clearTimeout(S.simTimer); S.simTimer = setTimeout(() => showSim(false), 400); });
  $('em').addEventListener('change', () => showSim(false));
  $('ep').addEventListener('change', () => {
    const files = [].slice.call($('ep').files || []);
    $('pprev').innerHTML = files.map(f => `<img alt="" src="${URL.createObjectURL(f)}">`).join('');
  });
}

function entryValues() {
  return { date: $('ed').value, type: $('et').value, mission: missionValue(),
    hours: $('eh').value, miles: $('ei').value, notes: $('en').value.trim() };
}

function renderLog() {
  const d = S.d, now = new Date();
  const live = d.mine.filter(e => !e.exclude);
  const mtd = sum(live.filter(e => e.date.slice(0, 7) === ym(now.getFullYear(), now.getMonth())));
  const pre = S.prefill ? { date: S.prefill, type: d.types[0], mission: '', h: '', mi: '', notes: '' } : null;
  S.prefill = null;
  main(section('Log Activity', dutyLogStrip() + entryForm(pre, 'Save entry', false))
    + section(`This Month · ${MONTHS_LONG[now.getMonth()]}`, tiles(mtd)));
  hookEntryForm(); hookDutyStrip();
  /* Keep what the member is typing on the phone until it's saved */
  const ids = ['ed', 'et', 'ems', 'em', 'eh', 'ei', 'en'];
  const dr = pre ? null : draftLoad('entry');
  if (dr && (dr.em || dr.eh || dr.ei || dr.en || dr.ems)) {
    ids.forEach(id => { if (dr[id] != null && $(id)) $(id).value = dr[id]; });
    if ($('ems').value !== dr.ems && dr.ems && dr.ems !== '__new') { /* mission no longer on the list */ $('ems').value = '__new'; $('em').value = dr.ems; }
    $('emwrap').classList.toggle('hidden', $('ems').value !== '__new');
    syncPick('ems');
    if ($('em').fit) $('em').fit();
    toast('Restored what you were typing. Tap Clear to start over.', false, 4000);
  }
  let dt;
  const keep = () => { clearTimeout(dt); dt = setTimeout(() => { const o = {}; ids.forEach(id => { o[id] = $(id) ? $(id).value : ''; }); draftSave('entry', o); }, 300); };
  $('ef').addEventListener('input', keep); $('ef').addEventListener('change', keep);
  $('eclr').onclick = () => {
    if (($('em').value.trim() || $('eh').value || $('ei').value || $('en').value.trim() || $('ems').value) && !confirm('Clear the form and start over?')) return;
    clearTimeout(dt); draftClear('entry'); S.entryRid = null; S.prefill = null;
    const y = window.scrollY; render(); window.scrollTo(0, y);
  };
  if (finePointer()) $('ed').focus();
  $('ef').onsubmit = ev => { ev.preventDefault(); saveEntry(false); };
}

function renderEdit() {
  const e = S.edit;
  if (!e) { S.tab = 'stats'; render(); return; }
  const back = () => { S.edit = null; S.tab = 'stats'; buildTabs(); render(); };
  if (e.source === 'App') {
    main(section('Edit Entry', entryForm(e, 'Save changes', true)));
    hookEntryForm();
  } else {
    main(section(`Edit Monthly Report · ${fmtMonth(e.date)}`, `<form id="ef" class="form">
        <div class="row2">
          <label>Functions<input type="number" id="ef_f" min="0" max="100" step="1" required value="${e.f == null ? '' : e.f}"></label>
          <label>Hours<input type="number" id="eh" min="0" max="744" step="0.5" required value="${e.h == null ? '' : e.h}"></label>
        </div>
        <label>Miles<input type="number" id="ei" min="0" max="20000" step="1" required value="${e.mi == null ? '' : e.mi}"></label>
        <label>Notes (optional)<textarea id="en" rows="2" maxlength="500">${esc(e.notes)}</textarea></label>
        <button class="btn" type="submit" id="eb">Save changes</button>
        <button class="btn gray" type="button" id="ec" style="margin-top:8px">Cancel</button>
      </form>`));
  }
  if (finePointer()) ($('ed') || $('ef_f')).focus();
  $('ec').onclick = back;
  $('ef').onsubmit = async ev => {
    ev.preventDefault();
    if (e.source === 'App' && !checkMissionName()) return;
    const vals = e.source === 'App' ? entryValues()
      : { functions: $('ef_f').value, hours: $('eh').value, miles: $('ei').value, notes: $('en').value.trim() };
    if (e.source === 'App' && vals.type === 'Callout' && !vals.mission) { toast('Pick the mission for a callout.', true); return; }
    const files = $('ep') ? [].slice.call($('ep').files || []) : [];
    const b = $('eb'); b.disabled = true; b.textContent = 'Saving…';
    try {
      let d = await run('apiUpdateEntry', S.creds, e.id, vals);
      S.edit = null; S.tab = 'stats';
      setData(d);
      toast('Changes saved.');
      if (files.length) await uploadPhotos(files, { entryId: e.id, mission: vals.mission, date: vals.date });
    } catch (err) {
      b.disabled = false; b.textContent = 'Save changes';
      toast(clean(err), true);
    }
  };
}

async function saveEntry(force) {
  if (!checkMissionName()) return;
  const e = entryValues();
  if (e.type === 'Callout' && !e.mission) { toast('Pick the mission for a callout.', true); $('ems_b').focus(); openPick('ems'); return; }
  if (!force && Number(e.hours) > 16 && !confirm(e.hours + ' hours is a long stretch. Save it?')) return;
  const files = [].slice.call($('ep').files || []);
  const b = $('eb'); b.disabled = true; b.textContent = 'Saving…';
  S.entryRid = S.entryRid || newRid();
  e.rid = S.entryRid;
  try {
    const r = await run('apiAddEntry', S.creds, e, force);
    if (r.dup) {
      b.disabled = false; b.textContent = 'Save entry';
      if (confirm('You already logged this mission on this date. Save another entry anyway?')) saveEntry(true);
      return;
    }
    S.entryRid = null; draftClear('entry');
    setData(r.data);
    toast('Saved. Thanks!');
    if (files.length) await uploadPhotos(files, { entryId: r.id, mission: e.mission, date: e.date });
  } catch (err) {
    b.disabled = false; b.textContent = 'Save entry';
    toast(clean(err), true);
  }
}

/** Shrinks a photo to at most 1600 px on the long side, as a JPEG. Returns base64 (no prefix). */
function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1600, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error(file.name + " couldn't be read. Try a JPG or PNG.")); };
    img.src = url;
  });
}

async function uploadPhotos(files, info) {
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    toast(`Uploading photo ${i + 1} of ${files.length}…`, false, 60000);
    try {
      const data = await shrinkPhoto(files[i]);
      await run('apiUploadPhoto', S.creds, { entryId: info.entryId, mission: info.mission, date: info.date, mime: 'image/jpeg', data: data });
      ok++;
    } catch (err) { toast(clean(err), true, 5000); await new Promise(r => setTimeout(r, 1500)); }
  }
  try { setData(await run('apiRefresh', S.creds)); } catch (e) {}
  toast(ok === files.length ? `${ok} photo${ok === 1 ? '' : 's'} uploaded.` : `${ok} of ${files.length} photos uploaded.`, ok !== files.length, 4000);
}

<script>
/* ================= My Stats, Team, Missions ================= */

function statPeriods(years) {
  const now = new Date(), cy = now.getFullYear(), cm = now.getMonth();
  const lm = new Date(cy, cm - 1, 1);
  const from12 = new Date(cy, cm - 11, 1);
  const p = [
    { k: 'month', label: 'This month', sub: MONTHS_LONG[cm] + ' ' + cy, year: cy, test: e => e.date.slice(0, 7) === ym(cy, cm) },
    { k: 'last', label: 'Last month', sub: MONTHS_LONG[lm.getMonth()] + ' ' + lm.getFullYear(), year: lm.getFullYear(),
      test: e => e.date.slice(0, 7) === ym(lm.getFullYear(), lm.getMonth()) },
    { k: 'ytd', label: 'Year to date', sub: 'Jan 1 – today, ' + cy, year: cy, goal: true, test: e => +e.date.slice(0, 4) === cy },
    { k: '12', label: 'Last 12 months', sub: MONTHS[from12.getMonth()] + ' ' + from12.getFullYear() + ' – ' + MONTHS[cm] + ' ' + cy, year: cy,
      test: e => e.date.slice(0, 7) >= ym(from12.getFullYear(), from12.getMonth()) }
  ];
  years.filter(y => y < cy).forEach(y => p.push({ k: 'y' + y, label: String(y), sub: 'Full year', year: y, goal: true, test: e => +e.date.slice(0, 4) === y }));
  return p;
}

function renderStats() {
  const d = S.d, s = d.settings, live = d.mine.filter(e => !e.exclude);
  const cy = new Date().getFullYear();
  const years = [...new Set(d.mine.map(e => +e.date.slice(0, 4)).concat(cy))].sort((a, b) => b - a);
  const periods = statPeriods(years);
  const P = periods.find(x => x.k === S.period) || periods.find(x => x.k === 'ytd');
  const t = sum(live.filter(P.test));
  const pct = s.required ? Math.min(100, t.f / s.required * 100) : 0;

  const picker = `<select id="sp" class="mini" aria-label="Period">${periods.map(x => `<option value="${x.k}" ${x.k === P.k ? 'selected' : ''}>${x.label}</option>`).join('')}</select>`;
  const goal = P.goal ? `<div class="goal"><div class="goalhead"><b>${n1(t.f)} of ${n1(s.required)}</b> required functions
      ${t.f >= s.required ? '<span class="ok">✓ Goal met</span>' : `<span class="muted small">(${n1(s.required - t.f)} to go)</span>`}</div>
      <div class="pbar"><div style="width:${pct}%"></div></div></div>` : '';
  let html = section('My Stats', `<p class="muted small" style="margin:0 0 10px">${esc(P.label)} · ${esc(P.sub)}</p>` + tiles(t) + goal, picker);

  const y = P.year;
  const ytdT = sum(live.filter(e => +e.date.slice(0, 4) === y));
  const byNewest = (a, b) => b.date.localeCompare(a.date) || b.logged.localeCompare(a.logged);
  const lastM = y === cy ? new Date().getMonth() : 11;
  let rows = '';
  for (let m = 0; m <= lastM; m++) {
    const key = ym(y, m);
    const mt = sum(live.filter(e => e.date.slice(0, 7) === key));
    const open = S.openMonth === key;
    rows += `<tr class="click ${mt.f || mt.h ? '' : 'dim'}" data-ym="${key}" tabindex="0"><td><span class="chev">${open ? '▾' : '▸'}</span>${MONTHS_LONG[m]}</td><td>${n1(mt.f)}</td><td>${n1(mt.h)}</td><td>${n1(mt.mi)}</td><td>${money(mt.v)}</td></tr>`;
    if (open) {
      const mine = d.mine.filter(e => e.date.slice(0, 7) === key).sort(byNewest);
      rows += `<tr><td colspan="5" class="detail">${mine.map(entryItem).join('') || '<p class="muted small" style="margin:8px 0 0">Nothing logged this month.</p>'}
        <button class="addm" data-ym="${key}">+ Add an entry for ${MONTHS_LONG[m]}</button></td></tr>`;
    }
  }
  html += section(`By Month · ${y}`, `<div class="tblwrap"><table><tr><th>Month</th><th>Functions</th><th>Hours</th><th>Miles</th><th>Value</th></tr>${rows}
      <tr class="tot"><td>Total</td><td>${n1(ytdT.f)}</td><td>${n1(ytdT.h)}</td><td>${n1(ytdT.mi)}</td><td>${money(ytdT.v)}</td></tr></table></div>
      <p class="muted small">Tap a month to see, edit or add its entries.</p>`);

  const list = d.mine.filter(P.test).sort(byNewest);
  html += section(`Entries · ${esc(P.label)}`, list.map(entryItem).join('') || '<p class="muted">No entries for this period.</p>');

  const stYears = years.filter(v => v <= cy);
  html += section('Year-End Statement', `<div class="form"><div class="row2">
      <label>Year<select id="ysy">${stYears.map(v => `<option ${v === (cy - (new Date().getMonth() < 2 ? 1 : 0)) ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label>&nbsp;<button class="btn" id="ysb" type="button">View my statement</button></label></div>
      <p class="muted small" style="margin:0">A printable summary of your volunteer service for the year, for your tax records. You can print it or save it as a PDF.</p></div>`);

  main(html);
  $('sp').onchange = ev => { S.period = ev.target.value; S.openMonth = null; render(); };
  document.querySelectorAll('tr.click[data-ym]').forEach(r => {
    const go = () => { S.openMonth = S.openMonth === r.dataset.ym ? null : r.dataset.ym; render(); };
    r.onclick = go;
    r.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } };
  });
  document.querySelectorAll('.addm').forEach(b => b.onclick = () => {
    const first = b.dataset.ym + '-01';
    S.prefill = b.dataset.ym === todayStr().slice(0, 7) ? todayStr() : first;
    S.tab = 'log'; buildTabs(); render(); window.scrollTo(0, 0);
  });
  document.querySelectorAll('.del').forEach(b => b.onclick = () => delEntry(b.dataset.id));
  document.querySelectorAll('.edt').forEach(b => b.onclick = () => {
    S.edit = d.mine.find(x => x.id === b.dataset.id);
    S.tab = 'edit'; buildTabs(); render(); window.scrollTo(0, 0);
  });
  $('ysb').onclick = () => openYearEnd(+$('ysy').value, d.me.unit);
}

function entryItem(e) {
  const legacy = e.source !== 'App';
  const pc = (S.d.myPhotos || {})[e.id];
  const title = legacy ? `Monthly report · ${fmtMonth(e.date)}` : `${esc(e.type)}${e.mission ? ' · ' + esc(e.mission) : ''}`;
  const lock = !legacy && e.mission && isLockedName(e.mission);
  return `<div class="entry"><div><div class="what">${title}${lock ? '<span class="tag lock">🔒 Locked</span>' : ''}${e.exclude ? '<span class="tag bad">excluded</span>' : ''}${pc ? `<span class="tag">📷 ${pc}</span>` : ''}</div>
      <div class="meta">${legacy ? 'Submitted ' + esc(e.logged.slice(0, 10)) : esc(fmtDate(e.date))}${e.notes ? ` · <button class="nt" type="button" data-id="${esc(e.id)}">Notes</button>` : ''}</div></div>
      <div class="nums">${legacy ? n1(e.f) + ' fn · ' : ''}${n1(e.h)} hr · ${n1(e.mi)} mi

document.addEventListener('click', ev => {

(function () {
  const st = document.createElement('style');

  .nt { background: none; border: 0; padding: 0; font: inherit; color: var(--navy2); font-weight: 600; text-decoration: underline; cursor: pointer; }
  .entry .meta { overflow-wrap: anywhere; }

  .nbox { background: #fff; border-radius: 12px; width: 100%; max-width: 460px; max-height: 80vh; overflow: auto; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }

  .ntext { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.45; margin-bottom: 14px; }`;
  document.head.appendChild(st);

async function delEntry(id) {
  if (!confirm('Delete this entry? Any photos you added stay in the mission folder.')) return;

/* ---------------- Team ---------------- */

function renderTeam() {
  const d = S.d, cy = new Date().getFullYear();
  const years = [...new Set(d.team.map(t => +t.ym.slice(0, 4)).concat(cy))].sort((a, b) => b - a);
  const y = S.teamYear || cy;
  const items = d.team.filter(t => +t.ym.slice(0, 4) === y);
  const tot = sum(items);
  const tfOf = list => list.reduce((a, t) => a + (t.tf != null ? t.tf : t.f || 0), 0);
  const members = new Set(items.flatMap(t => t.units)).size;
  let html = section(y === cy ? 'Team · Year to Date' : `Team · ${y}`,
    teamTiles(tot, tfOf(items), tile('Members reporting', members)) +
    '<p class="muted small" style="margin:10px 0 0">Functions count each mission or event once per day it was worked. Member turnouts count every member who took part.</p>',
    yearSelect('ty', years, y));

  const mlabel = { tf: 'Functions', h: 'Hours', mi: 'Miles' };
  if (!mlabel[S.teamMetric]) S.teamMetric = 'tf';
  const seg = `<div class="seg">${Object.keys(mlabel).map(k => `<button data-m="${k}" class="${S.teamMetric === k ? 'on' : ''}">${mlabel[k]}</button>`).join('')}</div>`;
  html += section(`${mlabel[S.teamMetric]} by Month`, `<div class="chartbox"><canvas id="tc"></canvas></div>`, seg);

  const byType = {};
  items.forEach(t => { const b = byType[t.type] || (byType[t.type] = []); b.push(t); });
  const order = d.types.concat(['Monthly report']);
  const rows = Object.keys(byType).sort((a, b) => order.indexOf(a) - order.indexOf(b)).map(k => {
    const t = sum(byType[k]);
    return `<tr><td>${esc(k)}</td><td>${n1(tfOf(byType[k]))}</td><td>${n1(t.f)}</td><td>${n1(t.h)}</td><td>${n1(t.mi)}</td><td>${money(t.v)}</td></tr>`;
  }).join('');
  html += section('By Type', rows
    ? `<div class="tblwrap"><table><tr><th>Type</th><th>Functions</th><th>Turnouts</th><th>Hours</th><th>Miles</th><th>Value</th></tr>${rows}</table></div>
       <p class="muted small">"Monthly report" is activity from the old monthly form.</p>`
    : '<p class="muted">No activity yet.</p>');

  main(html);
  $('ty').onchange = ev => { S.teamYear = +ev.target.value; render(); };

  const series = yr => MONTHS.map((_, m) => {
    const list = d.team.filter(t => t.ym === ym(yr, m));

  });
  if (window.Chart) {
    S.chart = new Chart($('tc'), {

        { label: String(y - 1), data: series(y - 1), backgroundColor: '#a9c7b5' },
        { label: String(y), data: series(y), backgroundColor: '#1e4d36' }
      ] },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } },
        scales: { y: { beginAtZero: true, title: { display: true, text: mlabel[S.teamMetric] } } } }
    });
  }
}

/* ---------------- Missions (everyone; Commander tools for admins) ---------------- */

function similarGroups(list) {
  const names = list.map(m => m.name);
  const parent = names.map((_, i) => i);
  const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
  for (let i = 0; i < names.length; i++) for (let j = i + 1; j < names.length; j++)
    if (similarName(names[i], names[j])) parent[find(i)] = find(j);
  const groups = {};
  list.forEach((m, i) => { (groups[find(i)] = groups[find(i)] || []).push(m); });
  return Object.values(groups).filter(g => g.length > 1);
}

/** Fills in photo previews on the open mission card (fetched from the server once, then remembered). */
async function loadThumbs() {
  S.thumbs = S.thumbs || {};
  const imgs = [].slice.call(document.querySelectorAll('img[data-fid]'));
  const need = imgs.map(i => i.dataset.fid).filter(id => !(id in S.thumbs));
  if (need.length) {
    try {
      const got = await run('apiPhotoThumbs', S.creds, need);
      need.forEach(id => { S.thumbs[id] = got[id] || ''; });
    } catch (e) { return; }
  }
  imgs.forEach(i => {
    const src = S.thumbs[i.dataset.fid];
    if (src) i.src = src; else i.title = 'Preview not available. Tap to open in Google Drive.';
  });
}

/** Pop-up for merging a mission into another one, or renaming it (Commander tools). */
function missionDialog(m, mode) {
  const old = $('npop'); if (old) old.remove();
  const others = S.d.missionList.filter(x => x.name !== m.name);
  const label = x => x.status === 'Ongoing' ? x.name + ' · Ongoing' : (x.last ? fmtDate(x.last) + ' · ' : '') + x.name;
  const facts = [m.status === 'Ongoing' ? 'Ongoing' : m.last ? fmtDate(m.last) : '',
    m.members ? `${m.members} member${m.members === 1 ? '' : 's'} · ${n1(m.h)} hr` : 'No time logged yet'].filter(Boolean).join(' · ');
  const body = mode === 'merge'
    ? `<p style="margin:0 0 12px;font-size:16px">Every entry, note and photo moves into the mission you pick. “${esc(m.name)}” is then removed.</p>
       <label>Merge into<select id="mdsel"><option value="">Pick the mission to keep…</option>
         ${others.map(x => `<option value="${esc(x.name)}" data-n="${esc(x.name)}" data-s="${esc(x.status === 'Ongoing' ? 'Ongoing' : x.last ? fmtDate(x.last) : '')}">${esc(label(x))}</option>`).join('')}</select></label>`
    : `<p style="margin:0 0 12px;font-size:16px">Changes the name everywhere: every entry, the Log list and the photo folder.</p>
       <label>New name<textarea id="mdname" class="grow1" rows="1" maxlength="80">${esc(m.name.toUpperCase())}</textarea></label>`;
  document.body.insertAdjacentHTML('beforeend', `<div id="npop" class="npop" role="dialog" aria-modal="true" aria-labelledby="mdt">
    <div class="nbox form"><div class="nhead"><div><div id="mdt" class="what">${mode === 'merge' ? 'Merge mission' : 'Rename mission'}</div>
      <div class="meta">${esc(m.name)}${facts ? ' · ' + esc(facts) : ''}</div></div>
      <button class="nclose" type="button" aria-label="Close">✕</button></div>
    ${body}
    <div class="btnrow" style="gap:10px"><button class="btn mdgo" type="button" style="min-width:0;padding:13px 26px">${mode === 'merge' ? 'Merge' : 'Save'}</button>
      <button class="btn ghost mdcancel" type="button" style="min-width:0;padding:13px 22px">Cancel</button></div></div></div>`);
  const pop = $('npop'), back = document.activeElement;
  const close = () => { pop.remove(); document.removeEventListener('keydown', key); if (back && back.focus) back.focus(); };
  const key = ev => { if (ev.key === 'Escape') close(); };
  document.addEventListener('keydown', key);
  pop.onclick = ev => { if (ev.target === pop) close(); };
  pop.querySelector('.nclose').onclick = close;
  pop.querySelector('.mdcancel').onclick = close;
  if ($('mdname')) { capsInput($('mdname')); growBox($('mdname')); }
  if (mode === 'merge') { bigSelect('mdsel', 'Merge into'); $('mdsel_b').focus(); } else $('mdname').focus();
  pop.querySelector('.mdgo').onclick = async () => {
    const to = mode === 'merge' ? $('mdsel').value : $('mdname').value.trim();
    if (!to) { toast(mode === 'merge' ? 'Pick the mission to keep.' : 'Enter a name.', true); return; }
    if (to === m.name) { close(); return; }
    const btn = pop.querySelector('.mdgo'); btn.disabled = true;
    try {
      S.openMission = mode === 'merge' ? null : to;
      setData(await run('apiMergeMissions', S.creds, [m.name], to));
      close(); toast(mode === 'merge' ? 'Merged into “' + to + '”.' : 'Renamed.');
    } catch (e) { btn.disabled = false; toast(clean(e), true); }
  };
}

const MAP_PLACEHOLDER = '(map link added when the map is ready)';
function mapLink(id) { return id ? 'https:\/\/caltopo.com/m/' + String(id).split('/').map(encodeURIComponent).join('/') : ''; }
function isLockedName(n) { const k = String(n || '').toLowerCase(); return (S.d.locked || []).some(x => x.toLowerCase() === k); }
function lockedWhen(t) {
  const m = /^(\d{4}-\d{2}-\d{2})\s+(\d{1,2}):(\d{2})\s+by\s+(.*)$/.exec(String(t || ''));
  if (!m) return esc(t);
  const h = +m[2], ap = h < 12 ? 'AM' : 'PM';
  return esc(fmtDate(m[1]) + ' ' + ((h % 12) || 12) + ':' + m[3] + ' ' + ap + ' by ' + m[4]);
}
function fmtRange(a, b) {
  if (!a) return '';
  if (!b || a === b) return fmtDate(a);
  const pa = a.split('-'), pb = b.split('-');
  if (pa[0] === pb[0] && pa[1] === pb[1]) return MONTHS[+pa[1] - 1] + ' ' + (+pa[2]) + '–' + (+pb[2]) + ', ' + pa[0];
  return fmtDate(a) + ' – ' + fmtDate(b);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Link copied.'); }
  catch (e) { window.prompt('Copy this link:', t); }
}
/** Admins: how long a mission's banner shows (Missions tab). */
function bannerControl(m) {
  const info = ((S.d.duty || {}).missionAdmin || []).find(x => x.name === m.name);
  if (!info) return '';
  const v = info.banner === 'Keep' ? 'keep' : info.banner === 'Cleared' ? 'clear' : 'auto';
  return `<label>Active-mission banner <span class="muted small">${info.active ? '(showing now)' : '(not showing)'}</span><select class="mbn">
    <option value="auto" ${v === 'auto' ? 'selected' : ''}>Automatic: until 48 hours after the last activity</option>
    <option value="keep" ${v === 'keep' ? 'selected' : ''}>Keep showing until the mission is closed</option>
    <option value="clear" ${v === 'clear' ? 'selected' : ''}>Hide the banner now</option></select></label>`;
}
function missionEmoji(type) { return { Callout: '🚨', Training: '📘', 'Event / Parade': '📣' }[type] || '📌'; }

/** Bold-looking text for GroupMe headings (GroupMe has no bold, so this uses Unicode bold letters). Headings only. */
function gmBold(t) {
  return String(t).replace(/[A-Za-z0-9]/g, ch => {
    const c = ch.charCodeAt(0);
    const cp = c >= 65 && c <= 90 ? 0x1D5D4 + c - 65 : c >= 97 && c <= 122 ? 0x1D5EE + c - 97 : 0x1D7EC + c - 48;
    return String.fromCodePoint(cp);
  });
}

/** Default GroupMe message for a new mission (the admin can edit it before it goes out). Sections are separated by a blank line. */
function alertMessage(f) {
  const sec = [];
  sec.push([missionEmoji(f.type) + ' ' + gmBold(String(f.type || '').toUpperCase()), f.name || '(mission name)', f.date ? fmtDate(f.date) : ''].filter(Boolean).join('\n'));
  if (f.location) sec.push(gmBold('Incident Location') + '\n' + f.location);
  if (f.staging) sec.push(gmBold('Staging Point') + '\n' + f.staging);
  if (f.primary || f.backup) sec.push([gmBold('Comms Plan'), f.primary ? 'Primary Ch: ' + f.primary : '', f.backup ? 'Backup Ch: ' + f.backup : ''].filter(Boolean).join('\n'));
  if (f.extra) sec.push(gmBold('Details') + '\n' + f.extra);
  if (f.map) sec.push(gmBold('Map') + '\n' + MAP_PLACEHOLDER + '\nOr in CalTopo: ' + ((S.d.posse && S.d.posse.short) || 'Posse') + ' Data › ' + (f.name || '(mission name)'));
  sec.push('Details and map: open the Duty Log app.');
  return sec.join('\n\n');
}

/** A Primary / Backup channel dropdown: the shared list grouped by band, the mission's own channel if it isn't listed, and "Other…". */
function channelSelect(id, value, allowBlank) {
  const list = (S.d.comms && S.d.comms.channels) || [];
  const band = c => /\(700\)\s*$/.test(c) ? '700 MHz' : /\(VHF\)\s*$/.test(c) ? 'VHF' : 'Other channels';
  const groups = {};
  list.forEach(c => { (groups[band(c)] = groups[band(c)] || []).push(c); });
  const v = String(value || '');
  const custom = v && list.indexOf(v) < 0 ? `<option value="${esc(v)}" selected>${esc(v)}</option>` : '';
  return `<select id="${id}">${allowBlank || !v ? `<option value="" ${v ? '' : 'selected'}>${allowBlank ? '— None —' : '— Pick a channel —'}</option>` : ''}${custom}
    ${['700 MHz', 'VHF', 'Other channels'].filter(g => groups[g]).map(g => `<optgroup label="${g}">${groups[g].map(c => `<option value="${esc(c)}" ${c === v ? 'selected' : ''}>${esc(c)}</option>`).join('')}</optgroup>`).join('')}
    <option value="__other">Other…</option></select>`;
}
function channelValue(selId, otherId) {
  const s = $(selId); if (!s) return '';
  return s.value === '__other' ? $(otherId).value.trim() : s.value;
}
function hookChannel(selId, otherId, after) {
  const s = $(selId); if (!s) return;
  s.addEventListener('change', () => {
    const o = s.value === '__other';
    $(otherId).classList.toggle('hidden', !o);
    if (o) $(otherId).focus();
    if (after) after();
  });
}

/* ---------------- Pick the Staging Point on a map ---------------- */

const MAP_HOME = [39.05, -112.6]; /* Millard County */
function loadCss(href) {
  return new Promise(res => {
    if ([].some.call(document.querySelectorAll('link[rel=stylesheet]'), l => l.href === href)) return res();
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; l.onload = res; l.onerror = res;
    document.head.appendChild(l);
  });
}
function parsePoint(s) {
  const m = /^\s*(-?\d{1,2}(?:\.\d+)?)\s*[, ]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/.exec(String(s || ''));
  return m ? [+m[1], +m[2]] : null;
}
function fmtPoint(lat, lon) { return lat.toFixed(5) + ', ' + lon.toFixed(5); }

/** Full-screen topo map: search a place, use my location, tap to drop the pin, then "Use this point". */
async function openPicker(current, place, done, opts) {
  opts = opts || {};
  const old = $('mpicker'); if (old) old.remove();
  document.body.insertAdjacentHTML('beforeend', `<div id="mpicker" class="mpicker" role="dialog" aria-modal="true" aria-label="Pick the Staging Point">
    <form class="pkbar" id="pkf"><input id="pkq" placeholder="Search a place" value="${esc(place || '')}" autocomplete="off">
      <button class="btn small" type="submit" style="background:#fff;color:var(--navy)">Find</button>
      <button class="pkx" type="button" aria-label="Close">✕</button></form>
    <div class="pkmap" id="pkmap"><div class="pkload" id="pkload">Loading the map…</div>
      <button class="pkme" type="button" id="pkme">📍 My location</button>
      <div class="pklay" id="pklay"><button type="button" data-l="topo">Topo</button><button type="button" data-l="aerial">Aerial</button></div></div>
    <div class="pkfoot"><div class="muted small">${esc(opts.hint || 'Tap the map to place the Staging Point')}${(S.d.places || []).length ? ', or tap a ★ saved place' : ''}</div>
      <div class="pkpt" id="pkpt">No point yet</div>
      <label class="pkname">Name this spot (optional)<input id="pkn" maxlength="60" autocomplete="off" placeholder="e.g. Cemetery" value="${esc(opts.name || '')}" ${opts.lockName ? 'readonly' : ''}></label>
      <label class="pksave hidden" id="pksvw"><input type="checkbox" id="pksv"> <span id="pksvl"></span></label>
      <div class="btnrow"><button class="btn" type="button" id="pkuse" disabled style="flex:1;width:auto">Use this point</button>
        <button class="btn ghost" type="button" id="pkcancel" style="width:auto">Cancel</button></div></div></div>`);
  const y0 = window.scrollY;
  document.body.style.overflow = 'hidden';
  const close = () => {
    const v = $('mpicker'); if (v) v.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', key);
    /* Back to the same spot on the form, with the box that was just filled in view */
    window.scrollTo(0, y0);
    if (opts.input) setTimeout(() => { window.scrollTo(0, y0); const r = opts.input.getBoundingClientRect(); if (r.top < 80 || r.bottom > window.innerHeight - 40) opts.input.scrollIntoView({ block: 'center' }); }, 60);
  };
  const key = ev => { if (ev.key === 'Escape') close(); };
  document.addEventListener('keydown', key);
  $('mpicker').querySelector('.pkx').onclick = close;
  $('pkcancel').onclick = close;
  try {
    await loadCss('https:\/\/cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css');
    if (!window.L) await loadScript('https:\/\/cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js');
  } catch (e) { $('pkload').textContent = "Couldn't load the map. Type the coordinates instead."; return; }
  if (!$('mpicker')) return;
  $('pkload').remove();
  const start = parsePoint(current);
  const map = L.map('pkmap', { zoomControl: true }).setView(start || MAP_HOME, start ? 14 : 9);
  /* Topo or aerial photos, switchable at any zoom (the choice is remembered on this phone) */
  const layers = {
    topo: L.tileLayer('https:\/\/basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}',
      { maxNativeZoom: 16, maxZoom: 19, attribution: 'USGS The National Map' }),
    aerial: L.tileLayer('https:\/\/server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 19, attribution: 'Esri imagery' })
  };
  let cur = null;
  const useLayer = k => {
    if (!layers[k]) k = 'topo';
    if (cur) map.removeLayer(layers[cur]);
    layers[k].addTo(map); cur = k;
    $('pklay').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.l === k));
    try { localStorage.setItem('pkLayer', k); } catch (e) {}
  };
  let pref = 'topo'; try { pref = localStorage.getItem('pkLayer') || 'topo'; } catch (e) {}
  useLayer(pref);
  $('pklay').querySelectorAll('button').forEach(b => b.onclick = () => useLayer(b.dataset.l));
  L.DomEvent.disableClickPropagation($('pkme'));
  L.DomEvent.disableClickPropagation($('pklay'));
  let pin = null, pt = null;
  const place2 = (lat, lon, zoom) => {
    pt = fmtPoint(lat, lon);
    if (pin) pin.setLatLng([lat, lon]); else pin = L.marker([lat, lon], { draggable: true }).addTo(map).on('dragend', ev => { const ll = ev.target.getLatLng(); place2(ll.lat, ll.lng); });
    if (zoom) map.setView([lat, lon], zoom);
    $('pkpt').textContent = pt; $('pkuse').disabled = false;
  };
  if (start) place2(start[0], start[1]);
  map.on('click', ev => place2(ev.latlng.lat, ev.latlng.lng));
  /* "Save as a known place" shows once the spot has a name: checked for a new name, unchecked for one already saved */
  let saveMode = '';
  const updSave = () => {
    const n = $('pkn').value.trim(), kp = knownPlace(n);
    $('pksvw').classList.toggle('hidden', !n);
    if (!n) return;
    const mode = kp ? 'known:' + kp.name : 'new';
    $('pksvl').textContent = kp ? 'Update the saved spot for “' + kp.name + '”' : 'Save “' + n + '” as a known place';
    if (mode !== saveMode) { $('pksv').checked = opts.saveChecked != null ? opts.saveChecked : !kp; saveMode = mode; }
  };
  $('pkn').addEventListener('input', updSave);
  updSave();
  /* Saved places as ★ pins: tap one to use that spot and its name */
  (S.d.places || []).forEach(p => {
    const pp = parsePoint(p.point); if (!pp) return;
    L.marker(pp, { icon: L.divIcon({ className: 'kpin', html: '<b>★</b><span>' + esc(p.name) + '</span>', iconSize: null }) })
      .addTo(map).on('click', () => { place2(pp[0], pp[1]); $('pkn').value = p.name; updSave(); });
  });
  $('pkuse').onclick = async () => {
    if (!pt) return;
    const n = $('pkn').value.trim();
    if (n && $('pksv').checked) {
      $('pkuse').disabled = true;
      try {
        const kp = knownPlace(n);
        const r = await run('apiSavePlace', S.creds, { name: n, oldName: kp ? kp.name : undefined, point: pt });
        S.d.places = r.places; cacheData();
        toast('Saved “' + n + '”.');
        done(n, pt, true); close();
      } catch (e) { $('pkuse').disabled = false; toast(clean(e), true); }
      return;
    }
    done(n, pt, false); close();
  };
  $('pkme').onclick = () => {
    if (!navigator.geolocation) { toast("This device can't share its location.", true); return; }
    navigator.geolocation.getCurrentPosition(p => place2(p.coords.latitude, p.coords.longitude, 15),
      () => toast("Couldn't get your location.", true), { enableHighAccuracy: true, timeout: 15000 });
  };
  const find = async q => {
    const pp = parsePoint(q);
    if (pp) { place2(pp[0], pp[1], 14); return; }
    try { const r = await run('apiGeocode', S.creds, q); map.setView([r.lat, r.lon], 13); toast('Now tap the exact spot.'); }
    catch (e) { toast(clean(e), true); }
  };
  $('pkf').onsubmit = ev => { ev.preventDefault(); const q = $('pkq').value.trim(); if (q) find(q); };
  if (!start && place) find(place);
  setTimeout(() => map.invalidateSize(), 200);
}

/* ---------------- Known places (admins; each posse keeps its own list) ---------------- */

function placeList() { return ''; } /* the shared <datalist id="kpl"> is added by refreshPlaceList() */
function knownPlace(name) {
  const k = String(name || '').trim().toLowerCase();
  return (S.d.places || []).find(p => p.name.toLowerCase() === k) || null;
}
/** Keeps one <datalist id="kpl"> of this posse's known places on the page (suggestions for the Staging Point boxes). */
function refreshPlaceList() {
  const old = $('kpl'); if (old) old.remove();
  document.body.insertAdjacentHTML('beforeend', `<datalist id="kpl">${(S.d.places || []).map(p => `<option value="${esc(p.name)}">${esc(p.point)}</option>`).join('')}</datalist>`);
}
/** "Cemetery (38.97012, -112.30455)" -> { name: 'Cemetery', pt: '38.97012, -112.30455' }; coordinates or a name alone also work. */
function splitPlace(v) {
  const s = String(v || '').trim();
  const m = /^(.*?)\s*\(\s*(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)\s*\)\s*$/.exec(s);
  if (m) return { name: m[1].trim(), pt: fmtPoint(+m[2], +m[3]) };
  const p = parsePoint(s);
  return p ? { name: '', pt: fmtPoint(p[0], p[1]) } : { name: s, pt: '' };
}
/** What a place box sends: a saved place's name gets its coordinates added, e.g. "Posse Shed (38.79912, -112.43301)". */
function placeValue(input) {
  const v = input.value.trim(), sp = splitPlace(v), kp = !sp.pt && knownPlace(sp.name);
  return kp ? kp.name + ' (' + kp.point + ')' : v;
}
/**
 * "Pick on map" for an Incident Location or Staging Point box. Opens at the spot already in the box (or a saved place,
 * or searches the typed name). The spot can be named; the box then holds "Name (lat, lon)".
 */
function pickStaging(input, near, after, hint) {
  const sp = splitPlace(input.value), kp = !sp.pt && knownPlace(sp.name);
  const pt = sp.pt || (kp ? kp.point : '');
  openPicker(pt, pt ? '' : (sp.name || near), (name, p) => {
    setBox(input, name ? name + ' (' + p + ')' : p);
    input.dispatchEvent(new Event('input', { bubbles: true }));
    refreshPlaceList(); if (after) after();
  }, { hint: hint, name: kp ? kp.name : sp.name, input: input });
}

/** ★ Saved: the posse's saved places in a list; tapping one fills the box with "Name (lat, lon)". */
function openSaved(input, after) {
  const old = $('svsheet'); if (old) old.remove();
  const list = S.d.places || [];
  document.body.insertAdjacentHTML('beforeend', `<div id="svsheet" class="svsheet" role="dialog" aria-modal="true" aria-label="Saved places">
    <div class="svdim"></div><div class="svbox"><h4>Saved places · ${esc((S.d.posse || {}).short || '')}</h4>
      ${list.length ? list.map((p, k) => `<button type="button" class="svit" data-k="${k}"><b>${esc(p.name)}</b><small>${esc(p.point)}</small></button>`).join('')
        : '<p class="muted">No saved places yet. Save one from Pick on map (name the spot and keep “Save as a known place” checked), or under Settings › Known places.</p>'}
      <button type="button" class="btn ghost svcancel" style="margin-top:10px">Cancel</button>
      <p class="muted small" style="margin:8px 0 0">Edit or delete saved places in Settings › Known places.</p></div></div>`);
  const close = () => { const v = $('svsheet'); if (v) v.remove(); };
  $('svsheet').querySelector('.svdim').onclick = close;
  $('svsheet').querySelector('.svcancel').onclick = close;
  $('svsheet').querySelectorAll('.svit').forEach(b => b.onclick = () => {

    setBox(input, p.name + ' (' + p.point + ')');
    input.dispatchEvent(new Event('input', { bubbles: true }));
    close(); if (after) after();
  });
}

function hookAddMission() {
  const d = S.d, c = d.conn || {};
  const st = { mapTouched: false, postTouched: false, msgEdited: false };
  const fields = () => ({ name: $('mn').value.trim(), date: $('mong').checked ? '' : $('md').value, type: $('mt').value,
    location: placeValue($('mloc')), map: $('mmap').checked, staging: placeValue($('mstg')),
    primary: channelValue('mpri', 'mprio'), backup: channelValue('mbak', 'mbako'), extra: $('mxtra').value.trim() });
  const sync = () => {
    const def = (d.mapTypes || []).indexOf($('mt').value) >= 0 && !$('mong').checked;
    if (!st.mapTouched) $('mmap').checked = !!c.caltopo && def;
    if (!st.postTouched) $('mpost').checked = !!c.groupme && def;
    $('mmsg').classList.toggle('hidden', !$('mpost').checked);
    if (!st.msgEdited) $('mmsg').value = alertMessage(fields());
  };
  capsInput($('mn')); ['mn', 'mloc', 'mstg'].forEach(id => growBox($(id)));
  ['mn', 'md', 'mloc', 'mstg', 'mprio', 'mbako', 'mxtra'].forEach(id => $(id).addEventListener('input', sync));
  $('mlsv').onclick = () => openSaved($('mloc'), sync);
  $('mssv').onclick = () => openSaved($('mstg'), sync);
  hookChannel('mpri', 'mprio', sync); hookChannel('mbak', 'mbako', sync);
  $('mpick').onclick = () => pickStaging($('mstg'), splitPlace(placeValue($('mloc'))).pt || $('mloc').value.trim(), sync);
  $('mt').addEventListener('change', sync);
  $('mmap').addEventListener('change', () => { st.mapTouched = true; sync(); });
  $('mpost').addEventListener('change', () => { st.postTouched = true; sync(); });
  $('mmsg').addEventListener('input', () => { st.msgEdited = true; });
  $('mong').onchange = () => {
    const on = $('mong').checked;
    $('mdw').classList.toggle('hidden', on); $('md').required = !on;
    if (on && $('mt').value === 'Callout') $('mt').value = 'Maintenance';
    sync();
  };
  $('mclr').onclick = () => {
    if (($('mn').value.trim() || $('mloc').value.trim() || $('mstg').value.trim() || $('mnotes').value.trim() || $('mxtra').value.trim()) && !confirm('Clear the form and start over?')) return;
    clearTimeout(st.dt); draftClear('mission'); S.missionRid = null;
    const y = window.scrollY; render(); window.scrollTo(0, y);
    if ($('mn')) $('mn').focus();
  };
  $('mgeo').onclick = () => pickStaging($('mloc'), '', sync, 'Tap the map to place the Incident Location');
  $('mloc').addEventListener('change', sync); $('mstg').addEventListener('change', sync);
  /* Keep what the admin is typing on the phone until the mission is added (weak signal, app closed, phone died) */
  const D_IDS = ['mn', 'md', 'mt', 'mloc', 'mstg', 'mcase', 'mpri', 'mprio', 'mbak', 'mbako', 'mxtra', 'mnotes', 'mmsg'];
  const D_CHK = ['mjoint', 'mong', 'mmap', 'mpost'];
  const dr = draftLoad('mission');
  if (dr && (dr.mn || dr.mloc || dr.mstg || dr.mnotes || dr.mxtra)) {
    D_IDS.forEach(id => {
      if (dr[id] == null || !$(id)) return;
      const el = $(id);
      if (el.tagName === 'SELECT' && ![].some.call(el.options, o => o.value === dr[id])) el.insertAdjacentHTML('afterbegin', `<option value="${esc(dr[id])}">${esc(dr[id])}</option>`);
      el.value = dr[id]; if (el.fit) el.fit();
    });
    D_CHK.forEach(id => { if (dr[id] != null && $(id) && !$(id).disabled) $(id).checked = !!dr[id]; });
    ['mpri', 'mbak'].forEach(id => $(id + 'o').classList.toggle('hidden', $(id).value !== '__other'));
    $('mdw').classList.toggle('hidden', $('mong').checked);
    Object.assign(st, dr._st || {});
    toast('Restored what you were typing. Tap Clear to start over.', false, 4000);
  }
  const keep = () => { clearTimeout(st.dt); st.dt = setTimeout(() => {
    const o = { _st: { mapTouched: st.mapTouched, postTouched: st.postTouched, msgEdited: st.msgEdited } };
    D_IDS.forEach(id => { o[id] = $(id) ? $(id).value : ''; }); D_CHK.forEach(id => { o[id] = $(id) ? $(id).checked : false; });
    draftSave('mission', o);
  }, 300); };
  $('mf').addEventListener('input', keep); $('mf').addEventListener('change', keep);
  sync();
  $('mf').onsubmit = async ev => {
    ev.preventDefault();
    const f = fields();
    const post = $('mpost').checked, msg = $('mmsg').value.trim();
    if (post && !msg) { toast('Write the GroupMe message, or uncheck Post to GroupMe.', true); return; }
    $('mb').disabled = true; $('mb').textContent = f.map || post ? 'Adding (and setting up the map and post)…' : 'Adding…';
    S.missionRid = S.missionRid || newRid();
    try {
      const r = await run('apiAddMission', S.creds, { name: f.name, date: $('md').value, type: f.type, notes: $('mnotes').value,
        ongoing: $('mong').checked, joint: $('mjoint').checked, location: f.location, caseNo: $('mcase').value.trim(),
        staging: f.staging, primary: f.primary, backup: f.backup, details: f.extra,
        makeMap: f.map, post: post, message: post ? msg : '', rid: S.missionRid });
      clearTimeout(st.dt); draftClear('mission'); S.missionRid = null;
      if (r && r.results) {
        S.addResult = { name: r.name, results: r.results, message: msg, wantMap: f.map, wantPost: post };
        setData(r.data); window.scrollTo(0, 0);
      } else { setData(r); toast('Mission added.'); }
    } catch (e) { $('mb').disabled = false; $('mb').textContent = 'Add mission'; toast(clean(e), true); }
  };
}

/** After Add mission with a map or GroupMe post: what happened, with Try again for a step that failed. */
function addResultPanel() {
  const A = S.addResult; if (!A) return '';
  const m = S.d.missionList.find(x => x.name === A.name) || {};
  const r = A.results || {};
  const line = (ok, text, err, retry) => `<div><span class="${ok ? 'ck' : 'xk'}">${ok ? '✓' : '!'}</span>${text}${err ? `<div class="muted small">${esc(err)}</div>` : ''}${retry ? ` <button class="btn small ghost" type="button" id="${retry}">Try again</button>` : ''}</div>`;
  let rows = line(true, "Mission added. It's on everyone's Log list.");
  if (A.wantMap) rows += r.map && r.map.ok ? line(true, 'CalTopo map created' + (S.d.conn && S.d.conn.ctFolder ? ' in ' + esc(S.d.conn.ctFolder) : ''))
    : line(false, "The CalTopo map wasn't created.", r.map && r.map.error, 'rrmap');
  if (A.wantPost) rows += r.post && r.post.ok ? line(true, 'Posted to GroupMe') : line(false, "The GroupMe post didn't go out.", r.post && r.post.error, 'rrpost');
  const url = mapLink(m.mapId);
  return section(esc(A.name), `<div class="prog">${rows}</div>
    ${url ? `<a class="mapbtn" href="${url}" target="_blank" rel="noopener">🗺 Open CalTopo map</a>` : ''}
    <div class="btnrow" style="margin-top:10px">${url ? '<button class="btn small ghost" type="button" id="rrcopy">Copy map link</button>' : ''}
      <button class="btn small ghost" type="button" id="rropen">Open mission</button>
      <button class="btn small ghost" type="button" id="rrclose">Close</button></div>`);
}

function hookAddResult() {
  const A = S.addResult; if (!A || !$('rropen')) return;
  const m = S.d.missionList.find(x => x.name === A.name) || {};
  $('rropen').onclick = () => { S.openMission = A.name; S.addResult = null; render(); };
  $('rrclose').onclick = () => { S.addResult = null; render(); };
  if ($('rrcopy')) $('rrcopy').onclick = () => copyText(mapLink(m.mapId));
  if ($('rrmap')) $('rrmap').onclick = async () => {
    $('rrmap').disabled = true;
    try { const r = await run('apiCreateMap', S.creds, A.name); A.results.map = { ok: true, url: r.url }; setData(r.data); }
    catch (e) { A.results.map = { ok: false, error: clean(e) }; render(); }
  };
  if ($('rrpost')) $('rrpost').onclick = async () => {
    $('rrpost').disabled = true;
    try { await run('apiPostGroupMe', S.creds, A.message, A.name); A.results.post = { ok: true }; render(); }
    catch (e) { A.results.post = { ok: false, error: clean(e) }; render(); }
  };
}

function renderMissions() {
  const d = S.d, admin = d.me.admin, conn = d.conn || {};
  const list = d.missionList.filter(m => S.mFilter === 'all' || m.type === S.mFilter);
  const filter = `<select id="mfil" class="mini" aria-label="Filter by type">${typeOptions(S.mFilter, true)}</select>`;
  let html = addResultPanel();

  if (admin) {
    html += addMissionForm();
    const sims = similarGroups(d.missionList);
    S.sims = sims;
    if (sims.length) {
      html += section('Similar Mission Names', `<p class="muted small" style="margin-top:0">These names look alike. Pick the one to keep and merge: every entry, note and photo moves to that name. Leave a group alone if they really are different missions.</p>` +
        sims.map((g, gi) => {
          g.sort((a, b) => (b.planned - a.planned) || b.members - a.members);
          return `<div class="grp"><h4>Possible duplicates</h4>
            ${g.map((m, i) => `<label class="r"><input type="radio" name="sg${gi}" value="${esc(m.name)}" ${i === 0 ? 'checked' : ''}>
              <span class="t">${esc(m.name)} <span class="muted small">· ${m.members} member${m.members === 1 ? '' : 's'}${m.planned ? ' · on your list' : ''}</span></span></label>`).join('')}
