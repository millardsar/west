        }).join(''));
    }
  }

  const me = d.posse ? d.posse.short : 'This posse';
  const cards = list.map((m, i) => {
    const open = S.openMission === m.name;
    const og = m.status === 'Ongoing';
    const locked = !!m.locked;
    const edit = admin && !locked;
    const dates = og ? (m.last ? 'Last logged ' + fmtDate(m.last) : '')
      : !m.first ? '' : m.first === m.last ? fmtDate(m.first) : fmtDate(m.first) + ' – ' + fmtDate(m.last);
    const status = locked ? '<span class="tag lock">🔒 Locked</span>' : m.status === 'Open' ? '<span class="tag good">Open</span>' : og ? '<span class="tag good">Ongoing</span>'
      : m.status === 'Closed' ? '<span class="tag">Closed</span>' : '';
    const nums = m.members ? `${m.members} member${m.members === 1 ? '' : 's'} · ${n1(m.h)} hr · ${n1(m.mi)} mi` : 'No time logged yet';
    const ot = m.other || null;
    const pl = k => `${k} member${k === 1 ? '' : 's'}`;
    const jline = m.joint ? `<div class="jline"><span>${esc(me)}: <b>${pl(m.members)}</b> · ${n1(m.h)} hr</span>
      <span>${esc(ot.short)}: <b>${pl(ot.members)}</b> · ${n1(ot.h)} hr</span>
      <span>Total: <b>${pl(m.members + ot.members)}</b> · ${n1(m.h + ot.h)} hr · ${n1(m.mi + ot.mi)} mi</span></div>` : '';
    const mine = m.myH ? ` · <b>You: ${n1(m.myH)} hr</b>` : '';
    let body = '';
    if (open) {
      const whoLine = w => `${esc(w.unit)} ${esc(w.name || '')}: ${n1(w.h)} hr, ${n1(w.mi)} mi`;
      const who = (m.who || []).map(whoLine).join('<br>');
      const photos = (m.photos || []).map((p, k) => `<button type="button" class="thumb" data-pk="${k}" title="${esc(p.unit)} · ${esc(p.date)}"><img alt="Photo from ${esc(p.unit)}" data-fid="${esc(p.fileId)}" ${(S.thumbs || {})[p.fileId] ? `src="${S.thumbs[p.fileId]}"` : ''}></button>`).join('');
      const url = mapLink(m.mapId);
      const lockbar = locked ? `<div class="lockbar"><b>🔒 Locked for reporting</b>${m.reportNo ? 'Report ' + esc(m.reportNo) + ' · ' : ''}Locked ${lockedWhen(m.locked)}.
          Time, notes and expenses can't be changed. Photos can still be added.
          ${admin ? `<div class="btnrow" style="margin-top:10px">${m.reportNo ? '<button class="btn small mrdl" type="button">Download report</button>' : '<button class="btn small mrep" type="button">Create report</button>'}
            <button class="btn small ghost munlock" type="button">Unlock to edit</button></div>` : ''}</div>` : '';
      const mapPart = url ? `<a class="mapbtn" href="${url}" target="_blank" rel="noopener">🗺 Open CalTopo map</a>
          <div class="btnrow" style="margin-top:8px"><button class="btn small ghost mcopy" type="button">Copy map link</button>
          ${admin && conn.caltopo ? '<button class="btn small ghost mbak" type="button">Back up map now</button>' : ''}</div>`
        : edit && conn.caltopo ? `<button class="btn small ghost mmk" type="button">🗺 Create CalTopo map</button>` : '';
      const details = edit ? `<label>MCSO case #<input class="mcs" maxlength="40" value="${esc(m.caseNo || '')}" style="max-width:300px"></label>
          <label>Incident Location<textarea class="mlc grow1" rows="1" maxlength="200">${esc(m.location || '')}</textarea></label>
          <div class="locrow2"><button class="btn small ghost mlpk" type="button">🗺 Pick on map</button><button class="btn small ghost mlsv" type="button">★ Saved</button></div>
          <label style="margin-top:12px">Staging Point<textarea class="mst grow1" rows="1" maxlength="120">${esc(m.staging || '')}</textarea></label>
          <div class="locrow2" style="margin-bottom:12px"><button class="btn small ghost mpk" type="button">🗺 Pick on map</button><button class="btn small ghost mssv" type="button">★ Saved</button></div>
          <div class="row2">
            <label>Primary${channelSelect('cp' + i, m.primary, true)}<input id="cpo${i}" class="hidden chother" maxlength="60" placeholder="Type the channel"></label>
            <label>Backup${channelSelect('cb' + i, m.backup, true)}<input id="cbo${i}" class="hidden chother" maxlength="60" placeholder="Type the channel"></label></div>
          <label>Details for members (shows on the active-mission banner)<textarea class="mdt grow1" rows="2" maxlength="2000">${esc(m.details || '')}</textarea></label>
          ${bannerControl(m)}
          ${url ? '' : `<label>CalTopo map link<input class="mml" placeholder="Paste a link like https:\/\/caltopo.com/m/AB12C" value=""></label>`}`
        : (m.caseNo || m.location || m.staging || m.primary || m.backup || m.details ? `<div class="kvl">${m.caseNo ? `<div><span>MCSO case #</span>${esc(m.caseNo)}</div>` : ''}${m.location ? `<div><span>Incident Location</span>${esc(m.location)}</div>` : ''}
            ${m.staging ? `<div><span>Staging Point</span>${esc(m.staging)}</div>` : ''}${m.primary ? `<div><span>Primary Ch</span>${esc(m.primary)}</div>` : ''}${m.backup ? `<div><span>Backup Ch</span>${esc(m.backup)}</div>` : ''}${m.details ? `<div><span>Details</span>${esc(m.details)}</div>` : ''}</div>` : '');
      const exps = m.expenses || [];
      const etotal = exps.reduce((a, x) => a + (x.amount || 0), 0);
      const erows = exps.map((x, k) => `<tr><td>${esc(fmtDate(x.date).replace(/, \d{4}$/, ''))}</td>
          <td>${esc(x.desc)}<span class="cat">${esc(x.cat)} · paid by ${esc(x.paidBy)}${m.joint ? ' · ' + esc(x.team) : ''}${x.receipt ? ` · <button class="rcpt" type="button" data-k="${k}">🧾 Receipt</button>` : ''}</span></td>
          <td class="r">${money2(x.amount)}</td>${edit ? `<td class="r">${x.team === me ? `<button class="xdel" type="button" data-id="${esc(x.id)}" aria-label="Delete expense">✕</button>` : ''}</td>` : ''}</tr>`).join('');
      const expPart = (exps.length ? `<table class="xtbl"><col style="width:58px"><col><col style="width:84px">${edit ? '<col style="width:30px">' : ''}${erows}</table>
          <div class="xtot"><span>Expenses total</span><span>${money2(etotal)}</span></div>` : '<span class="muted">No expenses.</span>')
        + (edit ? `<div class="addx"><div class="row2"><label>Date<input type="date" class="xd" value="${esc(m.last || m.first || todayStr())}" max="${todayStr()}"></label>
            <label>Amount<input class="xa" inputmode="decimal" placeholder="$0.00"></label></div>
            <label>Category<select class="xc">${(d.expenseCats || []).map(c => `<option>${esc(c)}</option>`).join('')}</select></label>
            <label>What was it?<input class="xs" maxlength="200" placeholder="e.g. Headlamp lost on scree slope"></label>
            <label>Paid by<input class="xp" maxlength="60" value="Posse" list="xpl"></label>
            <datalist id="xpl"><option value="Posse">${d.roster.filter(r => r.name).map(r => `<option value="${esc(r.unit)}">${esc(r.name)}</option>`).join('')}</datalist>
            <div class="lbl2">Receipt (optional)<div class="btnrow" style="margin-top:4px">
              <label class="btn small ghost filebtn">📷 Take photo<input type="file" class="xr1" accept="image/*" capture="environment"></label>
              <label class="btn small ghost filebtn">🖼 Choose from photos<input type="file" class="xr2" accept="image/*"></label></div>
              <span class="xrp muted small"></span></div>
            <button class="btn small xadd" type="button">Add expense</button></div>` : '');
      body = `<div class="mbody form">${lockbar}
        ${mapPart ? `<div style="margin-bottom:6px">${mapPart}</div>` : ''}
        ${details}
        <h5>Who logged time${m.joint ? ' · ' + esc(me) : ''}</h5>${who || '<span class="muted">Nobody yet.</span>'}
        ${m.joint ? `<h5>Who logged time · ${esc(ot.short)}</h5>${(ot.who || []).map(whoLine).join('<br>') || '<span class="muted">Nobody yet.</span>'}` : ''}
        <h5>Operational notes</h5>
        ${edit ? `<textarea class="mno" rows="4" maxlength="5000" placeholder="Location, agencies involved, outcome…">${esc(m.notes || '')}</textarea>
        <div class="btnrow" style="margin-top:8px">
          <button class="btn small msave" type="button">Save</button>
          <select class="mtype mini" style="border:1px solid var(--line)" aria-label="Type">${typeOptions(m.type)}</select>
          <select class="mstat mini" style="border:1px solid var(--line)" aria-label="Status">
            ${m.status === 'Unlisted' ? '<option value="" selected disabled>Not on the list</option>' : ''}
            ${[['Open', 'Open'], ['Ongoing', 'Ongoing (no end date)'], ['Closed', 'Closed']].map(([v, l]) => `<option value="${v}" ${m.status === v ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
        </div>
        <label class="chk" style="margin:12px 0 0"><input type="checkbox" class="mjt" ${m.joint ? 'checked' : ''}> Joint mission (East &amp; West)</label>`
        : (m.notes ? `<div class="ro">${esc(m.notes)}</div>` : '<span class="muted">None.</span>')}
        <h5>Photos (${m.photoCount || 0})</h5>
        ${photos ? `<div class="thumbs" style="margin:0 0 6px">${photos}</div>` : '<span class="muted">No photos yet.</span>'}
        ${admin && m.folderId ? `<div><a href="https:\/\/drive.google.com/drive/folders/${esc(m.folderId)}" target="_blank" rel="noopener">Open the mission folder in Google Drive ↗</a></div>` : ''}
        <h5>Expenses</h5>${expPart}
        ${edit ? `<h5>Mission report</h5><div class="rpt"><button class="btn mrep" type="button">Create Mission Report (PDF)</button>
          <p class="muted small" style="margin:8px 0 0">Creating the report <b>locks the mission</b>: no new time, edits or expenses. Photos can still be added. An admin can unlock it.</p>
          <p class="small" style="margin:8px 0 0">🔓 Unlocked · <button class="link mlock" type="button" style="color:var(--navy);padding:0">Lock now without a report</button></p></div>
        <div class="btnrow" style="margin-top:16px"><button class="btn small ghost mgo" type="button">Merge…</button>
          <button class="btn small ghost rno" type="button">Rename…</button></div>` : ''}
        ${admin ? '' : '<p class="muted small" style="margin:14px 0 0">Only admins can change a mission. Add your time and photos on the Log tab.</p>'}
        <div class="mdone"><button class="btn mclose" type="button">Done</button></div>
      </div>`;
    }
    return `<div class="mcard" data-i="${i}">
      <div class="mhead" tabindex="0" role="button" aria-expanded="${open}"><div><div class="mname">${esc(m.name)}<span class="tag">${esc(m.type)}</span>${m.joint ? '<span class="tag joint">Joint</span>' : ''}${status}${m.mapId ? '<span class="tag">🗺 Map</span>' : ''}${m.photoCount ? `<span class="tag">📷 ${m.photoCount}</span>` : ''}</div>
        <div class="meta small muted">${dates ? esc(dates) + (m.joint ? '' : ' · ') : ''}${m.joint ? '' : nums}${mine}</div>${jline}</div>
        <div class="chev">${open ? '▾' : '▸'}</div></div>${body}</div>`;
  }).join('');

  html += section(`Missions & Events${S.mFilter === 'all' ? '' : ' · ' + esc(S.mFilter)}`,
    (cards || '<p class="muted">No missions of this type yet.</p>') +
    `<p class="muted small">Tap a mission for its map, notes, photos, expenses and who logged time${admin ? ', or to close, lock, merge or rename it' : ''}.</p>`, filter);
  main(html);

  $('mfil').onchange = ev => { S.mFilter = ev.target.value; S.openMission = null; render(); };
  if (admin) refreshPlaceList();
  hookAddResult();
  loadThumbs();
  if (admin) {
    hookAddMission();
    document.querySelectorAll('.mg').forEach(b => b.onclick = async () => {
      const g = S.sims[+b.dataset.g];
      const keep = document.querySelector(`input[name="sg${b.dataset.g}"]:checked`).value;
      if (!confirm(`Rename ${g.length - 1} other name(s) to “${keep}”?`)) return;
      b.disabled = true;
      try { setData(await run('apiMergeMissions', S.creds, g.map(m => m.name).filter(n => n !== keep), keep)); toast('Merged.'); }
      catch (e) { b.disabled = false; toast(clean(e), true); }
    });
  }
  document.querySelectorAll('.mcard').forEach(card => {
    const m = list[+card.dataset.i];
    const head = card.querySelector('.mhead');
    const toggle = () => { S.openMission = S.openMission === m.name ? null : m.name; render(); };
    head.onclick = toggle;
    head.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); } };
    const body = card.querySelector('.mbody');
    if (!body) return;
    const q = sel => body.querySelector(sel);
    const busy = async (btn, fn) => { if (btn) btn.disabled = true; try { await fn(); } catch (e) { toast(clean(e), true); } finally { if (btn && document.body.contains(btn)) btn.disabled = false; } };
    const save = async (patch, msg) => {
      try { setData(await run('apiSaveMission', S.creds, Object.assign({ name: m.name, date: m.first, type: m.type }, patch))); if (msg) toast(msg); }
      catch (e) { toast(clean(e), true); }
    };
    const detailPatch = () => {
      const p = {};
      if (q('.mno') && q('.mno').value.trim() !== String(m.notes || '').trim()) p.notes = q('.mno').value;
      if (q('.mcs') && q('.mcs').value.trim() !== (m.caseNo || '')) p.caseNo = q('.mcs').value;
      if (q('.mlc') && placeValue(q('.mlc')) !== (m.location || '')) p.location = placeValue(q('.mlc'));
      if (q('.mml') && q('.mml').value.trim()) p.mapUrl = q('.mml').value;
      if (q('.mst') && placeValue(q('.mst')) !== (m.staging || '')) p.staging = placeValue(q('.mst'));
      if (q('.mdt') && q('.mdt').value.trim() !== (m.details || '')) p.details = q('.mdt').value;
      const i = card.dataset.i;
      if ($('cp' + i)) { const v = channelValue('cp' + i, 'cpo' + i); if (v !== (m.primary || '')) p.primary = v; }
      if ($('cb' + i)) { const v = channelValue('cb' + i, 'cbo' + i); if (v !== (m.backup || '')) p.backup = v; }
      return p;
    };
    q('.mclose').onclick = async () => {
      const p = detailPatch();
      S.openMission = null;
      if (Object.keys(p).length) await save(p, 'Saved.'); else render();
      const c = [].find.call(document.querySelectorAll('.mcard'), x => (x.querySelector('.mname') || {}).firstChild && x.querySelector('.mname').firstChild.textContent === m.name);
      if (c && c.scrollIntoView) c.scrollIntoView({ block: 'center' });
    };
    body.querySelectorAll('.thumb').forEach(b => b.onclick = () =>
      openViewer((m.photos || []).map(p => Object.assign({ mission: m.name }, p)), +b.dataset.pk));
    body.querySelectorAll('.rcpt').forEach(b => b.onclick = () => {
      const x = (m.expenses || [])[+b.dataset.k];
      openViewer([{ fileId: x.receipt, unit: x.paidBy, date: x.date, mission: m.name + ' · Receipt: ' + x.desc }], 0);
    });
    if (q('.mcopy')) q('.mcopy').onclick = () => copyText(mapLink(m.mapId));
    if (q('.mbak')) q('.mbak').onclick = ev => busy(ev.target, async () => {
      toast('Backing up the map…', false, 30000);
      const r = await run('apiBackupMap', S.creds, m.name);
      toast('Map saved to Google Drive: ' + r.file, false, 6000);
    });
    if (q('.mmk')) q('.mmk').onclick = ev => busy(ev.target, async () => {
      toast('Creating the CalTopo map…', false, 30000);
      const r = await run('apiCreateMap', S.creds, m.name);
      setData(r.data); toast('CalTopo map created.');
    });
    if (q('.munlock')) q('.munlock').onclick = ev => {
      if (!confirm(`Unlock “${m.name}”? Members can change their time on it again until it is locked.`)) return;
      busy(ev.target, async () => { setData(await run('apiSetLock', S.creds, m.name, false)); toast('Unlocked. Create the report again when you are done.', false, 5000); });
    };
    if (q('.mlock')) q('.mlock').onclick = ev => {
      if (!confirm(`Lock “${m.name}”? Nobody can add or change time, notes or expenses until an admin unlocks it.`)) return;
      busy(ev.target, async () => { setData(await run('apiSetLock', S.creds, m.name, true)); toast('Mission locked.'); });
    };
    body.querySelectorAll('.mrep').forEach(b => b.onclick = ev => {
      const p = detailPatch();
      if (!confirm(`Create the Mission Report for “${m.name}”? This locks the mission: no new time, edits or expenses until an admin unlocks it.`)) return;
      busy(ev.target, async () => {
        if (Object.keys(p).length) await save(p);
        toast('Creating the report…', false, 30000);
        const r = await run('apiCreateReport', S.creds, m.name);
        S.d = r.data;
        S.report = { kind: 'mission', rep: r.report, back: 'missions', saveCopy: true, backup: r.backup };
        render(); window.scrollTo(0, 0);
        toast(r.backup && r.backup.ok ? 'Mission locked. The CalTopo map was backed up to Google Drive.' : 'Mission locked.', false, 5000);
      });
    });
    if (q('.mrdl')) q('.mrdl').onclick = ev => busy(ev.target, async () => {
      const rep = await run('apiReportData', S.creds, m.name);
      S.report = { kind: 'mission', rep: rep, back: 'missions' };
      render(); window.scrollTo(0, 0);
    });
    if (!q('.msave')) return;
    hookChannel('cp' + card.dataset.i, 'cpo' + card.dataset.i); hookChannel('cb' + card.dataset.i, 'cbo' + card.dataset.i);
    q('.mpk').onclick = () => pickStaging(q('.mst'), splitPlace(placeValue(q('.mlc'))).pt || q('.mlc').value.trim() || m.location || '');
    q('.mlpk').onclick = () => pickStaging(q('.mlc'), '', null, 'Tap the map to place the Incident Location');
    q('.mlsv').onclick = () => openSaved(q('.mlc')); q('.mssv').onclick = () => openSaved(q('.mst'));
    growBox(q('.mlc')); growBox(q('.mst')); if (q('.mdt')) growBox(q('.mdt'));
    if (q('.mbn')) q('.mbn').onchange = ev => busy(q('.mbn'), async () => { setData(await run('apiMissionBanner', S.creds, m.name, ev.target.value)); toast('Banner updated.'); });
    q('.msave').onclick = () => { const p = detailPatch(); if (Object.keys(p).length) save(p, 'Saved.'); else toast('Nothing to save.'); };
    q('.mtype').onchange = ev => save({ type: ev.target.value }, 'Type changed.');
    q('.mjt').onchange = ev => {
      const on = ev.target.checked;
      if (!on && !confirm(`Make “${m.name}” this posse's mission only? The other posse will no longer see it in their list.`)) { ev.target.checked = true; return; }
      save({ joint: on }, on ? 'Now a joint mission.' : 'No longer joint.');
    };
    q('.mstat').onchange = ev => save({ status: ev.target.value },
      { Open: 'Mission is open.', Ongoing: 'Marked ongoing.', Closed: 'Mission closed.' }[ev.target.value]);
    q('.mgo').onclick = () => missionDialog(m, 'merge');
    q('.rno').onclick = () => missionDialog(m, 'rename');
    body.querySelectorAll('.xdel').forEach(b => b.onclick = () => {
      if (!confirm('Delete this expense?')) return;
      busy(b, async () => { setData(await run('apiDeleteExpense', S.creds, b.dataset.id)); toast('Expense deleted.'); });
    });
    let receipt = null;
    const pickReceipt = inp => async () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      try { receipt = await shrinkPhoto(f); q('.xrp').textContent = '🧾 Receipt attached: ' + f.name; }
      catch (e) { toast(clean(e), true); }
    };
    q('.xr1').onchange = pickReceipt(q('.xr1'));
    q('.xr2').onchange = pickReceipt(q('.xr2'));
    q('.xadd').onclick = ev => busy(ev.target, async () => {
      S.expRid = S.expRid || newRid();
      const x = { date: q('.xd').value, amount: q('.xa').value, cat: q('.xc').value, desc: q('.xs').value.trim(), paidBy: q('.xp').value.trim(), rid: S.expRid };
      if (!x.desc) { toast('Say what the expense was for.', true); return; }
      if (receipt) x.receipt = { data: receipt };
      const p = detailPatch();
      if (Object.keys(p).length) await save(p);
      setData(await run('apiAddExpense', S.creds, m.name, x));
      S.expRid = null;
      toast('Expense added.');
    });
  });
}

/* ---------------- Mission Report (admins) ---------------- */

function renderMissionReport() {
  const R = S.report, r = R.rep;
  const joint = r.teams.length > 1;
  const byTeam = {};
  r.people.forEach(p => { const t = byTeam[p.team] || (byTeam[p.team] = { n: 0, h: 0, mi: 0 }); t.n++; t.h += p.h; t.mi += p.mi; });
  const tot = r.people.reduce((a, p) => ({ h: a.h + p.h, mi: a.mi + p.mi }), { h: 0, mi: 0 });
  const etot = r.expenses.reduce((a, x) => a + x.amount, 0);
  const rate = t => r.rates[t] || { hourRate: 0, mileRate: 0 };
  const cost = [];
  r.teams.forEach(t => { const x = byTeam[t]; if (x && x.h) cost.push([`Volunteer hours · ${t} ${n1(x.h)} hr @ ${money2(rate(t).hourRate)}/hr`, x.h * rate(t).hourRate]); });
  r.teams.forEach(t => { const x = byTeam[t]; if (x && x.mi) cost.push([`Mileage${joint ? ' · ' + t : ''} ${n1(x.mi)} mi @ ${money2(rate(t).mileRate)}/mi`, x.mi * rate(t).mileRate]); });
  if (etot) cost.push(['Expenses', etot]);
  const total = cost.reduce((a, c) => a + c[1], 0);
  const locked = /^(\d{4}-\d{2}-\d{2})/.exec(r.locked || '');
  const people = r.people.map(p => `<tr><td>${esc(p.team)}</td><td>${esc(p.unit)}</td><td class="l">${esc(p.name)}</td><td>${esc(fmtRange(p.first, p.last).replace(/, \d{4}$/, ''))}</td><td class="r">${n1(p.h)}</td><td class="r">${n1(p.mi)}</td></tr>`).join('');
  const subs = joint ? r.teams.filter(t => byTeam[t]).map(t => `<tr class="st"><td colspan="4">${esc(t)} subtotal (${byTeam[t].n})</td><td class="r">${n1(byTeam[t].h)}</td><td class="r">${n1(byTeam[t].mi)}</td></tr>`).join('') : '';
  const exps = r.expenses.map(x => `<tr><td>${esc(fmtDate(x.date).replace(/, \d{4}$/, ''))}</td>${joint ? `<td>${esc(x.team)}</td>` : ''}<td>${esc(x.cat)}</td><td class="l">${esc(x.desc)}</td><td>${esc(x.paidBy)}</td><td class="r">${money2(x.amount)}</td></tr>`).join('');
  const fname = `Mission Report ${r.reportNo || ''} ${r.name}`.replace(/[\\/:*?"<>|#%]+/g, '-').trim() + '.pdf';
  main(`<div class="rtools">
      <button class="btn gray" id="rback" type="button">← Back</button>
      <button class="btn" id="rprint" type="button">Print</button>
      <button class="btn" id="rpdf" type="button">Download PDF</button>
    </div>
    <div class="rpage mrep" id="rpage">
      ${locked ? `<div class="stamp">🔒 LOCKED · ${esc(fmtDate(locked[1]).toUpperCase())}</div>` : ''}
      <div class="rhead">${LOGO ? `<img src="${LOGO}" alt="">` : ''}
        <div><div class="org">Millard County Sheriff Search &amp; Rescue</div>
        <div class="rsub">${esc(r.teams.join(' & '))} · Millard County Sheriff's Office</div></div></div>
      <div class="mtitle">Mission Report: ${esc(r.name)}</div>
      <div class="facts"><div><b>Type</b>${esc(r.type)}</div><div><b>Dates</b>${esc(fmtRange(r.first, r.last))}</div>
        <div><b>Teams</b>${esc(r.teams.join(', '))}</div><div><b>Report #</b>${esc(r.reportNo || '—')}</div>
        ${r.caseNo ? `<div><b>MCSO case #</b>${esc(r.caseNo)}</div>` : ''}${r.location ? `<div><b>Incident Location</b>${esc(r.location)}</div>` : ''}
        ${r.staging ? `<div><b>Staging Point</b>${esc(r.staging)}</div>` : ''}${r.primary || r.backup ? `<div><b>Comms Plan</b>${r.primary ? 'Primary Ch: ' + esc(r.primary) : ''}${r.primary && r.backup ? ' · ' : ''}${r.backup ? 'Backup Ch: ' + esc(r.backup) : ''}</div>` : ''}</div>
      <div class="kv4"><div><span>Members</span><b>${r.people.length}</b></div><div><span>Man hours</span><b>${n1(tot.h)}</b></div>
        <div><span>Miles</span><b>${n1(tot.mi)}</b></div><div><span>Expenses</span><b>${money2(etot)}</b></div></div>
      <h3>Personnel</h3>
      ${people ? `<table><tr><th>Team</th><th>Unit</th><th class="l">Name</th><th>Dates</th><th class="r">Hours</th><th class="r">Miles</th></tr>${people}${subs}
        <tr class="tot"><td colspan="4">Total (${r.people.length} member${r.people.length === 1 ? '' : 's'})</td><td class="r">${n1(tot.h)}</td><td class="r">${n1(tot.mi)}</td></tr></table>` : '<p>No time logged.</p>'}
      <h3>Expenses</h3>
      ${exps ? `<table><tr><th>Date</th>${joint ? '<th>Team</th>' : ''}<th>Category</th><th class="l">Description</th><th>Paid by</th><th class="r">Amount</th></tr>${exps}
        <tr class="tot"><td colspan="${joint ? 5 : 4}">Total expenses</td><td class="r">${money2(etot)}</td></tr></table>` : '<p>No expenses recorded.</p>'}
      <h3>Cost summary</h3>
      <table class="cost">${cost.map(c => `<tr><td class="l">${esc(c[0])}</td><td class="r">${money2(c[1])}</td></tr>`).join('')}
        <tr class="tot"><td class="l">Total value of response</td><td class="r">${money2(total)}</td></tr></table>
      ${r.notes ? `<h3>Operational notes</h3><p style="white-space:pre-wrap;margin:0">${esc(r.notes)}</p>` : ''}
      <p class="fine">${r.mapUrl ? `CalTopo map: ${esc(r.mapUrl)}<br>` : ''}Photos on file: ${r.photoCount} · Receipts on file: ${r.receiptCount} (kept in Google Drive).
        Hours are counted in half hours. Volunteer value uses each posse's hourly and mileage rates.</p>
      <div class="sig">
        <div><div class="line"></div><div class="name">${esc(r.cmdrName)}</div><div>${esc(r.cmdrTitle)}</div></div>
        <div><div class="line"></div><div>Date</div></div>
      </div>
      <div class="rfoot">Created ${esc(r.createdAt)} by ${esc(r.createdBy)} · Duty Log ${APP_VERSION}</div>
    </div>`);
  $('rback').onclick = () => { S.tab = R.back || 'missions'; S.report = null; buildTabs(); render(); };
  $('rprint').onclick = () => window.print();
  $('rpdf').onclick = () => downloadPdf($('rpage'), fname);
  if (R.saveCopy) { R.saveCopy = false; saveReportCopy($('rpage'), r.name); }
}

/** Keeps a copy of a new Mission Report in the mission's Google Drive folder (quietly; the report is on screen either way). */
async function saveReportCopy(el, name) {
  try {
    if (!window.html2pdf) await loadScript('https:\/\/cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');
    el.classList.add('pdf');
    const uri = await window.html2pdf().set(pdfOptions('report.pdf')).from(el).outputPdf('datauristring');
    el.classList.remove('pdf');
    await run('apiSaveReportFile', S.creds, name, String(uri).split(',')[1]);
    toast('A copy of the report was saved to the mission folder in Google Drive.', false, 5000);
  } catch (e) { el.classList.remove('pdf'); console.log('Report copy not saved: ' + clean(e)); }
}

/* ---------------- Full-screen photo viewer (everyone) ---------------- */

/** Shows photos full-screen: swipe or arrows to move, Download, Esc / ✕ to close. list: [{ fileId, unit, date, mission }] */
function openViewer(list, start) {
  if (!list.length) return;
  const old = $('pview'); if (old) old.remove();
  S.photoCache = S.photoCache || {};
  let i = Math.max(0, Math.min(start || 0, list.length - 1));
  document.body.insertAdjacentHTML('beforeend', `<div id="pview" class="pview" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="pvtop"><div class="pvcap" id="pvcap"></div><button class="pvx" type="button" aria-label="Close">✕</button></div>
    <div class="pvstage"><button class="pvnav pvprev" type="button" aria-label="Previous photo">‹</button>
      <img id="pvimg" alt=""><div class="pvload" id="pvload">Loading…</div>
      <button class="pvnav pvnext" type="button" aria-label="Next photo">›</button></div>
    <div class="pvbot"><span id="pvcount"></span>
      <a id="pvdl" class="pvbtn" download>Download</a>
      <a id="pvdrive" class="pvbtn ghost" target="_blank" rel="noopener">Open in Drive</a></div></div>`);
  const view = $('pview'), img = $('pvimg');
  document.body.style.overflow = 'hidden';
  const fetchPhoto = async p => {
    if (S.photoCache[p.fileId]) return S.photoCache[p.fileId];
    const r = await run('apiPhoto', S.creds, p.fileId);
    const keys = Object.keys(S.photoCache);
    if (keys.length > 25) delete S.photoCache[keys[0]]; /* keep memory use modest */
    return (S.photoCache[p.fileId] = r);
  };
  const show = async () => {
    const p = list[i];
    $('pvcap').innerHTML = `<b>${esc(p.mission || '')}</b><br>${esc(p.unit)}${p.unit && nameOf(p.unit) !== '(vacant)' ? ' ' + esc(nameOf(p.unit)) : ''} · ${esc(p.date ? fmtDate(p.date) : '')}`;
    $('pvcount').textContent = (i + 1) + ' of ' + list.length;
    $('pvdrive').href = 'https:\/\/drive.google.com/file/d/' + encodeURIComponent(p.fileId) + '/view';
    $('pvdrive').classList.toggle('hidden', !S.d.me.admin);
    view.querySelector('.pvprev').disabled = i === 0;
    view.querySelector('.pvnext').disabled = i === list.length - 1;
    img.removeAttribute('src'); $('pvload').textContent = 'Loading…'; $('pvload').style.display = '';
    $('pvdl').removeAttribute('href');
    const want = i;
    try {
      const r = await fetchPhoto(p);
      if (want !== i || !$('pview')) return;
      img.src = r.data; img.alt = 'Photo from ' + p.unit;
      $('pvload').style.display = 'none';
      $('pvdl').href = r.data; $('pvdl').setAttribute('download', r.name || 'photo.jpg');
      if (list[i + 1]) fetchPhoto(list[i + 1]).catch(() => {}); /* get the next one ready */
    } catch (e) { if (want === i) $('pvload').textContent = clean(e); }
  };
  const go = d => { const n = i + d; if (n < 0 || n >= list.length) return; i = n; show(); };
  const close = () => { view.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', key); };
  const key = ev => {
    if (ev.key === 'Escape') close();
    else if (ev.key === 'ArrowLeft') go(-1);
    else if (ev.key === 'ArrowRight') go(1);
  };
  document.addEventListener('keydown', key);
  view.querySelector('.pvx').onclick = close;
  view.querySelector('.pvprev').onclick = () => go(-1);
  view.querySelector('.pvnext').onclick = () => go(1);
  let sx = 0, sy = 0;
  const stage = view.querySelector('.pvstage');
  stage.addEventListener('touchstart', ev => { sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; }, { passive: true });
  stage.addEventListener('touchend', ev => {
    const dx = ev.changedTouches[0].clientX - sx, dy = ev.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    else if (dy > 90 && Math.abs(dy) > Math.abs(dx) * 1.5) close(); /* swipe down to close */
  }, { passive: true });
  view.querySelector('.pvx').focus();
  show();
}

/* ---------------- Photos tab (admins): every photo, every mission ---------------- */

function renderPhotos() {
  const d = S.d;
  const all = [];
  (d.missionList || []).forEach(m => (m.photos || []).forEach(p => all.push(Object.assign({ mission: m.name }, p))));
  all.sort((a, b) => (b.date || '').localeCompare(a.date || '') || a.mission.localeCompare(b.mission));
  const years = [...new Set(all.map(p => (p.date || '').slice(0, 4)).filter(Boolean))].sort().reverse();
  const missions = [...new Set(all.map(p => p.mission))].sort((a, b) => a.localeCompare(b));
  const F = S.photoFilter || (S.photoFilter = { year: 'all', mission: 'all' });
  if (F.year !== 'all' && years.indexOf(F.year) < 0) F.year = 'all';
  if (F.mission !== 'all' && missions.indexOf(F.mission) < 0) F.mission = 'all';
  const list = all.filter(p => (F.year === 'all' || (p.date || '').slice(0, 4) === F.year) && (F.mission === 'all' || p.mission === F.mission));
  S.photoList = list;
  const filters = `<div class="form"><div class="row2">
      <label>Mission / Event<select id="pfm"><option value="all">All missions &amp; events</option>
        ${missions.map(m => `<option ${m === F.mission ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></label>
      <label>Year<select id="pfy"><option value="all">All years</option>
        ${years.map(y => `<option ${y === F.year ? 'selected' : ''}>${y}</option>`).join('')}</select></label>
    </div></div>`;
  const grid = list.map((p, k) => `<button type="button" class="pcell" data-k="${k}">
      <img alt="Photo from ${esc(p.unit)}" data-fid="${esc(p.fileId)}" ${(S.thumbs || {})[p.fileId] ? `src="${S.thumbs[p.fileId]}"` : ''}>
      <span>${esc(p.mission)}<br>${esc(p.unit)} · ${esc(p.date ? fmtDate(p.date) : '')}</span></button>`).join('');
  main(section('Photos', filters + `<p class="muted small" style="margin:0 0 12px">${list.length} photo${list.length === 1 ? '' : 's'}${all.length !== list.length ? ' of ' + all.length : ''}. Tap one to see it full-size.</p>
    ${grid ? `<div class="pgrid">${grid}</div>` : '<p class="muted">No photos yet. Members can add photos when they log activity.</p>'}`));
  bigSelect('pfm', 'Mission / Event');
  $('pfm').onchange = ev => { F.mission = ev.target.value; render(); };
  $('pfy').onchange = ev => { F.year = ev.target.value; render(); };
  document.querySelectorAll('.pcell').forEach(b => b.onclick = () => openViewer(S.photoList, +b.dataset.k));
  loadThumbs();
}
</script>

<script>
/* ================= Report tab, year-end report, Review, Settings ================= */

function renderReport() {
  const d = S.d, s = d.settings, all = d.all.filter(e => !e.exclude);
  const now = new Date(), cy = now.getFullYear(), R = S.rep;
  if (R.year == null) { R.year = cy; R.month = now.getMonth(); }
  const years = [...new Set(all.map(e => +e.date.slice(0, 4)).concat(cy))].sort((a, b) => b - a);
  const inPeriod = e => R.mode === 'year' ? +e.date.slice(0, 4) === R.year : e.date.slice(0, 7) === ym(R.year, R.month);
  const list = all.filter(inPeriod);

  const defYear = now.getMonth() < 2 ? cy - 1 : cy;
  const members = d.roster.filter(r => r.name);
  const yeCard = section('Year-End Report', `<div class="form">
      <div class="row2">
        <label>Year<select id="yey">${years.map(v => `<option ${v === defYear ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
        <label>Report for<select id="yem"><option value="ALL">All members combined</option>
          ${members.map(r => `<option value="${r.unit}">${r.unit} – ${esc(r.name)} (member statement)</option>`).join('')}</select></label>
      </div>
      <button class="btn" type="button" id="yeb">Create report</button>
      <p class="muted small" style="margin-bottom:0">Opens a printable Member Activity Report with the badge and a signature line. From there you can print it or download a PDF.</p>
    </div>`);

  const units = [...new Set(d.roster.map(r => r.unit).concat(list.map(e => e.unit)))].sort();
  const pace = R.year === cy ? s.required * (now.getMonth() + 1) / 12 : s.required;
  let rows = '', tot = { f: 0, h: 0, mi: 0, v: 0 };
  units.forEach(u => {
    const t = sum(list.filter(e => e.unit === u));
    const name = nameOf(u);
    if (name === '(vacant)' && !t.f && !t.h && !t.mi) return;
    tot.f += t.f; tot.h += t.h; tot.mi += t.mi; tot.v += t.v;
    let goal = '';
    if (R.mode === 'year') {
      const tag = t.f >= s.required ? '<span class="tag good">✓ met</span>'
        : t.f >= pace ? '<span class="tag">on pace</span>' : '<span class="tag warn">behind</span>';
      goal = `<td>${n1(t.f)} / ${n1(s.required)} ${tag}</td>`;
    }
    rows += `<tr class="${t.f || t.h ? '' : 'dim'}"><td>${u}</td><td class="l">${esc(name)}</td><td>${n1(t.f)}</td><td>${n1(t.h)}</td><td>${n1(t.mi)}</td><td>${money(t.v)}</td>${goal}</tr>`;
  });

  const ctl = `<select id="rm" class="mini"><option value="year" ${R.mode === 'year' ? 'selected' : ''}>Year</option><option value="month" ${R.mode === 'month' ? 'selected' : ''}>Month</option></select>
    ${R.mode === 'month' ? `<select id="rmo" class="mini">${MONTHS_LONG.map((m, i) => `<option value="${i}" ${i === R.month ? 'selected' : ''}>${m}</option>`).join('')}</select>` : ''}
    ${yearSelect('ry', years, R.year)}`;
  const title = R.mode === 'year' ? `Member Report · ${R.year}` : `Member Report · ${MONTHS_LONG[R.month]} ${R.year}`;
  main(yeCard + section('Totals', teamTiles(tot, teamFn(list).total, tile('Members reporting', new Set(list.map(e => e.unit)).size)) +
      '<p class="muted small" style="margin:10px 0 0">Functions count each mission or event once per day it was worked. Member turnouts (the total in the Functions column below) count every member who took part.</p>', ctl)
    + section(title, `<div class="tblwrap"><table><tr><th>Unit</th><th class="l">Name</th><th>Functions</th><th>Hours</th><th>Miles</th><th>Value</th>${R.mode === 'year' ? '<th>Goal</th>' : ''}</tr>
      ${rows}<tr class="tot"><td>Total</td><td class="l">Turnouts</td><td>${n1(tot.f)}</td><td>${n1(tot.h)}</td><td>${n1(tot.mi)}</td><td>${money(tot.v)}</td>${R.mode === 'year' ? '<td></td>' : ''}</tr></table></div>
      ${R.mode === 'year' && R.year === cy ? `<p class="muted small">"On pace" means at least ${n1(pace)} functions by the end of ${MONTHS_LONG[now.getMonth()]}.</p>` : ''}`));
  $('yeb').onclick = () => openYearEnd(+$('yey').value, $('yem').value);
  $('rm').onchange = ev => { R.mode = ev.target.value; render(); };
  $('ry').onchange = ev => { R.year = +ev.target.value; render(); };
  if ($('rmo')) $('rmo').onchange = ev => { R.month = +ev.target.value; render(); };
}

/* ---------------- Year-end Member Activity Report ---------------- */

function openYearEnd(year, who) {
  S.report = { year: year, who: who, back: S.tab };
  render(); window.scrollTo(0, 0);
}

function reportRows(year, who) {
  const d = S.d;
  const src = who === 'ALL' ? (d.all || []) : (who === d.me.unit ? d.mine : (d.all || []).filter(e => e.unit === who));
  return src.filter(e => !e.exclude && +e.date.slice(0, 4) === year && (who === 'ALL' || e.unit === who));
}

function renderYearEnd() {
  const R = S.report, d = S.d, s = d.settings, year = R.year, who = R.who;
  const rows = reportRows(year, who);
  const t = sum(rows);
  const TF = teamFn(rows);
  const today = new Date();
  const generated = MONTHS_LONG[today.getMonth()] + ' ' + today.getDate() + ', ' + today.getFullYear();
  const isAll = who === 'ALL';
  const member = isAll ? null : { unit: who, name: nameOf(who) };
  const thru = year === today.getFullYear() ? ` (through ${fmtDate(todayStr())})` : '';

  // Month table
  let mrows = '';
  for (let m = 0; m < 12; m++) {
    const mt = sum(rows.filter(e => e.date.slice(5, 7) === pad(m + 1)));
    if (!mt.f && !mt.h && !mt.mi) continue;
    mrows += isAll
      ? `<tr><td>${MONTHS_LONG[m]}</td><td>${n1(TF.byMonth[year + '-' + pad(m + 1)] || 0)}</td><td>${n1(mt.f)}</td><td>${n1(mt.h)}</td><td>${n1(mt.mi)}</td></tr>`
      : `<tr><td>${MONTHS_LONG[m]}</td><td>${n1(mt.f)}</td><td>${n1(mt.h)}</td><td>${n1(mt.mi)}</td></tr>`;
  }
  const monthTable = !mrows ? '<p>No activity recorded.</p>' : isAll
    ? `<table><tr><th>Month</th><th>Functions</th><th>Turnouts</th><th>Hours</th><th>Miles</th></tr>${mrows}
      <tr class="tot"><td>Total</td><td>${n1(TF.total)}</td><td>${n1(t.f)}</td><td>${n1(t.h)}</td><td>${n1(t.mi)}</td></tr></table>`
    : `<table><tr><th>Month</th><th>Functions</th><th>Hours</th><th>Miles</th></tr>${mrows}
      <tr class="tot"><td>Total</td><td>${n1(t.f)}</td><td>${n1(t.h)}</td><td>${n1(t.mi)}</td></tr></table>`;

  // Type table
  const byType = {};
  rows.forEach(e => { (byType[e.type] = byType[e.type] || []).push(e); });
  const order = d.types.concat(['Monthly report']);
  const typeTable = !Object.keys(byType).length ? '' : `<table><tr><th>Activity type</th><th>Functions</th>${isAll ? '<th>Turnouts</th>' : ''}<th>Hours</th><th>Miles</th></tr>
      ${Object.keys(byType).sort((a, b) => order.indexOf(a) - order.indexOf(b)).map(k => { const x = sum(byType[k]);
        return `<tr><td>${esc(k === 'Monthly report' ? 'Monthly report (old form)' : k)}</td><td>${n1(isAll ? TF.byType[k] || 0 : x.f)}</td>${isAll ? `<td>${n1(x.f)}</td>` : ''}<td>${n1(x.h)}</td><td>${n1(x.mi)}</td></tr>`; }).join('')}</table>`;

  let body;

      <tr class="tot"><td>Total</td><td class="l">${units.length} member${units.length === 1 ? '' : 's'} (turnouts)</td><td>${n1(t.f)}</td><td>${n1(t.h)}</td><td>${n1(t.mi)}</td><td></td></tr></table>`;
    const missions = new Set(rows.filter(e => e.mission).map(e => e.mission.toLowerCase())).size;

    body = `<h3>Member</h3>

        <tr><td>${n1(t.mi)}</td><td>${money2(s.charityRate)} per mile</td><td><b>${money2(charity)}</b></td></tr></table>
      <p class="fine">This statement records volunteer service performed for the ${esc(POSSE_INFO.header)} as logged by the member.
      The mileage amount uses the IRS standard rate for driving in service of a charitable organization. Volunteer time is not deductible.
      This statement is provided for the member's records and is not tax advice; please consult a tax professional about what you may deduct.</p>
      <h3>Activity by month</h3>${monthTable}
      ${typeTable ? `<h3>Activity by type</h3>${typeTable}` : ''}

      ${log ? `<table><tr><th>Date</th><th class="l">Type</th><th class="l">Mission / Event</th><th>Hours</th><th>Miles</th></tr>${log}</table>` : '<p>No activity recorded.</p>'}`;
  }

  const fname = `${POSSE_INFO.short} ${year} ${isAll ? 'Member Activity Report' : 'Statement ' + member.unit}.pdf`;
  main(`<div class="rtools">
      <button class="btn gray" id="rback" type="button">← Back</button>
      <button class="btn" id="rprint" type="button">Print</button>

  $('rpdf').onclick = () => downloadPdf($('rpage'), fname);
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error("Couldn't load the PDF tool. Use Print and choose Save as PDF."));
    document.head.appendChild(s);
  });
}

function pdfOptions(fname) {
  return {
    margin: [0.4, 0.4, 0.5, 0.4], filename: fname,
    image: { type: 'jpeg', quality: 0.95 },
    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', windowWidth: 1000 },
    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', '.sig', '.kv', '.kv4', '.facts'] }
  };
}

async function downloadPdf(el, fname) {
  const b = $('rpdf'); b.disabled = true; b.textContent = 'Making PDF…';
  try {
    if (!window.html2pdf) await loadScript('https:\/\/cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');
    el.classList.add('pdf');
    await window.html2pdf().set(pdfOptions(fname)).from(el).save();
    toast('PDF downloaded. If nothing appeared, use Print and choose Save as PDF.', false, 6000);
  } catch (e) {
    toast(clean(e), true, 6000);
  } finally { el.classList.remove('pdf'); b.disabled = false; b.textContent = 'Download PDF'; }
}

/* ---------------- Admin: Review ---------------- */

function renderReview() {
  const legacy = S.d.all.filter(e => e.source.indexOf('Form') === 0);
  const g = {};
  legacy.forEach(e => { const k = e.unit + '|' + e.date.slice(0, 7); (g[k] = g[k] || []).push(e); });
  const groups = Object.keys(g).filter(k => g[k].length > 1).sort((a, b) => b.split('|')[1].localeCompare(a.split('|')[1]) || a.localeCompare(b));
  const sig = e => [e.f, e.h, e.mi].join('/');
  const row = (e, same) => `<div class="r ${e.exclude ? 'x' : ''}">
      <input type="checkbox" class="exc" data-id="${esc(e.id)}" ${e.exclude ? 'checked' : ''} title="Exclude">
      <div class="t">Submitted ${esc(e.logged)} · <b>${e.f == null ? '—' : n1(e.f)}</b> fn · <b>${e.h == null ? '—' : n1(e.h)}</b> hr · <b>${e.mi == null ? '—' : n1(e.mi)}</b> mi
      ${same ? '<span class="tag warn">identical</span>' : ''}</div></div>`;

  const dupHtml = groups.map(k => {
    const list = g[k].sort((a, b) => a.logged.localeCompare(b.logged));
    const [u, m] = k.split('|');
    return `<div class="grp"><h4>${u} ${esc(nameOf(u))} · ${MONTHS_LONG[+m.slice(5) - 1]} ${m.slice(0, 4)}</h4>
      ${list.map(e => row(e, list.some(o => o !== e && sig(o) === sig(e)))).join('')}</div>`;
  }).join('');
  const missing = legacy.filter(e => !e.exclude && (e.f == null || e.h == null || e.mi == null))
    .sort((a, b) => b.date.localeCompare(a.date));
  const missHtml = missing.map(e => `<div class="grp"><h4>${e.unit} ${esc(nameOf(e.unit))} · ${fmtMonth(e.date)}</h4>${row(e, false)}</div>`).join('');

  main(section('Repeat Monthly Reports',
      `<p class="muted small" style="margin-top:0">These units sent more than one report for the same month on the old form. Check the box to exclude a row; excluded rows don't count anywhere.</p>`
      + (dupHtml || '<p class="muted">None.</p>'))
    + section('Missing Values',
      `<p class="muted small" style="margin-top:0">Blank values count as 0. To fix a number, edit it in the Entries tab of the sheet.</p>`
      + (missHtml || '<p class="muted">None.</p>')));

  document.querySelectorAll('.exc').forEach(c => c.onchange = async () => {
    const y = window.scrollY;
    c.disabled = true;
    try { setData(await run('apiSetExclude', S.creds, c.dataset.id, c.checked)); window.scrollTo(0, y); }
    catch (e) { c.disabled = false; c.checked = !c.checked; toast(clean(e), true); }
  });
}

    <b>Reset PIN</b> clears their PIN (and unlocks them); they sign in again with the first sign-in code and choose a new PIN.
    You can also do this on the Roster tab of the sheet: clear the <b>Locked</b> cell to unlock, or clear the <b>PIN</b> cell to reset.</p>`);
  main(html);

  $('sf').onsubmit = async ev => {
    ev.preventDefault();
    $('sb').disabled = true;
    try {
      setData(await run('apiSaveSettings', S.creds, { mileRate: $('smr').value, hourRate: $('shr').value, required: $('srq').value,
        charityRate: $('scr').value, cmdrName: $('scn').value, cmdrTitle: $('sct').value,
        signupCode: $('ssc').value, alertEmail: $('sae').value }));
      toast('Settings saved.');
    } catch (e) { $('sb').disabled = false; toast(clean(e), true); }
  };
  $('mps').onchange = ev => { S.memberSel = ev.target.value; render(); };
  hookChannel('cmp', 'cmpo'); hookChannel('cmb', 'cmbo');
  const reload = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };
  document.querySelectorAll('.plmv').forEach(b => b.onclick = () => { const p = places[+b.dataset.k];
    openPicker(p.point, '', reload, { name: p.name, lockName: true, saveChecked: true, hint: 'Drag the pin or tap the new spot for ' + p.name }); });
  document.querySelectorAll('.plrn').forEach(b => b.onclick = async () => { const p = places[+b.dataset.k];
    const nn = (prompt('New name for ' + p.name + ':', p.name) || '').trim(); if (!nn || nn === p.name) return;
    try { const r = await run('apiSavePlace', S.creds, { name: nn, oldName: p.name, point: p.point }); S.d.places = r.places; cacheData(); reload(); toast('Renamed.'); }
    catch (e) { toast(clean(e), true); } });
  document.querySelectorAll('.pldl').forEach(b => b.onclick = async () => { const p = places[+b.dataset.k];
    if (!confirm('Delete the saved place “' + p.name + '”? Missions that used it keep their Staging Point name.')) return;
    try { setData(await run('apiDeletePlace', S.creds, p.name)); toast('Deleted.'); } catch (e) { toast(clean(e), true); } });
  $('pladd').onclick = () => { const nn = (prompt('Name of the place (e.g. Posse Shed):') || '').trim(); if (!nn) return;
    if (places.some(p => p.name.toLowerCase() === nn.toLowerCase())) { toast('That place is already saved. Use Move to change its spot.', true); return; }
    openPicker('', '', reload, { name: nn, lockName: true, saveChecked: true, hint: 'Tap the spot for ' + nn }); };
  $('cmf').onsubmit = async ev => {
    ev.preventDefault(); $('cmsb').disabled = true;
    try { setData(await run('apiSaveComms', S.creds, { primary: channelValue('cmp', 'cmpo'), backup: channelValue('cmb', 'cmbo'), channels: $('cml').value })); toast('Comms plan saved.'); }
    catch (e) { $('cmsb').disabled = false; toast(clean(e), true); }
  };
  const connVals = () => ({ ctTeam: $('cct').value, ctFolder: $('ccf').value, ctId: $('cci').value, ctKey: $('cck').value.trim(), ctLink: $('ccl').value,
    gmBot: $('cgb').value.trim(), gmToken: $('cgk').value.trim(), gmGroup: $('cgg').value, ghToken: $('cgt').value.trim(), ghRepo: $('cgr').value, ghPath: $('cgp').value });
  const saveConn = async (extra, msg) => {
    try { setData(await run('apiSaveConnections', S.creds, Object.assign(connVals(), extra || {}))); if (msg) toast(msg); return true; }
    catch (e) { toast(clean(e), true); return false; }
  };
  $('cf').onsubmit = async ev => { ev.preventDefault(); $('cb').disabled = true; await saveConn({}, 'Connections saved.'); };
  document.querySelectorAll('[data-test]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const which = b.dataset.test;
    /* Save anything typed first, then test */
    const v = connVals();
    if (v.ctKey || v.gmBot || v.gmToken || v.gmGroup !== (c.gmGroup || '') || v.ghToken || v.ctTeam !== (c.ctTeam || '') || v.ctId !== (c.ctId || '') || v.ctFolder !== (c.ctFolder || '') ||
        v.ghRepo !== (c.ghRepo || '') || v.ghPath !== (c.ghPath || '')) { if (!(await saveConn())) { b.disabled = false; return; } }
    toast('Testing…', false, 30000);
    try { const r = await run('apiTestConnection', S.creds, which); toast(r.message, false, 7000); try { setData(await run('apiRefresh', S.creds)); } catch (e) {} }
    catch (e) { toast(clean(e), true, 8000); const x = document.querySelector('[data-test="' + which + '"]'); if (x) x.disabled = false; }
  });
  if ($('ccx')) $('ccx').onclick = () => { if (confirm('Remove the CalTopo keys?')) saveConn({ clearCt: true, ctKey: '' }, 'CalTopo keys removed.'); };
  if ($('cgx')) $('cgx').onclick = () => { if (confirm('Remove the GroupMe bot?')) saveConn({ clearGm: true, gmBot: '' }, 'GroupMe bot removed.'); };
  if ($('cgax')) $('cgax').onclick = () => { if (confirm('Stop posting from your GroupMe account? The saved token is removed.')) saveConn({ clearGmAcct: true, gmToken: '', gmGroup: undefined }, 'GroupMe account removed.'); };
  $('cgl').onclick = async () => {
    $('cgl').disabled = true; toast('Loading your groups…', false, 20000);
    try {
      const list = await run('apiGroupMeGroups', S.creds, $('cgk').value.trim());
      const cur = $('cgg').value;
      $('cgg').innerHTML = '<option value="">Pick the group for mission alerts…</option>' + list.map(g => `<option value="${esc(g.id)}" ${g.id === cur ? 'selected' : ''}>${esc(g.name)}</option>`).join('');
      toast(list.length ? 'Pick the group, then tap Save connections.' : 'No groups found on that account.', !list.length, 6000);
    } catch (e) { toast(clean(e), true, 8000); }
    $('cgl').disabled = false;
  };
  if ($('cgtx')) $('cgtx').onclick = () => { if (confirm('Remove the GitHub token? The website will go back to asking Google for its numbers.')) saveConn({ clearGh: true, ghToken: '' }, 'GitHub token removed.'); };
  const act = async (action, msg) => {
    try { setData(await run('apiResetMember', S.creds, pick.unit, action)); toast(msg); }
    catch (e) { toast(clean(e), true); }
  };
  if ($('mpu')) $('mpu').onclick = () => act('unlock', pick.unit + ' is unlocked.');
  if ($('mpr')) $('mpr').onclick = () => {
    if (!confirm(`Reset the PIN for ${pick.unit} ${pick.name}? They will need the first sign-in code to choose a new PIN.`)) return;
    act('reset', pick.unit + "'s PIN was reset.");
  };
}
</script>

<script>
/* ================= Active mission banner, Go On / Off Duty, On Duty Board ================= */

function dutyNow() { return Date.now(); }
function hm(ms) { const m = Math.max(0, Math.floor(ms / 60000)); return Math.floor(m / 60) + ' h ' + pad2(m % 60) + ' m'; }
function pad2(n) { return String(n).padStart(2, '0'); }
function clock(t) { if (!t) return ''; const d = new Date(t); let h = d.getHours(); const ap = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12; return h + ':' + pad2(d.getMinutes()) + ' ' + ap; }
function halfUpHrs(min) { return Math.max(0.5, Math.ceil(min / 30) / 2); }
function lastName(n) { return String(n || '').trim().split(/\s+/).slice(-1)[0].toUpperCase(); }
function dirLink(place) {
  const pt = splitPlace(place || '').pt;
  if (!pt) return '';
  const q = encodeURIComponent(pt.replace(/\s+/g, ''));
  return /iPhone|iPad|iPod/.test(navigator.userAgent) ? 'https:\/\/maps.apple.com/?daddr=' + q : 'https:\/\/www.google.com/maps/dir/?api=1&destination=' + q;
}
function dutyInfo() { return (S.d && S.d.duty) || { active: [], mine: null }; }
function activeList() { return dutyInfo().active || []; }

/* ---------------- The bar under the tabs ---------------- */
function drawActBar() {
  const bar = $('actbar'); if (!bar) return;
  if (!S.d || !S.d.me || S.tab === 'pin') { bar.innerHTML = ''; return; }
  const act = activeList(), mine = dutyInfo().mine;
  const me = mine ? `<span class="mytag">● You're on duty${act.some(a => a.name === (mine && mine.mission)) ? '' : ' · ' + esc(mine.mission)} · <b class="tick" data-on="${mine.on}">${hm(dutyNow() - mine.on)}</b></span>` : '';
  if (act.length) {
    const a = act[0], red = a.type === 'Callout';
    bar.innerHTML = `<button type="button" class="actbar ${red ? 'red' : 'yel'}" id="abtn"><span class="dot"></span><span class="t">ACTIVE ${esc(a.type.toUpperCase())}
      <small>${esc(a.name)}${act.length > 1 ? ' · +' + (act.length - 1) + ' more' : ''}</small>${me}</span><span class="go">Details ›</span></button>`;
  } else if (mine) {
    bar.innerHTML = `<button type="button" class="actbar grn" id="abtn"><span class="dot"></span><span class="t">ON DUTY<small>${esc(mine.mission)} · <b class="tick" data-on="${mine.on}">${hm(dutyNow() - mine.on)}</b></small></span><span class="go">Details ›</span></button>`;
  } else { bar.innerHTML = ''; return; }
  $('abtn').onclick = () => openActive(act.length ? act[0].name : mine.mission);
}

/* ---------------- Active mission details (everything in one place) ---------------- */
function openActive(name, which) {
  closeActive();
  const act = activeList(), mine = dutyInfo().mine;
  let a = act.find(x => x.name === name) || null;
  if (!a) { const ml = (S.d.missionList || []).find(x => x.name === name) || {}; a = { name: name, type: ml.type || '', date: ml.first || '', location: ml.location, staging: ml.staging, primary: ml.primary, backup: ml.backup, details: ml.details, mapId: ml.mapId }; }
  const isAct = act.some(x => x.name === a.name);
  const kind = a.type === 'Callout' ? 'red' : isAct ? 'yel' : 'grn';
  const onHere = mine && mine.mission === a.name;
  const url = mapLink(a.mapId);
  const sec = (h, v) => v ? `<div class="ams"><h6>${h}</h6><div class="v">${v}</div></div>` : '';
  const place = p => { if (!p) return ''; const sp = splitPlace(p), d = dirLink(p); return esc(sp.name || p) + (sp.pt ? `<div class="muted small">${esc(sp.pt)}</div>` : '') + (d ? `<a class="dir" href="${d}" target="_blank" rel="noopener">Directions ›</a>` : ''); };
  const others = act.filter(x => x.name !== a.name);
  document.body.insertAdjacentHTML('beforeend', `<div class="amsh" id="amsh"><div class="ambox" role="dialog" aria-label="${esc(a.name)}">
    <div class="amhead ${kind}"><div class="k">${isAct ? 'ACTIVE ' + esc(String(a.type).toUpperCase()) : esc(String(a.type || 'Mission').toUpperCase())}</div><div class="n">${esc(a.name)}</div>
      <div class="d">${a.date ? esc(fmtDate(a.date)) : ''}${a.created ? ' · started ' + clock(a.created) : ''}</div><button type="button" class="amx" id="amx" aria-label="Close">✕</button></div>
    ${onHere ? `<div class="dutyon">● <b>You're on duty</b> since ${clock(mine.on)} · <b class="tick" data-on="${mine.on}">${hm(dutyNow() - mine.on)}</b></div>` : ''}
    <div class="two">${onHere ? '<button type="button" class="btn offb" id="dOff">Go Off Duty</button>' : '<button type="button" class="btn onb" id="dOn">Go On Duty</button>'}
      ${url ? `<a class="btn" href="${url}" target="_blank" rel="noopener">CalTopo Map</a>` : '<button type="button" class="btn" disabled>No map yet</button>'}</div>
    ${onHere && mine.assignment ? sec('Your assignment', esc(mine.assignment)) : ''}
    ${sec('Incident Location', place(a.location))}${sec('Staging Point', place(a.staging))}
    ${sec('Comms Plan', [a.primary ? 'Primary Ch: ' + esc(a.primary) : '', a.backup ? 'Backup Ch: ' + esc(a.backup) : ''].filter(Boolean).join('<br>'))}
    ${sec('Details', a.details ? esc(a.details).replace(/\n/g, '<br>') : '')}
    ${S.d.me.admin && isAct ? `<div class="amlinks"><button type="button" class="link" id="amBoard" style="color:var(--navy);padding:0">Open the On Duty Board ›</button></div>` : ''}
    ${others.length ? `<div class="amlinks">Also active: ${others.map((o, i) => `<button type="button" class="link amo" data-i="${i}" style="color:var(--navy);padding:0 6px">${esc(o.name)}</button>`).join('')}</div>` : ''}
    </div></div>`);
  document.documentElement.classList.add('msopen');
  $('amsh').onclick = ev => { if (ev.target.id === 'amsh') closeActive(); };
  $('amx').onclick = closeActive;
  if ($('dOn')) $('dOn').onclick = () => goOnDuty(a.name);
  if ($('dOff')) $('dOff').onclick = () => openOffDuty();
  if ($('amBoard')) $('amBoard').onclick = () => { closeActive(); S.tab = 'board'; buildTabs(); render(); window.scrollTo(0, 0); };
  document.querySelectorAll('#amsh .amo').forEach(b => b.onclick = () => openActive(others[+b.dataset.i].name));
}
function closeActive() { const x = $('amsh'); if (x) x.remove(); if (!$('mssh')) document.documentElement.classList.remove('msopen'); }

/* ---------------- Go On Duty ---------------- */
async function goOnDuty(name) {
  const mine = dutyInfo().mine;
  if (mine) {
    if (mine.mission === name) { toast("You're already on duty for this."); return; }
    if (!confirm(`You're on duty for ${mine.mission}. Go off duty there first?`)) return;
    closeActive(); openOffDuty(name); return;
  }
  S.dutyRid = S.dutyRid || newRid();
  // Show it right away; the save finishes in the background.
  const before = S.d.duty, act = activeList().find(x => x.name === name), ml = (S.d.missionList || []).find(x => x.name === name) || {};
  S.d.duty = Object.assign({}, before, { mine: { id: 'pending', unit: S.d.me.unit, name: S.d.me.name, mission: name, type: (act && act.type) || ml.type || '', on: dutyNow(), assignment: '' } });
  S.dutyPending = true;
  const reshow = () => { const open = !!$('amsh') && !$('offSave'); drawActBar(); if (S.tab === 'log' && !$('mssh')) { const y = window.scrollY; render(); window.scrollTo(0, y); } if (open) openActive(name); };
  reshow();
  toast("You're on duty for " + name + '.');
  try {
    const r = await run('apiDutyOn', S.creds, name, S.dutyRid);
    S.dutyRid = null; S.dutyPending = false;
    if (r && r.duty) { S.d.duty = r.duty; if (S.d.me.admin) buildTabs(); reshow(); } else if (r) setData(r);
  } catch (e) {
    S.dutyPending = false; S.d.duty = before; reshow();
    toast(clean(e), true, 6000);
  }
}

/** Log page: Go On Duty for any mission (meetings and maintenance too). */
function pickDutyMission() {
  let sel = $('dutysel');
  if (sel) sel.remove();
  const holder = document.createElement('div'); holder.className = 'hidden';
  holder.innerHTML = missionSelect('').replace('id="ems"', 'id="dutysel"');
  document.body.appendChild(holder);
  sel = $('dutysel');
  [].slice.call(sel.options).forEach(o => { if (o.value === '__new' || o.disabled) o.remove(); });
  sel.options[0].textContent = 'Cancel';
  sel.dataset.title = 'On duty for which mission?';
  sel.onchange = () => { const v = sel.value; holder.remove(); if (v) goOnDuty(v); };
  openPick('dutysel');
}

function dutyLogStrip() {
  const mine = dutyInfo().mine;
  if (mine) return `<div class="dutystrip on"><div><b>● You're on duty</b> · ${esc(mine.mission)}<div class="muted small">Since ${clock(mine.on)} · <b class="tick" data-on="${mine.on}">${hm(dutyNow() - mine.on)}</b></div></div>
    <button type="button" class="btn offb" id="lOff">Go Off Duty</button></div>`;
  return `<div class="dutystrip"><div class="muted small">Starting now? Go on duty and the app keeps your time.</div><button type="button" class="btn onb" id="lOn">Go On Duty</button></div>`;
}
function hookDutyStrip() {
  if ($('lOn')) $('lOn').onclick = () => { const act = activeList(); if (act.length === 1) openActive(act[0].name); else pickDutyMission(); };
  if ($('lOff')) $('lOff').onclick = () => openOffDuty();
}

/* ---------------- Go Off Duty ---------------- */
function openOffDuty(thenOn) {
  const mine = dutyInfo().mine; if (!mine) return;
  if (mine.id === 'pending') { toast('Still saving your on-duty time. Try again in a moment.'); return; }
  closeActive();
  const now = dutyNow();
  const long = now - mine.on > (dutyInfo().longHours || 16) * 3600000;
  const toLocal = t => { const d = new Date(t); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
  document.body.insertAdjacentHTML('beforeend', `<div class="amsh" id="amsh"><div class="ambox form" role="dialog" aria-label="Go off duty">
    <div class="amhead grn2"><div class="k">GO OFF DUTY</div><div class="n">${esc(mine.mission)}</div><button type="button" class="amx" id="amx" aria-label="Close">✕</button></div>
    ${long ? `<div class="warnbox">You went on duty ${hm(now - mine.on)} ago. If you stopped earlier, set the time you went off duty below.</div>` : ''}
    <div class="sum"><div><span>On duty</span><span>${clock(mine.on)}${new Date(mine.on).toDateString() !== new Date().toDateString() ? ' · ' + esc(new Date(mine.on).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })) : ''}</span></div>
      <div><span>Off duty</span><span id="offShow">${clock(now)}</span></div><div><span>Time on shift</span><span id="offEl">${hm(now - mine.on)}</span></div>
      <div class="tot"><span>Logged as</span><span id="offHr">${halfUpHrs((now - mine.on) / 60000)} hr (rounded up)</span></div></div>
    <label style="margin:0 16px 10px">Off-duty time <span class="muted small">(change it if you forgot to go off duty)</span><input type="datetime-local" id="offT" value="${toLocal(now)}" max="${toLocal(now)}" min="${toLocal(mine.on)}"></label>
    <label style="margin:0 16px 10px">Miles driven<input type="number" id="offMi" min="0" max="2000" step="1" inputmode="numeric" placeholder="Total miles for this shift"></label>
    <label style="margin:0 16px 10px">Notes (optional)<textarea id="offNo" rows="2" maxlength="400">${mine.assignment ? 'Assignment: ' + esc(mine.assignment) : ''}</textarea></label>
    <button type="button" class="btn wide" id="offSave">Go Off Duty &amp; Save</button>
    <div class="center"><button type="button" class="link" id="offCancel" style="color:var(--muted)">Cancel (stay on duty)</button></div></div></div>`);
  document.documentElement.classList.add('msopen');
  const startVal = $('offT').value;
  /* The box shows minutes only: unless it was changed, "off" is right now */
  const offTime = () => { const v = $('offT').value; if (!v || v === startVal) return Date.now(); const t = new Date(v).getTime(); return isFinite(t) ? Math.max(t, mine.on) : Date.now(); };
  const upd = () => { const t = offTime(), min = (t - mine.on) / 60000; $('offShow').textContent = clock(t); $('offEl').textContent = hm(t - mine.on); $('offHr').textContent = (min > 0 ? halfUpHrs(min) : '—') + ' hr (rounded up)'; };
  $('offT').addEventListener('input', upd); $('offT').addEventListener('change', upd);
  $('amx').onclick = closeActive; $('offCancel').onclick = closeActive;
  $('offSave').onclick = async () => {
    const mi = $('offMi').value.trim();
    if (mi === '' || !(Number(mi) >= 0)) { toast('Enter the miles you drove (0 if none).', true); $('offMi').focus(); return; }
    const t = offTime();
    if (t > Date.now() + 60000) { toast("The off-duty time can't be in the future.", true); return; }
    if (t < mine.on) { toast('The off-duty time is before you went on duty.', true); return; }
    $('offSave').disabled = true; $('offSave').textContent = 'Saving…';
    S.offRid = S.offRid || newRid();
    const changed = $('offT').value !== startVal;
    try {
      setData(await run('apiDutyOff', S.creds, { id: mine.id, off: changed ? new Date(t).toISOString() : '', miles: Number(mi), notes: $('offNo').value, rid: S.offRid }));
      S.offRid = null; closeActive(); toast('Off duty. Your time was logged.', false, 4000);
      if (thenOn) goOnDuty(thenOn);
    } catch (e) { $('offSave').disabled = false; $('offSave').textContent = 'Go Off Duty & Save'; toast(clean(e), true, 6000); }
  };
}

/** A shift left running for a long time: ask once per app open. */
function checkLongShift() {
  const mine = dutyInfo().mine;
  if (!mine || S.longAsked === mine.id) return;
  if (dutyNow() - mine.on > (dutyInfo().longHours || 16) * 3600000) { S.longAsked = mine.id; openOffDuty(); }
}

/* ---------------- On Duty Board (admins) ---------------- */
const CHECK_CHOICES = [[0, 'Off'], [15, '15 min'], [30, '30 min'], [45, '45 min'], [60, '60 min'], [90, '90 min'], [120, '2 hr'], [180, '3 hr'], [240, '4 hr']];
function boardData() { return dutyInfo().board || []; }
function dueInfo(s, every) {
  if (!every) return { cls: 'ok', text: '', due: false };
  const next = (s.check || s.on) + every * 60000, left = Math.round((next - dutyNow()) / 60000);
  if (left < 0) return { cls: 'late', text: 'Overdue ' + (-left) + ' min', due: true, left: left };
  if (left <= 10) return { cls: 'soon', text: 'Due in ' + left + ' min', due: false, left: left };
  return { cls: 'ok', text: 'Due in ' + left + ' min', due: false, left: left };
}
function renderBoard() {
  if (!S.d.me.admin) { S.tab = 'log'; return renderLog(); }
  const groups = boardData();
  const wide = window.innerWidth >= 900;
  const due = [];
  const html = groups.map((g, gi) => {
    const on = g.on.slice().sort((a, b) => (dueInfo(a, g.every).left || 9999) - (dueInfo(b, g.every).left || 9999));
    on.forEach(s => { if (dueInfo(s, g.every).due) due.push(s.unit + ' ' + lastName(s.name) + ' (' + dueInfo(s, g.every).text.toLowerCase() + ')'); });
    const every = `<label class="every">Check every <select class="bev" data-g="${gi}">${CHECK_CHOICES.concat(CHECK_CHOICES.some(c => c[0] === g.every) ? [] : [[g.every, g.every + ' min']]).map(([v, l]) => `<option value="${v}" ${v === g.every ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;
    const offRows = g.off.map(s => wide
      ? `<tr class="off"><td class="u">${esc(s.unit)}</td><td class="nm">${esc(lastName(s.name))}</td><td><div class="asgro">${esc(s.assignment) || '<span class="muted">—</span>'}</div></td>
          <td>On ${clock(s.on)}<br>Off ${clock(s.off)}</td><td class="big">${hm(s.off - s.on)}<div class="muted small">logged ${s.hours} hr · ${s.miles == null ? '' : s.miles + ' mi'}</div></td><td>${s.check && s.checkBy !== 'Start' ? clock(s.check) : '—'}</td><td>—</td><td></td></tr>`
      : `<div class="bcard off"><div class="brow"><div class="bu">${esc(s.unit)} <span>${esc(lastName(s.name))}</span></div><div class="bel">${hm(s.off - s.on)}</div></div>
          <div class="bmeta"><b class="ink">On ${clock(s.on)} · Off ${clock(s.off)}</b>${s.miles == null ? '' : ' · ' + s.miles + ' mi'}</div>
          <div class="bmeta">Logged as ${s.hours} hr (rounded up)${s.assignment ? ' · Assignment: ' + esc(s.assignment) : ''}</div></div>`).join('');
    const onRows = on.map(s => {
      const di = dueInfo(s, g.every);
      const last = s.check && s.checkBy !== 'Start' ? clock(s.check) : '—';
      const before = g.off.filter(o => o.unit === s.unit);
      const earlier = before.length ? 'Shift ' + (before.length + 1) + ' · earlier: ' + before.slice().reverse().map(o => clock(o.on) + '–' + clock(o.off)).join(', ') : '';
      if (wide) return `<tr class="cs-${di.cls}"><td class="u">${esc(s.unit)}</td><td class="nm">${esc(lastName(s.name))}</td>
        <td><textarea class="basg" data-id="${esc(s.id)}" rows="2" maxlength="300" placeholder="Type the assignment">${esc(s.assignment)}</textarea></td>
        <td>On ${clock(s.on)}${earlier ? `<div class="muted small">${esc(earlier)}</div>` : ''}</td><td class="big"><span class="tick" data-on="${s.on}">${hm(dutyNow() - s.on)}</span></td><td>${last}${s.checkBy && s.checkBy !== 'Start' ? `<div class="muted small">by ${esc(s.checkBy)}</div>` : ''}</td>
        <td><span class="cd ${di.cls}">${di.text || '<span class="muted">No checks</span>'}</span></td><td>${g.every ? `<button type="button" class="btn small bchk" data-id="${esc(s.id)}">✓ Checked</button>` : ''}</td></tr>`;
      return `<div class="bcard cs-${di.cls}"><div class="brow"><div class="bu">${esc(s.unit)} <span>${esc(lastName(s.name))}</span></div><div class="bel"><span class="tick" data-on="${s.on}">${hm(dutyNow() - s.on)}</span></div></div>
        <div class="bmeta">On since ${clock(s.on)}${g.every ? ' · last check ' + last : ''}</div>${earlier ? `<div class="bmeta">${esc(earlier)}</div>` : ''}
        ${s.assignment ? `<button type="button" class="asg" data-id="${esc(s.id)}"><span class="tx"><b>Assignment</b>${esc(s.assignment)}</span><span class="ed">Edit</span></button>`
          : `<button type="button" class="asg none" data-id="${esc(s.id)}"><span class="tx">+ Add assignment</span></button>`}
        ${g.every ? `<div class="bchkrow"><span class="cd ${di.cls}">${di.text}</span><button type="button" class="btn small bchk" data-id="${esc(s.id)}">✓ Checked</button></div>` : ''}</div>`;
    }).join('');
    const head = `<div class="bgh"><div><b>${esc(g.mission)}</b> <span class="tag">${esc(g.type || 'Mission')}</span> <span class="muted small">${g.on.length} on duty</span></div>${every}</div>`;
    if (wide) return `${head}<table class="dtab"><tr><th>Unit</th><th>Name</th><th>Assignment <span class="muted">(saves when you click away)</span></th><th>On / Off</th><th>On shift</th><th>Last check</th><th>Next check</th><th></th></tr>
      ${onRows || '<tr><td colspan="8" class="muted">Nobody on duty.</td></tr>'}${offRows ? `<tr class="sep"><td colspan="8">Off duty</td></tr>${offRows}` : ''}</table>`;
    return `${head}${onRows || '<p class="muted">Nobody on duty.</p>'}${offRows ? `<div class="bh">Off duty</div>${offRows}` : ''}`;
  }).join('<hr class="bsep">');
  main(section('On Duty Board', `${due.length ? `<div class="duebar">🔔 Security check due: ${esc(due.join(', '))}</div>` : ''}
    ${html || '<p class="muted">Nobody is on duty, and no mission is active. When members tap Go On Duty, they show up here.</p>'}
    <p class="muted small" style="margin-top:16px">Every check, assignment and on/off duty is recorded with who did it on the Board Log tab of the sheet. Alerts sound while this app is open.</p>`));
  if (wide) $('main').classList.add('widemain');
  document.querySelectorAll('.bev').forEach(sel => sel.onchange = async () => {
    const g = groups[+sel.dataset.g]; sel.disabled = true;
    try { applyDuty(await run('apiBoardEvery', S.creds, g.mission, Number(sel.value))); toast('Check timer saved.'); } catch (e) { toast(clean(e), true); sel.disabled = false; }
  });
  document.querySelectorAll('.bchk').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = 'Saving…';
    try { applyDuty(await run('apiBoardCheck', S.creds, b.dataset.id)); toast('Check recorded.'); } catch (e) { toast(clean(e), true); b.disabled = false; b.textContent = '✓ Checked'; }
  });
  document.querySelectorAll('textarea.basg').forEach(t => {
    t.dataset.was = t.value;
    t.addEventListener('focus', () => { S.boardTyping = true; });
    t.addEventListener('blur', async () => {
      S.boardTyping = false;
      if (t.value.trim() === t.dataset.was.trim()) return;
      try { applyDuty(await run('apiBoardAssign', S.creds, t.dataset.id, t.value)); toast('Assignment saved.'); } catch (e) { toast(clean(e), true); }
    });
  });
  document.querySelectorAll('button.asg').forEach(b => b.onclick = () => editAssignment(b.dataset.id));
}
function shiftById(id) { for (const g of boardData()) { const s = g.on.concat(g.off).find(x => x.id === id); if (s) return s; } return null; }
function editAssignment(id) {
  const s = shiftById(id); if (!s) return;
  const picks = (dutyInfo().assignments || []).slice(-12).reverse();
  document.body.insertAdjacentHTML('beforeend', `<div class="amsh" id="amsh"><div class="ambox form" role="dialog" aria-label="Assignment">
    <div class="amhead grn2"><div class="k">ASSIGNMENT</div><div class="n">${esc(s.unit)} ${esc(lastName(s.name))}</div><button type="button" class="amx" id="amx" aria-label="Close">✕</button></div>
    ${picks.length ? `<div class="chips2">${picks.map((p, i) => `<button type="button" class="chip2" data-i="${i}">${esc(p)}</button>`).join('')}</div>` : ''}
    <textarea id="asgT" rows="4" maxlength="300" style="margin:12px 16px;width:calc(100% - 32px)" placeholder="e.g. Search Area 2, north drainage">${esc(s.assignment)}</textarea>
    <div class="btnrow" style="margin:0 16px"><button type="button" class="btn ghost" id="asgC" style="flex:1;width:auto">Cancel</button><button type="button" class="btn" id="asgS" style="flex:1;width:auto">Save</button></div></div></div>`);
  document.documentElement.classList.add('msopen');
  document.querySelectorAll('#amsh .chip2').forEach(c => c.onclick = () => { $('asgT').value = picks[+c.dataset.i]; $('asgT').focus(); });
  $('amx').onclick = closeActive; $('asgC').onclick = closeActive;
  $('asgS').onclick = async () => {
    $('asgS').disabled = true;
    try { const r = await run('apiBoardAssign', S.creds, id, $('asgT').value); closeActive(); applyDuty(r); toast('Assignment saved.'); } catch (e) { $('asgS').disabled = false; toast(clean(e), true); }
  };
}
/** Put fresh duty info in and redraw what shows it (without reloading everything). */
function applyDuty(r) {
  if (!r || !r.duty || !S.d || S.dutyPending) return;
  S.d.duty = r.duty;
  const hadTab = S.tabList && S.tabList.indexOf('board') >= 0;
  if (S.d.me.admin && hadTab !== boardWanted()) buildTabs();
  drawActBar();
  if (S.tab === 'board' && !S.boardTyping && !$('amsh') && !$('mssh')) { const y = window.scrollY; render(); window.scrollTo(0, y); }
}
function boardWanted() { return !!(S.d && S.d.me && S.d.me.admin && boardData().length); }

/* ---------------- Ticking clocks, alerts and refreshes ---------------- */
function beep() {
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    const ctx = S.audio || (S.audio = new A()); const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.4, ctx.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
    o.start(); o.stop(ctx.currentTime + 0.55);
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
}
function dutyTick() {
  if (!S.d) return;
  document.querySelectorAll('.tick[data-on]').forEach(el => { el.textContent = hm(dutyNow() - Number(el.dataset.on)); });
  if (!S.d.me.admin) return;
  S.alerted = S.alerted || {};
  let newly = [];
  boardData().forEach(g => g.on.forEach(s => {
    const di = dueInfo(s, g.every), key = s.id + '|' + (s.check || s.on);
    if (di.due && !S.alerted[key]) { S.alerted[key] = 1; newly.push(s.unit + ' ' + lastName(s.name)); }
  }));
  if (newly.length) { beep(); toast('🔔 Security check due: ' + newly.join(', '), true, 8000); }
  if (S.tab === 'board' && !S.boardTyping && !$('amsh') && !$('mssh')) {
    document.querySelectorAll('.cd').length && (() => { const y = window.scrollY; renderBoard(); window.scrollTo(0, y); })();
  }
}
async function dutyRefresh() {
  if (!S.d || !S.creds || document.hidden) return;
  try { applyDuty(await run('apiDutyStatus', S.creds)); } catch (e) {}
}
setInterval(dutyTick, 30000);
setInterval(() => { if (S.d && (S.tab === 'board' || (S.d.me && S.d.me.admin && boardData().length))) dutyRefresh(); }, 60000);
setInterval(() => { if (S.d && !(S.d.me && S.d.me.admin)) dutyRefresh(); }, 5 * 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) dutyRefresh(); });
</script>

<script>
(function () {
  var parts = { Core: typeof init === 'function', Views: typeof renderStats === 'function', Reports: typeof renderReport === 'function', Duty: typeof renderBoard === 'function' };
  var missing = Object.keys(parts).filter(function (k) { return !parts[k]; });
  if (!missing.length) { init(); return; }
  var unit = ''; try { unit = (JSON.parse(localStorage.getItem('posseCreds')) || {}).unit || ''; } catch (e) {}
  var info = { missing: missing.join(','), errs: LOAD_ERRS.slice(0, 5), ua: navigator.userAgent, unit: unit, page: location.host };
  var esc2 = function (t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
  document.getElementById('main').innerHTML = '<div class="sec"><div class="body" style="padding:16px"><h3 style="margin-top:0">The app didn\'t fully load on this phone</h3>' +
    '<p>Tap <b>Reload</b>. If this keeps happening, update your browser (Chrome: Play Store, then Update) and try again, or send a screenshot of this screen to your Commander.</p>' +
    '<button class="btn" type="button" onclick="location.reload()">Reload</button>' +
    '<p class="muted small" style="margin-top:16px;word-break:break-word">Details: missing ' + esc2(info.missing) + '. ' + esc2(LOAD_ERRS.map(function (x) { return x.m + ' (' + x.l + ':' + x.c + ')'; }).join(' | ')) + '<br>' + esc2(info.ua) + '</p></div></div>';
  try {
    if (EXEC_URL) fetch(EXEC_URL, { method: 'POST', body: JSON.stringify({ fn: 'apiClientError', args: [info] }) });
    else if (window.google && google.script && google.script.run) google.script.run.apiClientError(info);
  } catch (e) {}
})();
</script>
</body>
